<style>
/* ===== 主题 ===== */
:root{
  --bg:#0a0e19;--card:#131a2c;--bdr:#2a3550;--text:#e8e0d0;--dim:#8791a6;
  --lamp:#ffd38a;--gold:#f2b45c;--seal:#b03a2e;--paper:#f0e3c8;--ink:#2b2418;
}
html[data-theme="light"]{
  --bg:#f2e8d0;--card:#faf3e1;--bdr:#c9b285;--text:#3a2e22;--dim:#8a7a5a;
  --lamp:#c9862f;--gold:#a06a24;--seal:#b03a2e;--paper:#f0e3c8;--ink:#2b2418;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--bg);color:var(--text);
  font-family:'KaiTi','STKaiti','Microsoft YaHei',serif;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  padding:20px 14px 48px;transition:background .4s,color .4s;
}
.wrap{max-width:560px;width:100%}

/* ===== 开屏 · 灯下夜谭（暖黄宫灯） ===== */
#splash{position:fixed;inset:0;z-index:300;background:linear-gradient(180deg,#070a14,#0b1120 55%,#0a0e19);display:flex;flex-direction:column;align-items:center;justify-content:center;animation:splashFade 9s ease forwards;overflow:hidden}
@keyframes splashFade{0%{opacity:0}8%{opacity:1}72%{opacity:1}100%{opacity:0;visibility:hidden}}
.hills{position:absolute;bottom:0;left:0;right:0;opacity:.5}
.hills svg{display:block;width:100%;height:auto}
/* 灯与光（暖黄宫灯，避开蜡烛意象） */
.lamp-wrap{position:relative;width:230px;height:250px;display:flex;align-items:center;justify-content:center}
.lamp-glow{position:absolute;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(255,190,95,.32) 0%,rgba(255,170,60,.12) 38%,transparent 66%);animation:glowBreathe 3.2s ease-in-out infinite}
@keyframes glowBreathe{0%,100%{opacity:.8;transform:scale(1)}50%{opacity:1;transform:scale(1.04)}}
.lantern{position:relative;z-index:2;width:120px;height:178px;animation:lanternSway 5s ease-in-out infinite;transform-origin:50% -40px}
@keyframes lanternSway{0%,100%{transform:rotate(-2.2deg)}50%{transform:rotate(2.2deg)}}
.l-cap{position:absolute;top:0;left:50%;transform:translateX(-50%);width:98px;height:22px;background:linear-gradient(180deg,#8a6a35,#6b4f25);border-radius:6px 6px 3px 3px}
.l-cap::after{content:"";position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:34px;height:9px;background:#a5823f;border-radius:3px 3px 0 0}
.l-body{position:absolute;top:22px;left:50%;transform:translateX(-50%);width:94px;height:106px;background:radial-gradient(circle at 50% 60%,#fff0cc 0%,#ffd38a 45%,#f2a03c 85%,#c97a2a 100%);border-radius:47px;box-shadow:0 0 42px rgba(255,190,95,.55),inset 0 0 18px rgba(255,255,255,.4);overflow:hidden}
.l-rib{position:absolute;top:0;bottom:0;width:3px;background:rgba(139,94,41,.45)}
.l-base{position:absolute;top:128px;left:50%;transform:translateX(-50%);width:58px;height:13px;background:linear-gradient(180deg,#6b4f25,#4a3a18);border-radius:4px 4px 6px 6px}
.l-tassel{position:absolute;top:141px;left:50%;transform:translateX(-50%);width:2px;height:34px;background:#b03a2e}
.l-tassel::after{content:"";position:absolute;bottom:-5px;left:50%;transform:translateX(-50%) rotate(45deg);width:10px;height:10px;background:#b03a2e}
.scroll{position:relative;z-index:2;margin-top:-6px;width:300px;height:120px;background:linear-gradient(180deg,#f3e7cf,#e2d3b4);border-radius:4px;box-shadow:0 14px 40px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;overflow:hidden}
.scroll::before{content:"孤灯不明思欲绝 · 卷帷望月空长叹";position:absolute;font-size:11px;letter-spacing:3px;color:rgba(60,50,35,.5);white-space:nowrap}
.scroll .spine{position:absolute;left:0;top:0;bottom:0;width:14px;background:linear-gradient(180deg,#8a7a58,#6b5c3e);border-right:1px solid rgba(0,0,0,.15)}
.s-title{position:relative;z-index:3;font-family:'FangSong','STFangsong','KaiTi',serif;font-size:56px;color:#ffd9a0;letter-spacing:16px;writing-mode:vertical-rl;margin-top:26px;text-shadow:0 0 24px rgba(255,190,95,.55),0 0 60px rgba(255,170,60,.3)}
.s-sub{position:relative;z-index:3;font-size:19px;color:#c9a06a;letter-spacing:8px;margin-top:12px}
.s-sign{position:relative;z-index:3;font-size:12px;color:#6a7288;letter-spacing:3px;margin-top:14px}

/* ===== 顶栏 ===== */
.topbar{display:flex;justify-content:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.topbar a{color:var(--gold);font-size:14px;cursor:pointer;text-decoration:none;letter-spacing:1px;border:1px solid var(--bdr);padding:5px 14px;background:var(--card);transition:all .15s;user-select:none}
.topbar a:hover{color:var(--lamp);border-color:var(--gold)}
.topbar a.active{color:var(--lamp);border-color:var(--gold);font-weight:bold}

/* ===== 首页 ===== */
.hdr{text-align:center;margin:8px 0 22px}
.hdr h1{font-size:36px;color:var(--gold);letter-spacing:8px;font-family:'FangSong','STFangsong',serif;text-shadow:0 0 20px rgba(242,180,92,.25)}
.hdr .en{font-size:13px;color:var(--dim);letter-spacing:4px;margin-top:6px}
.hdr .slogan{font-size:14px;color:var(--gold);letter-spacing:3px;margin-top:10px}
.btn{width:100%;padding:16px;margin-top:14px;background:var(--card);color:var(--gold);border:1px solid var(--bdr);font-size:16px;font-family:inherit;cursor:pointer;letter-spacing:3px;transition:all .2s;text-align:center}
.btn:hover{border-color:var(--gold);box-shadow:0 0 18px rgba(242,180,92,.2)}
.btn.main{background:linear-gradient(135deg,rgba(242,180,92,.16),rgba(242,180,92,.04));border-color:var(--gold);font-size:17px;letter-spacing:6px}
.btn.sub{font-size:15px;letter-spacing:2px;padding:13px}
.btn.small{display:inline-block;width:auto;padding:8px 18px;margin:6px 4px 0;font-size:14px;letter-spacing:2px}

/* ===== 筛选条 ===== */
.filter{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:14px 0 4px}
.filter a{color:var(--dim);font-size:13px;cursor:pointer;text-decoration:none;letter-spacing:1px;border:1px solid var(--bdr);padding:4px 10px;background:var(--card);transition:all .15s;user-select:none}
.filter a:hover{color:var(--gold)}
.filter a.on{color:var(--lamp);border-color:var(--gold)}

/* ===== 故事卡 · 宣纸书页 ===== */
.card{background:linear-gradient(180deg,var(--paper),var(--paper));border:1px solid var(--bdr);padding:30px 28px 26px;margin-bottom:16px;position:relative;box-shadow:0 10px 34px rgba(0,0,0,.35);border-radius:2px}
html[data-theme="light"] .card{box-shadow:0 8px 26px rgba(90,70,40,.18)}
.card::after{content:"";position:absolute;inset:6px;border:1px solid rgba(140,110,70,.28);pointer-events:none;border-radius:1px}
.card .src{font-size:13px;color:#8a7a58;letter-spacing:3px;margin-bottom:14px;text-align:center}
.card .vtitle{font-family:'FangSong','STFangsong','KaiTi',serif;font-size:31px;color:#5a4a30;letter-spacing:8px;text-align:center;margin-bottom:18px;font-weight:bold}
.tale-img{width:100%;height:150px;border:1px dashed #c9b285;border-radius:3px;display:flex;align-items:center;justify-content:center;margin-bottom:16px;background:rgba(140,110,70,.06);position:relative;overflow:hidden}
.tale-img.has{border-style:solid;padding:0;background:#e8d9b8}
.tale-img img{width:100%;height:100%;object-fit:cover;display:block}
.img-ph{font-size:15px;color:#a09070;letter-spacing:5px;font-family:'KaiTi',serif}
.card .orig{font-size:16px;color:#6b5c42;line-height:2.1;letter-spacing:1px;text-align:justify;border-left:3px solid #c9b285;padding:2px 0 2px 14px;margin-bottom:16px;font-family:'FangSong','STFangsong',serif}
.card .white{font-size:17px;color:#3a2e22;line-height:2.05;letter-spacing:.6px;text-align:justify}
.card .divider{display:flex;align-items:center;gap:10px;margin:18px 0;color:#b0a080}
.card .divider::before,.card .divider::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,#c9b285,transparent)}
.card .wu{font-size:16px;color:#6b5c42;line-height:2;font-style:italic;letter-spacing:1px}
.card .wu b{color:#8a4a30;font-style:normal}
.card .mirror-q{margin-top:16px;padding:14px 16px;background:rgba(140,110,70,.1);border:1px dashed #c9b285;font-size:16px;color:#5a4a30;line-height:1.9;letter-spacing:.5px}
.card .mirror-q b{color:#8a4a30}
.opts{margin-top:14px}
.opt{width:100%;padding:13px 15px;margin-top:10px;background:rgba(140,110,70,.07);border:1px solid #c9b285;color:#5a4a30;font-size:15.5px;font-family:inherit;letter-spacing:1px;line-height:1.85;cursor:pointer;text-align:left;transition:all .2s;border-radius:2px}
.opt:hover{background:rgba(176,58,46,.08);border-color:#b03a2e;color:#8a4a30}
.opt.picked{background:#b03a2e;color:#f5e9d5;border-color:#b03a2e}
.opt.picked:hover{background:#c24436;color:#fff}
.mirror-r{margin-top:12px;padding:14px 16px;background:rgba(176,58,46,.08);border:1px solid rgba(176,58,46,.35);font-size:16px;color:#8a4a30;line-height:2;letter-spacing:.5px;border-radius:2px}
.mirror-r b{color:#b03a2e}
.card .foot-row{display:flex;justify-content:space-between;align-items:center;margin-top:18px}
.card .seal{width:34px;height:34px;background:#b03a2e;color:#f5e9d5;display:flex;align-items:center;justify-content:center;font-size:11px;letter-spacing:1px;border-radius:3px;font-family:'KaiTi',serif;box-shadow:0 2px 8px rgba(176,58,46,.4)}
.card .pageno{font-size:13px;color:#a09070;letter-spacing:2px}
.card .act-row{display:flex;gap:8px;margin-top:10px}
.card .act-row .btn{flex:1;margin-top:0;padding:12px 6px;font-size:15px;letter-spacing:2px}
.card .act-row .btn.faved{background:rgba(176,58,46,.15);border-color:var(--seal);color:#b03a2e}
.note{font-size:13px;color:var(--dim);text-align:center;letter-spacing:2px;margin-top:10px}

/* ===== 收藏列表 ===== */
.fav-item{width:100%;padding:15px 16px;margin-top:12px;background:var(--card);border:1px solid var(--bdr);color:var(--text);font-size:16px;font-family:inherit;letter-spacing:1px;cursor:pointer;text-align:left;transition:all .2s;border-radius:2px;line-height:1.7}
.fav-item:hover{border-color:var(--gold)}
.fav-item .fs{display:block;font-size:12px;color:var(--dim);letter-spacing:2px;margin-top:3px}

/* ===== Modal ===== */
.modal-overlay{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.show{display:flex}
.modal-box{background:var(--card);border:1px solid var(--gold);max-width:520px;width:100%;max-height:82vh;overflow-y:auto;padding:26px 24px;position:relative;border-radius:3px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal-box h3{color:var(--gold);letter-spacing:4px;margin-bottom:16px;font-size:20px;text-align:center}
.modal-box p,.modal-box li{font-size:15px;line-height:2.05;color:var(--text);letter-spacing:.5px}
.modal-box ul{padding-left:20px;margin:8px 0}
.modal-close{position:absolute;top:12px;right:16px;font-size:20px;color:var(--dim);cursor:pointer;background:none;border:none}
.modal-close:hover{color:var(--gold)}
.share-img{width:100%;border-radius:3px;box-shadow:0 8px 30px rgba(0,0,0,.4);margin-top:8px}
.hidden{display:none}
.foot{margin-top:22px;text-align:center;color:var(--dim);font-size:12px;letter-spacing:2px;line-height:2}
.foot a{color:var(--dim);text-decoration:none}
.foot a:hover{color:var(--gold)}

/* ===== 灯影 ===== */
.card::before{content:"";position:absolute;top:-46px;right:-36px;width:200px;height:200px;background:radial-gradient(circle,rgba(242,180,92,.16),transparent 68%);pointer-events:none}

/* ===== 搜索 ===== */
.search-row{margin:12px 0 2px;text-align:center}
.search-row input{width:88%;max-width:420px;padding:11px 16px;background:var(--card);border:1px solid var(--bdr);color:var(--text);font-size:15px;font-family:inherit;letter-spacing:1px;border-radius:2px;outline:none;transition:all .2s}
.search-row input:focus{border-color:var(--gold);box-shadow:0 0 14px rgba(242,180,92,.2)}
.search-row input::placeholder{color:var(--dim)}

/* ===== 字体三档 ===== */
body[data-fs="0"] .card .white{font-size:15.5px}
body[data-fs="0"] .card .orig,body[data-fs="0"] .card .wu,body[data-fs="0"] .card .mirror-q,body[data-fs="0"] .mirror-r{font-size:15px}
body[data-fs="0"] .opt{font-size:14.5px}
body[data-fs="0"] .card .vtitle{font-size:29px}
body[data-fs="2"] .card .white{font-size:19px}
body[data-fs="2"] .card .orig,body[data-fs="2"] .card .wu,body[data-fs="2"] .card .mirror-q,body[data-fs="2"] .mirror-r{font-size:18px}
body[data-fs="2"] .opt{font-size:17px}
body[data-fs="2"] .card .vtitle{font-size:34px}

/* ===== 打卡 & 最近 ===== */
.streak-line{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:12px;font-size:14px;color:var(--gold);letter-spacing:1px;flex-wrap:wrap}
.streak-line .badge{display:inline-block;padding:3px 10px;border:1px solid var(--gold);border-radius:2px;background:rgba(242,180,92,.1);font-size:13px}
.recent-line{margin-top:8px;text-align:center;font-size:12px;color:var(--dim);letter-spacing:1px}
.recent-line a{color:var(--dim);text-decoration:none;border-bottom:1px dotted var(--bdr);margin:0 4px;cursor:pointer}
.recent-line a:hover{color:var(--gold)}

/* ===== 心性画像页 ===== */
.heart-hero{text-align:center;padding:10px 0 6px}
.heart-avatar{width:96px;height:96px;margin:0 auto 12px;border-radius:50%;border:3px solid #b8914f;background:radial-gradient(circle at 38% 32%,#ffe9b8,#d9a45c 68%,#8a6a35);display:flex;align-items:center;justify-content:center;font-size:44px;box-shadow:0 0 34px rgba(242,180,92,.35),inset 0 0 0 4px rgba(255,255,255,.2);overflow:hidden;background-size:cover;background-position:center}
.heart-avatar.img{background-image:var(--av);background-size:cover;background-position:center}
.heart-name{font-size:22px;color:var(--gold);letter-spacing:3px;font-family:'FangSong','STFangsong','KaiTi',serif}
.heart-word{margin:12px auto 0;max-width:520px;font-size:15.5px;color:var(--text);line-height:2;letter-spacing:.6px;padding:12px 16px;background:rgba(140,110,70,.09);border:1px dashed var(--bdr)}
.bar-row{display:flex;align-items:center;gap:10px;margin-top:12px}
.bar-row .bk{width:92px;font-size:13.5px;color:var(--text);letter-spacing:1px;text-align:right;flex:none}
.bar-row .bt{flex:1;height:14px;background:rgba(140,110,70,.14);border-radius:7px;overflow:hidden;position:relative}
.bar-row .bf{height:100%;border-radius:7px;width:0;transition:width .6s ease}
.bar-row .bn{width:44px;font-size:13px;color:var(--dim);text-align:left;flex:none}
.heart-stats{text-align:center;margin-top:14px;font-size:13px;color:var(--dim);letter-spacing:1px}

/* ===== 签筒晃动 ===== */
@keyframes shakeBook{0%,100%{transform:rotate(0)}20%{transform:rotate(-2.2deg) translateX(-3px)}40%{transform:rotate(2.2deg) translateX(3px)}60%{transform:rotate(-1.6deg)}80%{transform:rotate(1.6deg)}}
#vHome.shaking{animation:shakeBook .5s ease}
</style>
</head>

<!-- 开屏 · 灯下夜谭（暖黄宫灯 + 书卷 + 远山） -->
<div id="splash">
  <div class="lamp-wrap">
    <div class="lamp-glow"></div>
    <div class="lantern">
      <div class="l-cap"></div>
      <div class="l-body">

      <div class="l-tassel"></div>
    </div>

<div class="wrap">

try{ HEART=JSON.parse(localStorage.getItem('zqHeart')||'[0,0,0,0,0,0]'); }catch(e){ HEART=[0,0,0,0,0,0]; }

try{ STREAK=JSON.parse(localStorage.getItem('zqStreak')||'{"d":"","n":0}'); }catch(e){ STREAK={d:'',n:0}; }

try{ RECENT=JSON.parse(localStorage.getItem('zqRecent')||'[]'); }catch(e){ RECENT=[]; }

 {k:'rui',zh:'锐 · 破局',en:'Sharp · Breakthrough',icon:'🗡️',color:'#c0392b',

 {k:'cang',zh:'藏 · 绵针',en:'Hidden · Needle',icon:'🎯',color:'#8a4a30',

// ===== I18N =====

function t(k){ return (I18N[lang]&&I18N[lang][k])||I18N.zh[k]; }
function setLang(l){
  lang=l;
  document.getElementById('btnZh').classList.toggle('active',l==='zh');
  document.getElementById('btnEn').classList.toggle('active',l==='en');
  document.getElementById('slogan').textContent=t('slogan');
  document.getElementById('hIntroText').innerHTML=t('intro');
  document.getElementById('tSound').textContent=t('sound');
  document.getElementById('tUse').textContent=t('use');
  document.getElementById('tDisclaim').textContent=t('disclaim');
  document.getElementById('tAbout').textContent=t('about');
  document.getElementById('tDaily').textContent=t('daily');
  document.getElementById('tRandom').textContent=t('random');
  document.getElementById('tFav').textContent=t('fav');
  document.getElementById('tFav2').textContent=t('fav2');
  document.getElementById('tShare').textContent=t('share');
  document.getElementById('tFavTitle').textContent=t('favTitle');
  document.getElementById('favEmpty').textContent=t('favEmpty');
  document.getElementById('tBack').textContent=t('back');
  document.getElementById('tNext').textContent=t('next');
  document.getElementById('hNote').textContent=t('note');
  document.getElementById('tHeart').textContent=t('heart');
  document.getElementById('tHeartT').textContent=t('heartT');
  document.getElementById('tShareH').textContent=t('hShare');
  document.getElementById('tResetH').textContent=t('hReset');
  document.getElementById('tBack2').textContent=t('back');
  document.getElementById('searchBox').placeholder=t('search');
  renderFilters();
  renderStreak(); renderRecent();
  // 语言切换时重渲染当前故事
  if(cur>=0 && !document.getElementById('vTale').classList.contains('hidden')){
    openTale(cur);
  }
  try{ localStorage.setItem('zqLang',lang); }catch(e){}

// ===== 主题 =====
function applyTheme(t){document.documentElement.setAttribute('data-theme',t);document.getElementById('btnTheme').textContent=t==='dark'?'☀️':'🌙';}
function toggleTheme(){const c=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';applyTheme(c);try{localStorage.setItem('zqTheme',c);}catch(e){}}
// ===== 音乐 =====
let soundOn=true, bgmReady=false;
function initBgm(){
  const b=document.getElementById('bgm');
  if(!b) return;
  b.volume=0.25;
  const start=function(){ if(soundOn && !bgmReady){ b.play().then(function(){bgmReady=true;}).catch(function(){}); } };
  document.addEventListener('click',start,{once:true});
  document.addEventListener('touchstart',start,{once:true});
  window.setTimeout(start,600);
}
function toggleSound(){
  const b=document.getElementById('bgm');
  soundOn=!soundOn;
  if(soundOn){ b.play().catch(function(){}); }
  else { b.pause(); }
  document.getElementById('btnSound').style.color=soundOn?'':'#888';
}
// ===== 筛选 =====
const SRC_KEYS=['all','soushen','houji','shishuo','liaozhai','other'];
function srcKey(s){
  if(s.indexOf('搜神记')>-1 && s.indexOf('后记')<0) return 'soushen';
  if(s.indexOf('搜神后记')>-1) return 'houji';
  if(s.indexOf('世说')>-1) return 'shishuo';
  if(s.indexOf('聊斋')>-1) return 'liaozhai';
  return 'other';
}
function renderFilters(){
  const box=document.getElementById('filters');
  box.innerHTML=SRC_KEYS.map(function(k,i){
    return '<a class="'+(favFilter===k?'on':'')+'" onclick="setFilter(\''+k+'\')">'+t('ta')[i]+'</a>';
  }).join('');
}
function setFilter(k){
  favFilter=k; renderFilters();
  cur=-1;
  const seq=getSeq();
  if(seq.length>0) openTale(seq[0]);
}
function getSeq(){
  var q=searchQ.trim();
  if(q){
    var hits=[];
    TALES.forEach(function(d,i){
      var hay=(d.t+' '+d.s+' '+(d.en_t||'')+' '+(d.en_s||'')).toLowerCase();
      if(hay.indexOf(q.toLowerCase())>-1) hits.push(i);
    });
    return hits;
  }
  if(favFilter==='all') return TALES.map(function(_,i){return i;});
  const out=[];
  TALES.forEach(function(d,i){ if(srcKey(d.s)===favFilter) out.push(i); });
  return out;
}
function onSearch(v){
  searchQ=v; renderFilters();
  const seq=getSeq();
  const note=document.getElementById('hNote');
  if(searchQ.trim()){
    note.textContent=seq.length>0?(lang==='zh'?'找到 '+seq.length+' 卷奇谭 · 回车翻开第一则':'Found '+seq.length+' tales · Enter to open'):(lang==='zh'?'没有找到，换个词试试':'Nothing found, try another word');
  } else { note.textContent=t('note'); }
}
function enterSearch(){
  const seq=getSeq();
  if(seq.length>0) openTale(seq[0]);
}

// ===== 每日一谭 =====
function dayStr(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function yesterdayStr(){ const d=new Date(); d.setDate(d.getDate()-1); return dayStr(d); }
function bumpStreak(){
  const today=dayStr(new Date());
  if(STREAK.d===today) return;
  STREAK.n=(STREAK.d===yesterdayStr())?STREAK.n+1:1;
  STREAK.d=today;
  try{ localStorage.setItem('zqStreak',JSON.stringify(STREAK)); }catch(e){}
}
function renderStreak(){
  const el=document.getElementById('streakLine'); if(!el) return;
  const badge=STREAK.n>=81?t('badge81'):STREAK.n>=21?t('badge21'):STREAK.n>=7?t('badge7'):null;
  const badgeHtml=badge?' <span class="badge">'+badge+'</span>':'';
  el.innerHTML=STREAK.n>0?'🔥 <b>'+t('streak')+' '+STREAK.n+t('days')+'</b>'+badgeHtml:'<span style="color:var(--dim)">'+t('streak0')+'</span>';
}
function recordRecent(i){
  RECENT=RECENT.filter(function(x){return x!==i;});
  RECENT.unshift(i);
  if(RECENT.length>5) RECENT.pop();
  try{ localStorage.setItem('zqRecent',JSON.stringify(RECENT)); }catch(e){}
  renderRecent();
}
function renderRecent(){
  const el=document.getElementById('recentLine'); if(!el) return;
  if(!RECENT.length){ el.innerHTML=''; return; }
  const E=(lang==='en');
  el.innerHTML=t('recent')+'：'+RECENT.map(function(i){
    const d=TALES[i];
    return '<a onclick="openTale('+i+')">'+(E?(d.en_t||d.t):d.t)+'</a>';
  }).join('');
}
function dailyTale(){
  const now=new Date();
  const seed=now.getFullYear()*1000+now.getMonth()*50+now.getDate();
  const seq=getSeq();
  if(!seq.length){ return; }
  openTale(seq[seed%seq.length]);
}
function turnRandom(){
  const seq=getSeq();
  if(!seq.length){ return; }
  const h=document.getElementById('vHome');
  h.classList.remove('shaking'); void h.offsetWidth; h.classList.add('shaking');
  openTale(seq[Math.floor(Math.random()*seq.length)]);
}
function nextTale(){
  const seq=getSeq();
  if(!seq.length){ return; }
  let pos=seq.indexOf(cur);
  if(pos<0){ pos=-1; }
  openTale(seq[(pos+1)%seq.length]);
}
function prevTale(){
  const seq=getSeq();
  if(!seq.length){ return; }
  let pos=seq.indexOf(cur);
  if(pos<0){ pos=0; }
  openTale(seq[(pos-1+seq.length)%seq.length]);
}

// ===== 渲染故事 =====
function openTale(i){
  cur=i;
  const d=TALES[cur];
  const E=(lang==='en');
  document.getElementById('tSrc').textContent = E?(d.en_s||d.s):d.s;
  document.getElementById('tTitle').textContent = E?(d.en_t||d.t):d.t;
  const imgEl=document.getElementById('tImg');
  if(d.img){ imgEl.classList.add('has'); imgEl.innerHTML='<img src="generated-images/'+d.img+'" alt="" loading="lazy">'; }
  else { imgEl.classList.remove('has'); imgEl.innerHTML='<span class="img-ph">✦ 此卷待绘 ✦</span>'; }
  document.getElementById('tOrig').textContent = E?(d.en_o||d.o):d.o;
  document.getElementById('tWhite').textContent = E?(d.en_w||d.w):d.w;
  document.getElementById('tWu').innerHTML='<b>'+t('wu')+' ·</b> '+(E?(d.en_u||d.u):d.u);
  document.getElementById('tQ').innerHTML='<b>'+t('q')+'</b> '+(E?(d.en_q||d.q):d.q);
  const ops=d.opts||[];
  document.getElementById('tOpts').innerHTML=ops.map(function(o,oi){
    return '<button class="opt" onclick="pickOpt('+oi+')">'+(E?(o.ea||o.a):o.a)+'</button>';
  }).join('');
  const rEl=document.getElementById('tR');
  rEl.classList.add('hidden'); rEl.innerHTML='';
  document.getElementById('tPage').textContent=t('ta')[SRC_KEYS.indexOf(srcKey(d.s))]+(E?' · Tale ':' · 第 ')+(cur+1)+' / '+(E?'of':'共 ')+TALES.length+(E?'':' 卷');
  const bf=document.getElementById('btnFav');
  bf.classList.toggle('faved',FAV.indexOf(cur)>-1);
  bf.innerHTML=(FAV.indexOf(cur)>-1?'♥ ':'♡ ')+'<span id="tFav2">'+(FAV.indexOf(cur)>-1?t('favOn'):t('favOff'))+'</span>';
  bumpStreak(); renderStreak(); recordRecent(cur);
  document.getElementById('vHome').classList.add('hidden');
  document.getElementById('vFav').classList.add('hidden');
  document.getElementById('vHeart').classList.add('hidden');
  document.getElementById('vTale').classList.remove('hidden');
  window.scrollTo({top:0,behavior:'smooth'});
}
function pickOpt(i){
  const d=TALES[cur];
  const E=(lang==='en');
  const btns=document.querySelectorAll('.opt');
  btns.forEach(function(b,j){ b.classList.toggle('picked',j===i); });
  const rEl=document.getElementById('tR');
  rEl.innerHTML='<b>'+t('r')+'</b> '+(E?(d.opts[i].er||d.opts[i].r):(d.opts[i].r||''));
  rEl.classList.remove('hidden');
  // 心性统计（按选项索引 0-5 映射六维）
  if(i>=0&&i<=5){ HEART[i]+=1; try{ localStorage.setItem('zqHeart',JSON.stringify(HEART)); }catch(e){} }
}

// ===== 收藏 =====
function saveFav(){ try{ localStorage.setItem('zqFav',JSON.stringify(FAV)); }catch(e){} }
function toggleFav(){
  const p=FAV.indexOf(cur);
  if(p>-1){ FAV.splice(p,1); } else { FAV.push(cur); }
  saveFav();
  const bf=document.getElementById('btnFav');
  bf.classList.toggle('faved',FAV.indexOf(cur)>-1);
  bf.innerHTML=(FAV.indexOf(cur)>-1?'♥ ':'♡ ')+'<span id="tFav2">'+(FAV.indexOf(cur)>-1?t('favOn'):t('favOff'))+'</span>';
}
function showFav(){
  const box=document.getElementById('favList');
  document.getElementById('favEmpty').textContent = FAV.length? '' : t('favEmpty');
  box.innerHTML=FAV.map(function(i){
    const d=TALES[i];
    const E=(lang==='en');
    return '<button class="fav-item" onclick="openTale('+i+')">'+(E?(d.en_t||d.t):d.t)+'<span class="fs">'+(E?(d.en_s||d.s):d.s)+'</span></button>';
  }).join('');
  document.getElementById('vHome').classList.add('hidden');
  document.getElementById('vTale').classList.add('hidden');
  document.getElementById('vHeart').classList.add('hidden');
  document.getElementById('vFav').classList.remove('hidden');
  window.scrollTo({top:0,behavior:'smooth'});
}
function goHome(){
  document.getElementById('vFav').classList.add('hidden');
  document.getElementById('vTale').classList.add('hidden');
  document.getElementById('vHeart').classList.add('hidden');
  document.getElementById('vHome').classList.remove('hidden');
  window.scrollTo({top:0,behavior:'smooth'});
}

// ===== 灯下心性画像 =====
function heartTotal(){ return HEART.reduce(function(a,b){return a+b;},0); }
function showHeart(){
  renderHeart();
  document.getElementById('vHome').classList.add('hidden');
  document.getElementById('vFav').classList.add('hidden');
  document.getElementById('vTale').classList.add('hidden');
  document.getElementById('vHeart').classList.remove('hidden');
  window.scrollTo({top:0,behavior:'smooth'});
}
function topHeart(){
  var bi=0; HEART.forEach(function(n,i){ if(n>HEART[bi]) bi=i; });
  return bi;
}
function renderHeart(){
  const total=heartTotal();
  const E=(lang==='en');
  const el=document.getElementById('hAvatar');
  const top=topHeart();
  // 头像：预留 AI 图（persona_rui.jpg 等），有则用图，无则 emoji 圆镜
  const AV={'rui':'rui','wen':'wen','ren':'ren','zhi':'zhi','shen':'shen','cang':'cang'};
  const avFile='generated-images/heart_'+AV[HEART_TYPES[top].k]+'.jpg';
  const probe=new Image();
  probe.onload=function(){ el.classList.add('img'); el.style.backgroundImage="url('"+avFile+"')"; el.textContent=''; };
  probe.onerror=function(){ el.classList.remove('img'); el.style.backgroundImage=''; el.textContent=HEART_TYPES[top].icon; };
  probe.src=avFile;
  document.getElementById('hName').textContent=E?HEART_TYPES[top].en:HEART_TYPES[top].zh;
  document.getElementById('hWord').textContent=E?HEART_TYPES[top].eword:HEART_TYPES[top].zword;
  document.getElementById('hStats').textContent=total>0?t('hStats').replace('{n}',total):'';
  const bars=document.getElementById('hBars');
  if(total>0){
    bars.innerHTML=HEART_TYPES.map(function(h,i){
      const pct=Math.round(HEART[i]/total*100);
      return '<div class="bar-row"><div class="bk">'+h.icon+' '+(E?h.en.split(' · ')[0]:h.zh.split(' · ')[0])+'</div><div class="bt"><div class="bf" data-w="'+pct+'" style="width:0;background:'+h.color+'"></div></div><div class="bn">'+pct+'%</div></div>';
    }).join('');
    setTimeout(function(){
      bars.querySelectorAll('.bf').forEach(function(b){ b.style.width=b.getAttribute('data-w')+'%'; });
    },80);
  } else {
    bars.innerHTML='<div class="note" style="margin-top:18px">'+t('noHeart')+'</div>';
  }
}
function resetHeart(){
  HEART=[0,0,0,0,0,0];
  try{ localStorage.setItem('zqHeart',JSON.stringify(HEART)); }catch(e){}
  renderHeart();
}
function genHeartCard(){
  const total=heartTotal();
  if(!total){ toastHeart(t('noHeart')); return; }
  const E=(lang==='en');
  const top=topHeart(), h=HEART_TYPES[top];

function drawLantern(ctx,cx,cy){
  // 光晕
  const g=ctx.createRadialGradient(cx,cy,6,cx,cy,150);
  g.addColorStop(0,'rgba(255,214,120,.5)'); g.addColorStop(1,'rgba(255,214,120,0)');
  ctx.fillStyle=g; ctx.fillRect(cx-160,cy-160,320,320);
  // 顶盖
  ctx.fillStyle='#8a6a35';
  ctx.beginPath(); ctx.moveTo(cx-34,cy-66); ctx.lineTo(cx+34,cy-66); ctx.lineTo(cx+24,cy-50); ctx.lineTo(cx-24,cy-50); ctx.closePath(); ctx.fill();
  // 灯身
  const lg=ctx.createLinearGradient(cx-42,0,cx+42,0);
  lg.addColorStop(0,'#d98d2b'); lg.addColorStop(.5,'#ffe9b0'); lg.addColorStop(1,'#c47a1f');
  ctx.fillStyle=lg;
  ctx.beginPath();
  ctx.moveTo(cx-24,cy-50);
  ctx.quadraticCurveTo(cx-44,cy-6,cx-24,cy+54);
  ctx.lineTo(cx+24,cy+54);
  ctx.quadraticCurveTo(cx+44,cy-6,cx+24,cy-50);
  ctx.closePath(); ctx.fill();
  // 灯骨
  ctx.strokeStyle='rgba(138,106,53,.55)'; ctx.lineWidth=2;
  [-18,0,18].forEach(function(dx){
    ctx.beginPath(); ctx.moveTo(cx+dx,cy-50);
    ctx.quadraticCurveTo(cx+dx*1.15,cy, cx+dx, cy+54); ctx.stroke();
  });
  // 底座
  ctx.fillStyle='#8a6a35';
  ctx.beginPath(); ctx.moveTo(cx-26,cy+54); ctx.lineTo(cx+26,cy+54); ctx.lineTo(cx+20,cy+68); ctx.lineTo(cx-20,cy+68); ctx.closePath(); ctx.fill();
  // 流苏
  ctx.strokeStyle='#b03a2e'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(cx-8,cy+68); ctx.lineTo(cx-8,cy+96); ctx.moveTo(cx+8,cy+68); ctx.lineTo(cx+8,cy+96); ctx.stroke();
  ctx.fillStyle='#b03a2e';
  ctx.fillRect(cx-12,cy+96,24,6);
  ctx.beginPath(); ctx.moveTo(cx-12,cy+102); ctx.lineTo(cx+12,cy+102); ctx.lineTo(cx,cy+116); ctx.closePath(); ctx.fill();
}

function stripHtml(s){ return s.replace(/<[^>]*>/g,''); }
function wrapText(ctx,str,x,y,maxW,lineH,maxLines){
  const chars=str.split('');
  let line='', y0=y, lines=0;
  for(let i=0;i<chars.length;i++){
    line+=chars[i];
    if(ctx.measureText(line).width>maxW){
      line=line.slice(0,-1);
      ctx.fillText(line,x,y0); y0+=lineH; lines++;
      line=chars[i];
      if(lines>=maxLines){ return y0; }
    }
  }
  if(line){ ctx.fillText(line,x,y0); y0+=lineH; }
  return y0;
}

 u:"善行未必立刻有报，但天地总记得那个「恭慎自守」的人。",
 q:"你在没人看见的时候，还在坚持做对的事吗？你信不信，「默默的好」会被这人间、或那天，一一看在眼里？",
 en_s:"Soushen Houji · Scroll 5",en_t:"The White Water Maiden",en_o:"In the reign of Emperor An of Jin, Xie Duan of Houguan... found a great spiral shell as large as a three-sheng jug. Taking it for something strange, he brought it home and kept it in a jar. Returning from the fields day after day, he found meals cooked and water heated, as if by a living hand... Peeping through the fence, he saw a maiden step out of the shell... She said: I am the White Water Maiden of the Heavenly River. The Emperor of Heaven pitied your lonely orphanhood and your reverent self-restraint, so he sent me to keep your house and cook for you.",en_w:"Xie Duan, orphaned and poor, brought home a great shell and kept it in a jar. Every day he came back from the fields to find supper ready. Peeping, he saw a maiden step out of the shell—she was the White Water Maiden, sent by Heaven to keep house for a reverent, self-disciplined man.",en_u:"Good deeds may not be repaid at once, but Heaven keeps an account of those who stay reverent when no one is watching.",en_q:"Do you still do the right thing when no one sees? Do you believe the quiet good is being noted, by the world or by Heaven?",opts:[
  {a:"没人看见也做对的事，信天地有记",r:"素女不来，你也一样过。这份不为报酬的善，本身就是你的素女——你已经活成了自己的报偿。",ea:"没人看见也做对的事，信天地有记",er:"素女不来，你也一样过。这份不为报酬的善，本身就是你的素女——你已经活成了自己的报偿。"},
  {a:"做了好事，心里还是盼着被看见",r:"承认期待不丢人。只是把秤放在别人手里，称出来的欢喜容易忽高忽低，忽冷忽热。",ea:"做了好事，心里还是盼着被看见",er:"承认期待不丢人。只是把秤放在别人手里，称出来的欢喜容易忽高忽低，忽冷忽热。"},
  {a:"看情况——有回报就做，没有就算了",r:"交换式的善良最不吃亏，也最不容易欠谁。只是夜深人静时，你的螺壳里不会有人替你留饭。",ea:"看情况——有回报就做，没有就算了",er:"交换式的善良最不吃亏，也最不容易欠谁。只是夜深人静时，你的螺壳里不会有人替你留饭。"},
  {a:"默默做好事，却忍不住偷偷观察有没有人发现",r:"你不是图报酬，是图「被懂得」。这比图钱更让人心软，也更容易让人失望——懂你的人，往往到得很晚。",ea:"默默做好事，却忍不住偷偷观察有没有人发现",er:"你不是图报酬，是图「被懂得」。这比图钱更让人心软，也更容易让人失望——懂你的人，往往到得很晚。"},
  {a:"只对值得的人好——我的善良要留给懂的人",r:"你把善行当投资，讲究对象。聪明，但「值得」二字，常常要等很多年后才看得清，那时素女已经走了。",ea:"只对值得的人好——我的善良要留给懂的人",er:"你把善行当投资，讲究对象。聪明，但「值得」二字，常常要等很多年后才看得清，那时素女已经走了。"},
  {a:"做了好事反而怕人知道，怕被说「装」",r:"你连善良都要藏起来，怕被误解。这世道把人教得学会了把好心裹上刺——可谢端那样的傻子，偏偏等来了素女。",ea:"做了好事反而怕人知道，怕被说「装」",er:"你连善良都要藏起来，怕被误解。这世道把人教得学会了把好心裹上刺——可谢端那样的傻子，偏偏等来了素女。"}
 ]},
{s:"《世说新语 · 任诞》",t:"雪夜访戴",img:"tale_02.jpg",
 o:"王子猷居山阴，夜大雪，眠觉，开室命酌酒，四望皎然。因起彷徨，咏左思《招隐诗》。忽忆戴安道。时戴在剡，即便夜乘小舟就之。经宿方至，造门不前而返。人问其故，王曰：「吾本乘兴而行，兴尽而返，何必见戴？」",
 w:"王徽之住在山阴，夜里大雪，醒来饮酒赏雪，忽然想起好友戴逵，连夜乘小船去拜访。走了一夜才到门口，却不上前敲门，转身回去了。别人问他为什么，他说：「我乘兴而去，兴尽而归，何必非要见到他？」",
 u:"有些事的意义，在「兴」本身，不在那个结果。",
 q:"你做一件事，是只冲着「结果」去的，还是也珍惜「过程」本身？一趟没有抵达终点的奔赴，在你的账本上，算不算浪费？",
 en_s:"Shishuo Xinyu · Ren Dan",en_t:"A Night Visit in Snow",en_o:"Wang Ziyou lived at Shanyin. One night heavy snow fell; waking, he opened the room, ordered wine, and looked at the vast whiteness. Restless, he recited Zuo Si's Summoning the Hermit. Suddenly he remembered Dai Andao, who was at Shan. That very night he took a small boat and went. After a whole night he arrived—but at the gate he turned back without knocking. Asked why, he said: I went on the spur of delight; the delight spent, I return. Why must I see Dai?",en_w:"Wang Huizhi, in a sudden night of snow, thought of his friend Dai Kui and set off by boat at once. He travelled all night, reached the door—and turned back without knocking. I went on delight; the delight is gone; why must I see him?",en_u:"Some things matter in the rising to it itself, not in the outcome.",en_q:"Do you do things for the result alone, or for the journey? In your ledger, is a journey that never arrives a waste?",opts:[
  {a:"来都来了——走到门口，当然要敲门",r:"你活在结果里，每一步都要有交代。踏实，只是有时也错过了雪夜本身的兴味——门敲开了，雪却停了。",ea:"来都来了——走到门口，当然要敲门",er:"你活在结果里，每一步都要有交代。踏实，只是有时也错过了雪夜本身的兴味——门敲开了，雪却停了。"},
  {a:"兴尽即返——见不见面，雪已经看过了",r:"你珍惜「兴」本身。在功利的世界里，你给自己留了一方「何必」的余地，这是你身上最难得的东西。",ea:"兴尽即返——见不见面，雪已经看过了",er:"你珍惜「兴」本身。在功利的世界里，你给自己留了一方「何必」的余地，这是你身上最难得的东西。"},
  {a:"会在「要不要出门」里纠结一夜，最后没去",r:"你在「开始」里消耗最多——船还没划，先想了一百种结局。其实船一旦出去，雪夜会替你回答。",ea:"会在「要不要出门」里纠结一夜，最后没去",er:"你在「开始」里消耗最多——船还没划，先想了一百种结局。其实船一旦出去，雪夜会替你回答。"},
  {a:"出门前先发消息问对方在不在，免得白跑",r:"你总想把变量控制好，连惊喜也要算计到位。稳妥，但也让雪夜少了那点不期而遇的滋味。",ea:"出门前先发消息问对方在不在，免得白跑",er:"你总想把变量控制好，连惊喜也要算计到位。稳妥，但也让雪夜少了那点不期而遇的滋味。"},
  {a:"去了，到门口又犹豫——最后还是敲了",r:"你常在门口站一会儿——既要结果，又舍不得那股兴。这种拉扯不是优柔，恰恰是你最像人的地方。",ea:"去了，到门口又犹豫——最后还是敲了",er:"你常在门口站一会儿——既要结果，又舍不得那股兴。这种拉扯不是优柔，恰恰是你最像人的地方。"},
  {a:"半路被别处的风景带走，把戴安道忘了",r:"你是容易被沿途带走的人。不是薄情，是你的心总被新鲜勾着——好在，你也是活得最尽兴的一个。",ea:"半路被别处的风景带走，把戴安道忘了",er:"你是容易被沿途带走的人。不是薄情，是你的心总被新鲜勾着——好在，你也是活得最尽兴的一个。"}
 ]},
{s:"《搜神记 · 卷十一》",t:"干将莫邪",img:"tale_03.jpg",
 o:"楚干将、莫邪为楚王作剑，三年乃成。王怒，欲杀之。……莫邪子名赤比，后壮，乃问其母曰：「吾父所在？」母曰：「汝父为楚王作剑，三年乃成，王怒，杀之。去时嘱我：语汝子出户望南山，松生石上，剑在其背。」……客持头往见楚王，王大喜。客曰：「此乃勇士头也，当于汤镬煮之。」王如其言煮头，三日三夜不烂。……客以剑拟王，王头随堕汤中，客亦自拟己头，头复堕汤中。",
 w:"干将莫邪为楚王铸剑三年才成，楚王怒而杀干将。其子赤比长大后，按父亲遗言找到藏剑，立志复仇。一位侠客帮他带着头去见楚王，在鼎中煮了三天三夜不烂，侠客趁机一剑斩下楚王头，自己也自刎——三头同落汤中，同归于尽。",
 u:"有些债，是要用一生去还的。复仇的尽头，没有赢家，只有三个人头在汤里滚。",
 q:"你心里有没有一笔「过了很多年还记着」的旧账？为它付出多少，才算值得？而「放下」两个字，你是不是一直说不出口？",
 en_s:"Soushen Ji · Scroll 11",en_t:"Gan Jiang, Mo Ye, and the Avenger",en_o:"Gan Jiang and Mo Ye of Chu forged swords for the King of Chu; three years they took, and the King in wrath would kill him... Their son Chi Bi, grown, asked his mother: Where is my father? ... A stranger bore the head before the King, who rejoiced. This is a brave man's head—it must be boiled in the cauldron, said the stranger. Three days and nights it boiled and would not soften. Then the stranger swung his sword—the King's head fell into the cauldron, and he cut off his own, and it fell in too.",en_w:"Gan Jiang forged swords for three years; the furious king killed him. His son Chi Bi grew up, found the hidden sword, and swore revenge. A stranger took his head to the king; when it would not melt in the cauldron, the stranger beheaded the king and himself—three heads rolled together in the soup.",en_u:"Some debts take a lifetime to settle. At the end of vengeance there are no winners—only three heads boiling in a pot.",en_q:"Is there an old score you have carried for years? How much is it worth paying? And can you really say the words let go?",opts:[
  {a:"记一辈子，有朝一日要个说法",r:"你心里那把剑，一直别在南山松石后。它给你撑腰，也压得你睡不着——复仇是苦行，而你早习惯了苦行。",ea:"记一辈子，有朝一日要个说法",er:"你心里那把剑，一直别在南山松石后。它给你撑腰，也压得你睡不着——复仇是苦行，而你早习惯了苦行。"},
  {a:"算了，人没了，日子还得过",r:"你选择把剑埋回去。不是不疼，是疼过之后明白：汤镬里的三个头，没有一个会活过来。",ea:"算了，人没了，日子还得过",er:"你选择把剑埋回去。不是不疼，是疼过之后明白：汤镬里的三个头，没有一个会活过来。"},
  {a:"自己不出手，借别人的手讨公道",r:"你擅长借力——让该出手的人出手。聪明，只是那口鼎煮着的，一样有你一份心。",ea:"自己不出手，借别人的手讨公道",er:"你擅长借力——让该出手的人出手。聪明，只是那口鼎煮着的，一样有你一份心。"},
  {a:"把恨留给下一代？绝不可能",r:"你宁愿自己扛，也不愿孩子背债。你以为这样是断根，可有些东西，不在话里，在眼神里。",ea:"把恨留给下一代？绝不可能",er:"你宁愿自己扛，也不愿孩子背债。你以为这样是断根，可有些东西，不在话里，在眼神里。"},
  {a:"要报仇，但先把自己活好再说",r:"你把「活好」当复仇的第一步。这是最老练的答案——只是活好了之后，你可能就不想报了。",ea:"要报仇，但先把自己活好再说",er:"你把「活好」当复仇的第一步。这是最老练的答案——只是活好了之后，你可能就不想报了。"},
  {a:"写下来，把仇写成一个故事",r:"你选择把它变成文字，而不是刀剑。伤口还在，但你把它摊开晒过，比藏着不烂强。",ea:"写下来，把仇写成一个故事",er:"你选择把它变成文字，而不是刀剑。伤口还在，但你把它摊开晒过，比藏着不烂强。"}
 ]},
{s:"《搜神记 · 卷十一》",t:"韩凭夫妇",img:"tale_04.jpg",
 o:"宋康王舍人韩凭，娶妻何氏，美。康王夺之。凭怨，王囚之，论为城旦。……俄而凭乃自杀。其妻乃阴腐其衣。王与之登台，妻遂自投台而下；左右揽之，衣不中手而死。遗书于带曰：「王利其生，妾利其死，愿以尸骨，赐凭合葬！」王怒，弗听，使里人埋之，冢相望也。……宿昔之间，便有大梓木生于二冢之端，旬日而大盈抱。屈体相就，根交于下，枝错于上。又有鸳鸯雌雄各一，恒栖树上，晨夕不去，交颈悲鸣。",
 w:"韩凭的妻子何氏貌美，被宋康王强夺。韩凭含怨自杀，何氏在陪王登台时从高台坠下自尽，衣带遗书求与夫合葬。康王怒而不允，两墓相望。不久两座坟头各长出一棵大梓树，十日就长得合抱粗，树干弯曲相向、根枝交缠；树上栖着一对鸳鸯，晨夕交颈悲鸣，不肯离去。",
 u:"拆得开肉身，拆不开相望。那两棵交缠的树，是人间最后的体面。",
 q:"如果一段感情被外力强行拆散——门第、现实、长辈、距离——你会怎么对待那份「不肯死的心」？",
 en_s:"Soushen Ji · Scroll 11",en_t:"The Couple of Han Ping",en_o:"Han Ping, retainer of King Kang of Song, had a wife, He, of great beauty; the King took her. Han Ping, resentful, was imprisoned... Soon Han Ping killed himself. His wife secretly rotted her clothes. The King mounted the terrace with her; she threw herself off. Attendants caught at her, but her clothes tore in their hands, and she died. A letter in her sash read: The King profits by my life; I profit by my death. Grant that my bones be buried with his! ... Within a night two catalpa trees grew from the twin tombs, and in ten days were an arm-span thick, bending toward each other, roots entwined below, branches interlocked above. And two mandarin ducks, male and female, ever perched on the tree, mourning at dawn and dusk, necks entwined.",en_w:"The king of Song stole Han Ping's beautiful wife. Han Ping died of grief; his wife leapt from the king's terrace, leaving a note begging to be buried with him. The king refused, furious—but from the two facing tombs grew two catalpa trees that intertwined, and a pair of mandarin ducks nested there, mourning neck to neck, morning and night.",en_u:"You can separate bodies, not the longing. Those two intertwined trees are the last dignity the world could not break.",en_q:"If a love is torn apart by outside forces—class, reality, elders, distance—what do you do with a heart that refuses to die?",opts:[
  {a:"宁死不屈，以死明志",r:"你信「妾利其死」——有些东西比命大。刚烈，但也要问一句：这口争的气，值不值得用一生来换。",ea:"宁死不屈，以死明志",er:"你信「妾利其死」——有些东西比命大。刚烈，但也要问一句：这口争的气，值不值得用一生来换。"},
  {a:"活着就好，在心里留着位置",r:"你把爱藏进心里，让日子先过下去。这是最多人走的路，不丢人——何氏若懂你，也会劝你活着。",ea:"活着就好，在心里留着位置",er:"你把爱藏进心里，让日子先过下去。这是最多人走的路，不丢人——何氏若懂你，也会劝你活着。"},
  {a:"争取到底，闹到天翻地覆",r:"你不肯认命，把每一次反抗当最后一次。可康王的城墙很高，你要想好，自己有多少年可以撞。",ea:"争取到底，闹到天翻地覆",er:"你不肯认命，把每一次反抗当最后一次。可康王的城墙很高，你要想好，自己有多少年可以撞。"},
  {a:"认命，但把回忆珍藏好",r:"你选择体面地退场。那棵树长在心上，不对外人言——这也是一种「交颈悲鸣」。",ea:"认命，但把回忆珍藏好",er:"你选择体面地退场。那棵树长在心上，不对外人言——这也是一种「交颈悲鸣」。"},
  {a:"把自己活成更好的，让对方后悔",r:"你把悲愤转成力气。只是要小心，活得太好之后，连自己都不确定，是在活给自己，还是活给谁看。",ea:"把自己活成更好的，让对方后悔",er:"你把悲愤转成力气。只是要小心，活得太好之后，连自己都不确定，是在活给自己，还是活给谁看。"},
  {a:"相信缘分有轮回，下辈子再见",r:"你把结局交给来世。这念头最温柔，也最没法验证——好在，信着总比空着暖。",ea:"相信缘分有轮回，下辈子再见",er:"你把结局交给来世。这念头最温柔，也最没法验证——好在，信着总比空着暖。"}
 ]},
{s:"《搜神记 · 卷一》",t:"董永遇仙",img:"tale_05.jpg",
 o:"汉董永，千乘人。少偏孤，与父居。肆力田亩，鹿车载自随。父亡，无以葬，乃自卖为奴，以供丧事。主人知其贤，与钱一万，遣之。……至七月七日，织女当渡河，诸仙悉还宫。……女曰：「我，天之织女也。缘君至孝，天帝令我助君偿债耳。」语毕，凌空而去，不知所在。",
 w:"董永自幼丧母，与父亲相依为命，父亲去世无钱安葬，只好卖身为奴换钱葬父。主人怜他贤孝，给他一万钱让他回家。路上他遇到一位女子，自愿嫁给他，替他织布还清债务。女子说：我是天上的织女，天帝感念你的至孝，派我来替你偿债。说完凌空而去。",
 u:"「至孝」是个冷门赛道——你认认真真做自己，就有人（或那天）替你折算成好运。",
 q:"你在做一件没人看见、没有回报的「孝/善/坚持」时，心里真正在等什么？",
 en_s:"Soushen Ji · Scroll 1",en_t:"Dong Yong and the Weaving Maiden",en_o:"Dong Yong of Qiancheng... was orphaned of his mother young, and lived with his father, working the fields with a deer-cart. When his father died, having nothing for the burial, he sold himself into bondage to pay for it. His master, knowing his worth, gave him ten thousand coins and sent him home... On the seventh day of the seventh month... the maiden said: I am the Weaving Maiden of Heaven. Because of your perfect filial piety, the Emperor of Heaven sent me to help repay your debt. Then she rose into the sky and was gone.",en_w:"Dong Yong, orphaned, sold himself into servitude to bury his father. On the road home a woman appeared, married him, and wove cloth to clear his debt. I am the Weaving Maiden of Heaven, she said, sent because of your filial piety. Then she vanished into the sky.",en_u:"Perfect filial piety is an unfashionable path—but live it honestly, and someone, or Heaven, will convert it into luck.",en_q:"When you do something kind or right that no one sees and no one rewards, what are you truly waiting for?",opts:[
  {a:"什么都不等，就是该做",r:"你就是那个「鹿车载父」的人。没有织女你也照做——这样的人，织女来不来都输不了。",ea:"什么都不等，就是该做",er:"你就是那个「鹿车载父」的人。没有织女你也照做——这样的人，织女来不来都输不了。"},
  {a:"嘴上说该做，心里盼着哪天有好报",r:"你承认吧，你偷偷在等织女。这不算错，只是别让她来得太晚，你把日子都熬旧了。",ea:"嘴上说该做，心里盼着哪天有好报",er:"你承认吧，你偷偷在等织女。这不算错，只是别让她来得太晚，你把日子都熬旧了。"},
  {a:"做给别人看——孝顺要让人知道",r:"你把孝做成仪式，大家都看见。也不全是虚荣，至少你做了；只是织女的眼睛，未必在人堆里。",ea:"做给别人看——孝顺要让人知道",er:"你把孝做成仪式，大家都看见。也不全是虚荣，至少你做了；只是织女的眼睛，未必在人堆里。"},
  {a:"量力而行，别把自己搭进去",r:"你比董永清醒：卖身葬父是悲壮，也是风险。清醒的人不遇到织女，但也不至于一辈子欠债。",ea:"量力而行，别把自己搭进去",er:"你比董永清醒：卖身葬父是悲壮，也是风险。清醒的人不遇到织女，但也不至于一辈子欠债。"},
  {a:"做了之后怕别人觉得理所当然",r:"你的善良怕被「习惯」。这是对的警觉——织女的故事里，主人是赏的，只有天帝是记的。",ea:"做了之后怕别人觉得理所当然",er:"你的善良怕被「习惯」。这是对的警觉——织女的故事里，主人是赏的，只有天帝是记的。"},
  {a:"抱怨过为什么别人不用做这么多",r:"你心里有过委屈的。允许委屈，只是别让它变成怨——董永的织女，来的时候也是在他最不设防的时候。",ea:"抱怨过为什么别人不用做这么多",er:"你心里有过委屈的。允许委屈，只是别让它变成怨——董永的织女，来的时候也是在他最不设防的时候。"}
 ]},
{s:"《搜神记 · 卷十四》",t:"嫦娥奔月",img:"tale_06.jpg",
 o:"羿请无死之药于西王母，嫦娥窃以奔月。将往，枚筮之于有黄。有黄占之，曰：「吉。翩翩归妹，独将西行，逢天晦芒，毋惊毋恐，后且大昌。」嫦娥遂托身于月，是为蟾蜍。",
 w:"后羿向西王母求来不死之药，嫦娥偷吃了它，奔月而去。走之前她占了一卦，卦辞说：吉，独身西行，逢天昏暗，不必惊恐，日后昌盛。嫦娥于是托身于月，化为蟾蜍。",
 u:"不死之药只有一份——她吃了，他就得老。有些选择没有对错，只有代价由谁承担。",
 q:"当「唯一的药」摆在面前——你的事业机会、你的退路、你的梦想——你会分给身边的人，还是自己先拿？",en_s:"Soushen Ji · Scroll 14",en_t:"Chang'e Flies to the Moon",en_o:"Yi asked the Queen Mother of the West for the elixir of immortality, and Chang'e stole it and flew to the moon. Before going, she cast lots with yarrow. The divination said: Auspicious. A departing sister, journeying west alone; the sky grows dark and vast, be not afraid, for later there will be great prosperity. Chang'e thus lodged her body in the moon, and became the toad.",en_w:"Hou Yi obtained the elixir of immortality from the Queen Mother of the West. Chang'e stole it and fled to the moon. Before leaving she cast a hexagram: auspicious, a lone journey west, do not fear the dark. So she dwelled in the moon, turned into a toad.",en_u:"There was only one elixir. She took it, and he grew old. Some choices have no right answer, only the question of who pays the price.",en_q:"When the only elixir lies before you, your career chance, your escape hatch, your dream, do you take it yourself, or share it with the ones you love?",opts:[
  {a:"先自己吃——机会不等人",r:"你是务实派：药只有一份，不吃才是辜负。只是奔月的夜那么冷，你也别怪地上的人不理解。",ea:"先自己吃——机会不等人",er:"你是务实派：药只有一份，不吃才是辜负。只是奔月的夜那么冷，你也别怪地上的人不理解。"},
  {a:"先让给家人，自己慢慢熬",r:"你把药让了出去，心里又酸又甜。这份让，是爱也是赌——赌对方会记得，赌自己熬得住。",ea:"先让给家人，自己慢慢熬",er:"你把药让了出去，心里又酸又甜。这份让，是爱也是赌——赌对方会记得，赌自己熬得住。"},
  {a:"分着吃——一人一半，都活不成神仙，但都不死",r:"你想过最优解：分着吃。可传说里没有这种结局——现实里，分着吃的结果常常是：两个人都没够着月亮。",ea:"分着吃——一人一半，都活不成神仙，但都不死",er:"你想过最优解：分着吃。可传说里没有这种结局——现实里，分着吃的结果常常是：两个人都没够着月亮。"},
  {a:"谁都不吃，把药锁起来",r:"你把选择无限期推迟，像锁一件家传宝。安全，但月亮就在天上，你每天抬头都在想：该不该开锁。",ea:"谁都不吃，把药锁起来",er:"你把选择无限期推迟，像锁一件家传宝。安全，但月亮就在天上，你每天抬头都在想：该不该开锁。"},
  {a:"问过对方再决定——一起商量",r:"你把「我们」放前面。体面，可传说里羿未必有得选——现实里，商量到最后，常常还是一个人先走了。",ea:"问过对方再决定——一起商量",er:"你把「我们」放前面。体面，可传说里羿未必有得选——现实里，商量到最后，常常还是一个人先走了。"},
  {a:"吃之前，把日子过得像永别",r:"你预感到要走，提前把温柔透支完。这样走的时候不亏欠——只是被透支的那个人，此后每年中秋都疼。",ea:"吃之前，把日子过得像永别",er:"你预感到要走，提前把温柔透支完。这样走的时候不亏欠——只是被透支的那个人，此后每年中秋都疼。"}
 ]},
{s:"《搜神记 · 卷一》",t:"左慈戏曹",img:"",
 o:"左慈，字元放，庐江人也。少有神道。……曹公闻而召之，闭一室中，使人守之，断谷期年，而颜色如故。……操欲杀之，慈却入壁中，霍然不知所在。或见于市者，又捕之，而市人皆变形与慈同，莫知谁是。后人逢慈于阳城山头，因复逐之，遂入走羊群。操知不可得，乃令就羊中告之曰：「不复相杀，本试君术耳。」忽有一老羝，屈前两膝，人立而言曰：「遽如许。」即竞往赴之，而群羊数百皆变为羝，并屈前膝人立。",
 w:"左慈有神术，被曹操召来后关在屋里断粮一年，面色如常。曹操动了杀心，左慈穿墙而去；在市上追捕他，满街人都变成他的模样；追到山头，他走进羊群，群羊都变成老羊人立而起，曹操最终也拿他没办法。",
 u:"在强权面前，最高级的反抗是「我逗你玩」。你认真，我就变成满街的我。",
 q:"当强权/上级/系统对你动了「收拾」的心思，而你又不想硬碰硬——你会怎么保全自己？",en_s:"Soushen Ji · Scroll 1",en_t:"Zuo Ci Teases Cao Cao",en_o:"Zuo Ci, courtesy name Yuanfang, was from Lujiang. As a youth he had divine arts. Lord Cao summoned him, shut him in a room with a guard, and cut off his grain for a whole year, yet his countenance never changed. Cao wanted to kill him; Zuo Ci stepped into the wall and vanished, gone without a trace. Seen again in the market and seized, every man in the street changed shape to look like him, and none could tell which was which. Later he was found on a mountain, pursued, and walked into a flock of sheep. Cao, knowing he could not catch him, called into the flock: I will not kill you; I only meant to test your arts. Then an old ram bent its forelegs and stood up like a man, saying: Just so. The men rushed at it, and the whole flock of hundreds turned into rams, all kneeling and standing like men.",en_w:"Zuo Ci possessed divine arts. Cao Cao shut him in a room without food for a year; his face stayed the same. When Cao moved to kill him, Zuo Ci walked through the wall, and when pursued in the market, every passerby took his form; chased to the mountains, he joined a flock of sheep, and the whole flock stood up like men. Even Cao Cao could do nothing.",en_u:"Before raw power, the highest resistance is: I amuse myself. You take it seriously, and I become the whole street.",en_q:"When power, a superior, or the system decides to teach you a lesson, and you do not want a head-on clash, how do you protect yourself?",opts:[
  {a:"绝不示弱，当面顶回去",r:"你是硬刚型。有骨气，但曹操的刀也快——你得确定自己真有「穿墙术」，不然就是给后人讲别人的故事。",ea:"绝不示弱，当面顶回去",er:"你是硬刚型。有骨气，但曹操的刀也快——你得确定自己真有「穿墙术」，不然就是给后人讲别人的故事。"},
  {a:"溜之大吉，从此隐形",r:"你选择人间蒸发——换个城市、换个圈子、换个名字。保全了，只是每年中秋，你都比嫦娥更怕被认出来。",ea:"溜之大吉，从此隐形",er:"你选择人间蒸发——换个城市、换个圈子、换个名字。保全了，只是每年中秋，你都比嫦娥更怕被认出来。"},
  {a:"让大家都变成我——混淆视听",r:"你擅长把水搅浑，让对手分不清目标。这一招损，但管用——只是朋友也认不出你的时候，你会有一瞬间的孤独。",ea:"让大家都变成我——混淆视听",er:"你擅长把水搅浑，让对手分不清目标。这一招损，但管用——只是朋友也认不出你的时候，你会有一瞬间的孤独。"},
  {a:"该低头低头，但留一手",r:"你表面上臣服，暗地里留着「穿墙术」的门票。这是大多数聪明人的活法，曹操也拿这样的你没办法。",ea:"该低头低头，但留一手",er:"你表面上臣服，暗地里留着「穿墙术」的门票。这是大多数聪明人的活法，曹操也拿这样的你没办法。"},
  {a:"变成他抓不住的那个「意义」",r:"你让自己变得抽象：不是某个职位、某个文件、某个把柄——他在体制里找不到你，因为你不住在体制里。",ea:"变成他抓不住的那个「意义」",er:"你让自己变得抽象：不是某个职位、某个文件、某个把柄——他在体制里找不到你，因为你不住在体制里。"},
  {a:"逗他玩——把追杀变成游戏",r:"你甚至享受这个过程，把危机玩成行为艺术。心态好，但你得祈祷：对方是有幽默感的曹操，不是手起刀落的莽夫。",ea:"逗他玩——把追杀变成游戏",er:"你甚至享受这个过程，把危机玩成行为艺术。心态好，但你得祈祷：对方是有幽默感的曹操，不是手起刀落的莽夫。"}
 ]},
{s:"《搜神记 · 卷十九》",t:"李寄斩蛇",img:"tale_08.jpg",
 o:"东越闽中，有庸岭，高数十里。其西北隟中，有大蛇，长七八丈，大十余围，俗常岁祭以童女。……女寄乃行，告请好剑及咋蛇犬。至八月朝，便诣庙中坐。怀剑，将犬。……蛇便出，头大如囷，目如二尺镜。闻糍香气，先啖食之。寄便放犬，犬就啮咋，寄从后斫得数创。疮痛急，蛇因踊出，至庭而死。寄入视穴，得九女髑髅，悉举出，咤言曰：「汝曹怯弱，为蛇所食，甚可哀愍！」于是寄女缓步而归。",
 w:"东越庸岭有条大蛇，年年要吃童女。李寄自愿前往，带上利剑和咬蛇的狗。到了庙里，蛇闻到米糕香出来吃，李寄放狗咬蛇，自己从后面挥剑砍伤大蛇，蛇痛极跳出，死在庙庭。李寄进洞取出九个被吃的女孩骷髅，叹道：你们怯弱，被蛇所食，真可哀怜。然后缓步而归。",
 u:"被献祭的人里，不是没有聪明的，只是没有人敢说「我去」。勇气往往不是从不怕开始的，是从「受够了」开始的。",
 q:"当你所在的系统正在「献祭」某类人（背锅的、被裁的、被牺牲的），而你有能力破局——你会站出来吗？",en_s:"Soushen Ji · Scroll 19",en_t:"Li Ji Slays the Serpent",en_o:"East of Yue in Minzhong stood Yongling, a ridge dozens of li high. In a crevice on its northwest lived a great serpent, seven or eight zhang long and more than ten wei around; the village used to sacrifice a young girl to it each year. The girl Li Ji went forth, asking for a good sword and a dog that bites serpents. On the eighth day of the eighth month she entered the shrine and sat down, sword in bosom, dog in hand. The serpent came out, its head like a granary, its eyes like two-foot mirrors. Smelling the rice cakes, it ate them first. Li Ji loosed the dog, which bit and worried it; Li Ji struck from behind, wounding it several times. Wounded and desperate, the serpent leapt out and died in the courtyard. Li Ji entered the cave and found nine skulls of girls, carried them all out, and said with a sigh: You were timid and weak, eaten by the serpent, most pitiable. Then she walked slowly home.",en_w:"A great serpent on Yongling devoured a young girl every year. Li Ji volunteered, carrying a sword and a serpent-biting dog. When the serpent came out for the rice cakes, the dog attacked and she struck from behind, wounding it until it died. She took out the nine skulls from the cave, sighed at their cowardice, and walked calmly home.",en_u:"Among the sacrificed there were clever ones. It was just that no one dared say: let me go. Courage often does not begin with fearlessness, but with having had enough.",en_q:"When the system you live in is sacrificing a kind of person, the scapegoats, the laid-off, the expendable, and you have the power to break the pattern, do you step forward?",opts:[
  {a:"站出来，哪怕就我一个",r:"你是李寄——怀剑携犬，直入蛇穴。你可能是救九个人的那个，也可能是下一个被记住的髑髅，但你受不了「算了」。",ea:"站出来，哪怕就我一个",er:"你是李寄——怀剑携犬，直入蛇穴。你可能是救九个人的那个，也可能是下一个被记住的髑髅，但你受不了「算了」。"},
  {a:"先观察蛇的习性，再动手",r:"你不打无准备之仗——先看蛇几时出、吃什么、怕什么。这让你成了活着的那个李寄，而不是烈士。",ea:"先观察蛇的习性，再动手",er:"你不打无准备之仗——先看蛇几时出、吃什么、怕什么。这让你成了活着的那个李寄，而不是烈士。"},
  {a:"想办法让系统自己改革，别硬刚",r:"你相信规则内的破局。对，李寄要是生在衙门里，大概会先上书、再设岗、再修蛇患防治条例。",ea:"想办法让系统自己改革，别硬刚",er:"你相信规则内的破局。对，李寄要是生在衙门里，大概会先上书、再设岗、再修蛇患防治条例。"},
  {a:"给被献祭的人传消息，让他们自己逃",r:"你在体制里悄悄放水。救人于无形，蛇找不到你头上——只是那些没接到消息的人，你心里过不去。",ea:"给被献祭的人传消息，让他们自己逃",er:"你在体制里悄悄放水。救人于无形，蛇找不到你头上——只是那些没接到消息的人，你心里过不去。"},
  {a:"装看不见，活着最要紧",r:"你没有错，错的是蛇和献祭的规矩。可若干年后，你路过庸岭，会不会听见洞里那九个骷髅的叹息？",ea:"装看不见，活着最要紧",er:"你没有错，错的是蛇和献祭的规矩。可若干年后，你路过庸岭，会不会听见洞里那九个骷髅的叹息？"},
  {a:"等一个李寄出现，我帮她把剑磨快",r:"你做不了主角，就做助力——递剑、放狗、报信。系统需要李寄，李寄也需要你这样的人。",ea:"等一个李寄出现，我帮她把剑磨快",er:"你做不了主角，就做助力——递剑、放狗、报信。系统需要李寄，李寄也需要你这样的人。"}
 ]},
{s:"《搜神记 · 卷十六》",t:"紫玉与韩重",img:"",
 o:"吴王夫差小女，名曰紫玉，年十八，才貌俱美。童子韩重，年十九，有道术。女悦之，私交信问，许为之妻。重学于齐鲁之间，临去，属其父母，使求婚。王怒，不与女玉。女结气死，葬阊门之外。三年，重归，诘其父母。……往吊于墓前。玉魂从墓出，见重，流涕谓曰：「昔尔行之后，令二亲从王相求，度必克从大愿；不图别后，遭命奈何！」玉乃左顾宛颈而歌曰……歌毕，歔欷流涕，要重还冢中。与之饮宴，留三日三夜，尽夫妇之礼。",
 w:"吴王夫差的小女儿紫玉，爱上平民韩重，私下许诺嫁给他。韩重离家求学，请父母去求婚，吴王大怒，不肯。紫玉气结而死，葬在阊门外。三年后韩重归来，到墓前凭吊，紫玉的魂魄从墓中走出，哭着说：没想到一别竟是永别。她唱歌、流泪，带韩重回墓中，留了三天三夜，尽了夫妻之礼。",
 u:"门第之墙，生前拆不开，死后也没拆开——她宁可做墓中夫妻，也不肯做阳世的怨偶。",
 q:"一份感情被「门第/现实」判了死刑，但你们彼此都放不下——你会选择怎样的相处方式？",en_s:"Soushen Ji · Scroll 16",en_t:"Zi Yu and Han Zhong",en_o:"Wu Wang Fuchai's youngest daughter was named Zi Yu, eighteen years old, beautiful and gifted. The youth Han Zhong, nineteen, had arts. She loved him, exchanged letters in private, and promised to be his wife. Han Zhong went to study between Qi and Lu; before leaving, he asked his parents to seek the marriage. The King was furious and would not give her. Zi Yu died of pent-up grief and was buried outside Chang Gate. Three years later Han Zhong returned and asked his parents. He went to mourn before her grave. Zi Yu's spirit came out from the tomb, wept, and said: After you left, I had my parents ask the King; I thought the great wish would surely be granted. I never dreamed that after parting, fate would be like this! She sang, wept, and asked Han Zhong into the tomb. They feasted, and stayed three days and three nights, completing the rites of husband and wife.",en_w:"Zi Yu, daughter of King Fuchai of Wu, loved the commoner Han Zhong and secretly promised to marry him. Her father refused in fury, and she died of grief. Three years later, when Han Zhong mourned at her grave, her spirit walked out, sang, wept, and took him into the tomb for three days and nights of husband-and-wife rites.",en_u:"The wall of rank could not be broken in life, and was not broken in death. She would rather be husband and wife in the tomb than resentful lovers in the world of the living.",en_q:"If a love is sentenced to death by rank or reality, but neither of you can let go, what form of being together do you choose?",opts:[
  {a:"冲破门第，私奔也要在一起",r:"你信「生死相许」。奔得出去是传奇，奔不出去就成了坟茔——你要掂量，自己扛不扛得起后半生的柴米。",ea:"冲破门第，私奔也要在一起",er:"你信「生死相许」。奔得出去是传奇，奔不出去就成了坟茔——你要掂量，自己扛不扛得起后半生的柴米。"},
  {a:"各自安好，把爱锁进心里",r:"你选择阳世的体面。紫玉会气结，你不会——你把那口气咽下去，换一家人平安。这样的你，比紫玉活得长，也比她疼得久。",ea:"各自安好，把爱锁进心里",er:"你选择阳世的体面。紫玉会气结，你不会——你把那口气咽下去，换一家人平安。这样的你，比紫玉活得长，也比她疼得久。"},
  {a:"相信总有别的路——哪怕在地下",r:"你甚至愿意接受「墓中相聚」式的结局：现实给不了，就换一种形态守住。痴，但痴有痴的浪漫。",ea:"相信总有别的路——哪怕在地下",er:"你甚至愿意接受「墓中相聚」式的结局：现实给不了，就换一种形态守住。痴，但痴有痴的浪漫。"},
  {a:"妥协给现实，但终身不忘",r:"你会在每个秋天想起他。妥协不丢人，吴王也会老，可有些名字，你已经答应自己不再提起。",ea:"妥协给现实，但终身不忘",er:"你会在每个秋天想起他。妥协不丢人，吴王也会老，可有些名字，你已经答应自己不再提起。"},
  {a:"努力变强，等配得上那天",r:"你把遗憾当燃料，读书、挣钱、长本事。这是最积极的路——只是要小心，等你配得上了，那个人已经不在阊门外了。",ea:"努力变强，等配得上那天",er:"你把遗憾当燃料，读书、挣钱、长本事。这是最积极的路——只是要小心，等你配得上了，那个人已经不在阊门外了。"},
  {a:"问清楚对方想要什么，再决定",r:"你不愿一个人替两个人做决定。这是成熟，但现实里，很多紫玉说「我愿意」，其实是被你的犹豫逼走的。",ea:"问清楚对方想要什么，再决定",er:"你不愿一个人替两个人做决定。这是成熟，但现实里，很多紫玉说「我愿意」，其实是被你的犹豫逼走的。"}
 ]},
{s:"《搜神后记 · 卷一》",t:"丁令威化鹤",img:"tale_10.jpg",
 o:"丁令威，本辽东人，学道于灵虚山。后化鹤归辽，集城门华表柱。时有少年，举弓欲射之。鹤乃飞，徘徊空中而言曰：「有鸟有鸟丁令威，去家千年今始归。城郭如故人民非，何不学仙冢垒垒。」遂高上冲天。",
 w:"丁令威本是辽东人，在灵虚山学道，后来化成仙鹤飞回辽东，落在城门的华表柱上。有少年要射它，鹤飞到空中盘旋，开口说：有鸟叫丁令威，离家千年今天才回。城郭还是老样子，人民却全换了，何不学仙去，让坟冢成堆。说完冲天而去。",
 u:"你离开的那座城，等你回来时，已经不认识你了——认得你的，只剩城门那根柱子。",
 q:"如果离开家乡/老单位/旧圈子很多年再回去，发现物是人非——你最怕面对的是什么？",en_s:"Soushen Houji · Scroll 1",en_t:"Ding Lingwei Becomes a Crane",en_o:"Ding Lingwei was a man of Liaodong who studied the Way on Lingxu Mountain. Later he turned into a crane and flew home, alighting on the ornamented column of the city gate. A youth raised his bow to shoot him. The crane flew up, circled, and spoke: There is a bird, there is a bird, Ding Lingwei, left home a thousand years, today returns. The walls are as they were, but the people are not. Why not learn immortality and leave the mounds of graves behind? Then it soared high into the sky.",en_w:"Ding Lingwei of Liaodong studied the Way and returned as a crane, alighting on the city gate pillar. When a youth drew his bow, the crane circled and spoke: I left home a thousand years ago and today return; the city is unchanged, but the people are all new. Then it flew high into the sky.",en_u:"The city you left, when you come back, no longer knows you. What recognizes you is only the pillar at the gate.",en_q:"If you return after many years to your hometown, old workplace, or old circle, and find everything changed, what do you fear facing most?",opts:[
  {a:"怕没人认识我了——连名字都多余",r:"你在乎「被记得」。华表柱还在，但认得你的人不在了——这不是你的错，是时间的错，可疼还是你的。",ea:"怕没人认识我了——连名字都多余",er:"你在乎「被记得」。华表柱还在，但认得你的人不在了——这不是你的错，是时间的错，可疼还是你的。"},
  {a:"怕自己跟不上了，像个外人",r:"你怕「人民非」的那天，自己成了异类。其实城郭如故，变的是你——你在外头，早不是当年那个你了。",ea:"怕自己跟不上了，像个外人",er:"你怕「人民非」的那天，自己成了异类。其实城郭如故，变的是你——你在外头，早不是当年那个你了。"},
  {a:"怕听到「你变了」三个字",r:"你怕被审判。可丁令威的回答是：我没变，是你们换了——这句话，你敢不敢也这么说？",ea:"怕听到「你变了」三个字",er:"你怕被审判。可丁令威的回答是：我没变，是你们换了——这句话，你敢不敢也这么说？"},
  {a:"无所谓，反正我本来就要走",r:"你从没打算久留，回来只是路过。洒脱是真洒脱，只是半夜里，你会不会也想找个人问问旧事？",ea:"无所谓，反正我本来就要走",er:"你从没打算久留，回来只是路过。洒脱是真洒脱，只是半夜里，你会不会也想找个人问问旧事？"},
  {a:"怕旧人过得不好，自己却无能为力",r:"你惦记的从来不是城，是人。丁令威看到的是冢垒垒——你最怕的，正是那些坟。",ea:"怕旧人过得不好，自己却无能为力",er:"你惦记的从来不是城，是人。丁令威看到的是冢垒垒——你最怕的，正是那些坟。"},
  {a:"怕回去之后，舍不得再走",r:"你不是怕回来，是怕回来就迈不动腿。鹤飞得再高，也是恋着华表柱的——你在外头飞了这么多年，回不回去？",ea:"怕回去之后，舍不得再走",er:"你不是怕回来，是怕回来就迈不动腿。鹤飞得再高，也是恋着华表柱的——你在外头飞了这么多年，回不回去？"}
 ]},
{s:"《搜神后记 · 卷一》",t:"桃花源",img:"tale_11.jpg",
 o:"晋太元中，武陵人捕鱼为业。缘溪行，忘路之远近。忽逢桃花林，夹岸数百步，中无杂树，芳草鲜美，落英缤纷。渔人甚异之。复前行，欲穷其林。林尽水源，便得一山，山有小口，仿佛若有光。便舍船，从口入。初极狭，才通人。复行数十步，豁然开朗。土地平旷，屋舍俨然，有良田美池桑竹之属。阡陌交通，鸡犬相闻。其中往来种作，男女衣着，悉如外人。黄发垂髫，并怡然自乐。",
 w:"东晋太元年间，武陵渔人沿溪打鱼，忘了走了多远，忽然遇见一片桃花林。林尽处有一座山，山有小口，走进去几十步，豁然开朗：土地平旷、屋舍整齐、良田美池、鸡犬相闻，男女老少怡然自乐。他们避秦时乱世而来，不知今夕何世。渔人住几日告辞，出来处处做记号，再去找时，却再也寻不到了。",
 u:"「桃花源」不是不存在，是它只对「忘路之远近」的人开门——太想找到的人，往往一辈子找不到。",
 q:"如果可以，你想不想抛下现在的所有，去一个「怡然自乐」的地方重新活一次？",en_s:"Soushen Houji · Scroll 1",en_t:"The Peach Blossom Spring",en_o:"In the Taiyuan era of Jin, a man of Wuling made his living as a fisherman. Following a stream, he forgot how far he had gone. Suddenly he met a peach grove, stretching several hundred paces along both banks, with no other trees among them; the fragrant grass was fresh and beautiful, and fallen blossoms lay in profusion. The fisherman, amazed, pressed on to see where the grove ended. At the end of the grove was a mountain with a small opening, from which light seemed to come. He abandoned his boat and entered. At first it was very narrow, barely passable. After a few dozen paces it opened out: the land was level and broad, houses stood in neat rows, with fine fields, beautiful ponds, mulberry and bamboo. Paths crossed in all directions, and the crowing of cocks and barking of dogs were heard on every side. Men and women, old and young, all moved and worked about, content and happy. They had fled the chaos of the Qin era, and no longer knew what age it was.",en_w:"A Wuling fisherman followed a stream, forgot the way, and found a peach grove ending at a mountain with a small opening. Inside: level land, neat houses, fine fields, cocks crowing and dogs barking, everyone content. The people had fled the Qin wars and knew nothing of later dynasties. After a few days he left, marking the way, but could never find it again.",en_u:"The Peach Blossom Spring is not nonexistent. It only opens for those who forget how far they have gone. Those who try too hard to find it usually never do.",en_q:"If you could, would you throw away everything you have now and start again in a place where all are content?",opts:[
  {a:"想去，但没有勇气走",r:"你被现实钉在原地——房贷、责任、未尽的活。桃源在梦里，你在晨光里，谁也不怨谁。",ea:"想去，但没有勇气走",er:"你被现实钉在原地——房贷、责任、未尽的活。桃源在梦里，你在晨光里，谁也不怨谁。"},
  {a:"已经在自己的桃花源里了",r:"你不需要逃——你在自己的田里种桑，在自己的桌上吃饭，心安即是武陵源。",ea:"已经在自己的桃花源里了",er:"你不需要逃——你在自己的田里种桑，在自己的桌上吃饭，心安即是武陵源。"},
  {a:"怕桃源里没有我要的东西",r:"你离不开网络、成就、热闹。桃源太静了，你会疯的——承认吧，你不是渔人，是那种给渔人发朋友圈的人。",ea:"怕桃源里没有我要的东西",er:"你离不开网络、成就、热闹。桃源太静了，你会疯的——承认吧，你不是渔人，是那种给渔人发朋友圈的人。"},
  {a:"想走，但怕进去就回不来",r:"你怕的不是新世界，是再也见不到旧人。渔人做了记号还是找不到——你怕的正是这个：有些门，进去就关上了。",ea:"想走，但怕进去就回不来",er:"你怕的不是新世界，是再也见不到旧人。渔人做了记号还是找不到——你怕的正是这个：有些门，进去就关上了。"},
  {a:"走到哪儿算哪儿，不找了",r:"你信「忘路之远近」——不刻意，反而容易遇上。你这辈子大概错过几回桃源，但你也遇到过别人没遇到的好风景。",ea:"走到哪儿算哪儿，不找了",er:"你信「忘路之远近」——不刻意，反而容易遇上。你这辈子大概错过几回桃源，但你也遇到过别人没遇到的好风景。"},
  {a:"想带着家人一起进去",r:"你一个人不敢幸福——桃源必须全家都在。这是你的软肋，也是你比渔人强的地方：渔人进去，是一个人回来的。",ea:"想带着家人一起进去",er:"你一个人不敢幸福——桃源必须全家都在。这是你的软肋，也是你比渔人强的地方：渔人进去，是一个人回来的。"}
 ]},
{s:"《世说新语 · 德行》",t:"管宁割席",img:"tale_12.jpg",
 o:"管宁、华歆共园中锄菜，见地有片金，管挥锄与瓦石不异，华捉而掷去之。又尝同席读书，有乘轩冕过门者，宁读如故，歆废书出看。宁割席分坐，曰：「子非吾友也。」",
 w:"管宁和华歆一起在园中锄菜，看见地上有片金子，管宁照常挥锄，视如瓦石；华歆捡起来看了一眼才扔掉。又曾同席读书，有达官贵人乘着车马过门，管宁照读不误，华歆放下书跑出去看。管宁于是割开席子分开坐，说：你不是我的朋友。",
 u:"价值观不同，不是吵架的事——是「割席」的事。那一声撕裂，比千言万语都清楚。",
 q:"你身边有没有一个「捡金子」「看热闹」的朋友——你们价值取向渐渐不同？你会怎么处理这段关系？",
 en_s:"Shishuo Xinyu · De Xing",en_t:"Guan Ning Cuts the Mat",en_o:"Guan Ning and Hua Xin were hoeing vegetables in the garden together when they saw a piece of gold on the ground. Guan Ning went on hoeing, treating it no differently from a tile or stone; Hua Xin picked it up and threw it away. Again, they once sat reading on the same mat when a man in official carriage passed the gate. Guan Ning read on as before; Hua Xin put down his book and went out to look. Guan Ning cut the mat in two and sat apart, saying: You are no friend of mine.",en_w:"Guan Ning and Hua Xin hoed the garden together; Guan Ning ignored a piece of gold, Hua Xin picked it up. When an official's carriage passed, Guan Ning read on, Hua Xin ran to look. Guan Ning cut the shared mat in two: You are no friend of mine.",en_u:"A difference in values is not a quarrel. It is a cutting of the mat. That single tearing sound says more than a thousand words.",en_q:"Is there a friend whose values are drifting from yours? How do you handle a relationship whose paths are parting?",opts:[
  {a:"慢慢疏远，不撕破脸",r:"你选择让关系「自然凉」。体面，但心里会有个结：那根席子，你们谁都没正式割，就烂在中间了。",ea:"Let it cool slowly. No drama.",er:"You choose to let the relationship go cold naturally. Dignified, but a knot stays: that mat was never formally cut, and it rotted in the middle."},
  {a:"当面说清楚，从此两清",r:"你是管宁——席子割得响。痛快，但也要想：人这一生，能经得起几次割席？割完，你身边还剩几个人？",ea:"Say it to their face. Clear accounts.",er:"You are Guan Ning; the mat tears cleanly. Satisfying, but ask: how many times can one person afford to cut mats? After all the cuts, how many remain?"},
  {a:"求同存异，继续做朋友",r:"你觉得朋友不必同路。对，华歆后来位极人臣，管宁终老草野——你要的到底是同路人，还是可以吃饭聊天的熟人？",ea:"Keep the friendship, agree to disagree.",er:"You believe friends need not walk the same road. True. Hua Xin rose high in office; Guan Ning stayed in the wilds. Which do you need: a fellow traveler, or a dinner companion?"},
  {a:"心里已经割了，面上还维持",r:"你活在两张席子上。累，但大家都体面——只是夜深人静，你会不会觉得，自己有点不真诚？",ea:"Cut it inside, keep it together outside.",er:"You live on two mats. Tiring, but everyone keeps face. Only, at night, do you feel a little dishonest?"},
  {a:"理解他——我要是他，也会捡",r:"你不judge。这份宽厚难得，但小心：你的一次次理解，会不会把自己理解成了他的影子？",ea:"Understand him. I would have picked it up too.",er:"You do not judge. This generosity is rare, but beware: understanding him too often may turn you into his shadow."},
  {a:"让他看我怎么做，用行动影响",r:"你不说话，只做事。管宁要是这么想，就不会割席了——可现实里，行动派的人，常常真的把朋友慢慢带正。",ea:"Let him watch me. Change him by example.",er:"You say nothing, just act. Guan Ning would have cut the mat instead. But in real life, the doers do sometimes slowly pull their friends upright."}
 ]},
{s:"《世说新语 · 任诞》",t:"阮咸晒衣",img:"",
 o:"阮仲容、步兵居道南，诸阮居道北；北阮富，南阮贫。七月七日，北阮盛晒衣，皆纱罗锦绮。仲容以竿挂大布犊鼻裈于中庭。人或怪之，答曰：「未能免俗，聊复尔耳。」",
 w:"阮咸家住在路南，同族的其他阮家住在路北。北边富，晒出的衣服都是绫罗绸缎；南边穷。七月七日晒衣节，阮咸拿竹竿挂了一条粗布犊鼻裤在院子里。有人奇怪，他说：不能免俗，姑且也晒一晒罢了。",
 u:"富人晒绫罗，我晒一条裤子——但我不躲，还特意挂得高。穷不可怕，怕的是穷得不敢见人。",
 q:"在攀比无处不在的环境里（同学会、朋友圈、同事），你手里只有「一条粗布裤子」时，你会怎么应对？",
 en_s:"Shishuo Xinyu · Ren Dan",en_t:"Ruan Xian Hangs Out His Clothes",en_o:"Ruan Zhongrong and the Infantry Commandant lived south of the road; the other Ruans lived north of it. The northern Ruans were rich; the southern were poor. On the seventh day of the seventh month, the northern Ruans hung out their clothes in abundance, all gauze and brocade. Zhongrong hung a big cloth undergarment on a bamboo pole in his courtyard. When people found it odd, he answered: I cannot escape custom; I am just going along with it.",en_w:"Ruan Xian's family lived south of the road, poor; the other Ruans lived north, rich. On the clothes-drying festival, the north hung silk and brocade; Ruan Xian hung a single cloth undergarment on a pole. Asked why, he said: Cannot escape custom; just joining in.",en_u:"The rich air their brocade; I air my trousers. But I do not hide, and I hang mine high. Poverty is not shameful; the shame is fearing to be seen in it.",en_q:"In a world of comparisons, class reunions, feeds, colleagues, when all you have is one pair of coarse trousers, how do you respond?",opts:[
  {a:"大大方方晒出来，还自嘲两句",r:"你是阮咸。自嘲是铠甲，坦然是底气——别人笑你，你也笑，笑声就变成你的了。",ea:"Hang it out boldly and laugh at yourself.",er:"You are Ruan Xian. Self-mockery is armor; ease is confidence. Others laugh at you; you laugh too, and the laughter becomes yours."},
  {a:"不晒了，关起门来过日子",r:"你选择退出赛场。清净，但也别完全退出——完全退出的人，偶尔也会想知道：他们晒的都是什么？",ea:"Do not hang anything. Close the door and live.",er:"You choose to leave the arena. Peaceful, but do not leave it entirely. The one who fully leaves sometimes wonders: what are they airing now?"},
  {a:"拼命赚钱，明年也晒绫罗",r:"你把这口气当燃料。可以，但要小心：等你真晒上绫罗那天，会不会比阮咸更怕北边的风？",ea:"Make money like mad. Next year I air brocade too.",er:"You turn this breath into fuel. Fine, but beware: when you finally air brocade, will you fear the northern wind more than Ruan Xian?"},
  {a:"晒几件「精神绫罗」——晒书、晒娃、晒旅行",r:"你擅长置换赛道：没有钱，你有别的可晒。聪明，但夜深时，会不会觉得那也是在硬撑？",ea:"Air other things. Books, children, travel.",er:"You are good at switching lanes: no money, but other things to show. Smart, but at night, does it feel like straining too?"},
  {a:"无所谓，反正没人看我",r:"你低估了自己被注视的程度——七月七日，全城都看南阮。你越是装看不见，那条裤子挂得越高。",ea:"Whatever. No one watches me anyway.",er:"You underestimate how watched you are. On the seventh day, the whole town watched the southern Ruan. The more you pretend not to see, the higher that trouser hangs."},
  {a:"觉得阮咸有点矫情——穷就穷，还晒什么",r:"你说得对，但阮咸赢就赢在：他不仅不怕穷，还敢把穷晒出来，把讥讽弹回去。这一招，你敢吗？",ea:"Ruan Xian was a bit showy. Poor is poor; why hang anything?",er:"You have a point. But Ruan Xian won because he not only was not afraid of poverty, he dared to air it and flick the mockery back. Dare you?"}
 ]},
{s:"《世说新语 · 自新》",t:"周处除三害",img:"tale_14.jpg",
 o:"周处年少时，凶强侠气，为乡里所患。又义兴水中有蛟，山中有白额虎，并皆暴犯百姓。义兴人谓为三横，而处尤剧。或说处杀虎斩蛟，实冀三横唯余其一。处即刺杀虎，又入水击蛟，蛟或浮或没，行数十里，处与之俱，经三日三夜，乡里皆谓已死，更相庆。竟杀蛟而出，闻里人相庆，始知为人情所患，有自改意。乃自吴寻二陆，平原不在，正见清河，具以情告，并云欲自修改而年已蹉跎，终无所成。清河曰：「古人贵朝闻夕死，况君前途尚可。且人患志之不立，何忧令名不彰邪？」处遂改励，终为忠臣孝子。",
 w:"周处年少时凶悍，与水中蛟、山中虎并称「三害」，而且他最厉害。有人劝他去杀虎斩蛟，其实是盼着三害去掉两害。他杀了虎又入水搏蛟，三天三夜没回来，乡里以为他死了，互相庆贺。他上岸得知真相，才明白自己也是乡里一害，起了改过之心。他去找陆云，说想改过但已蹉跎岁月，陆云说：古人贵「朝闻夕死」，你前途还长，只怕志气不立，不怕名声不扬。周处于是改励，终成忠臣孝子。",
 u:"最扎心的一刻，不是被人讨厌，而是发现自己「也是那三害之一」——而改过，永远不晚。",
 q:"你有没有在某个瞬间，突然发现自己就是别人嘴里那个「问题」？那一刻，你是改，是辩，还是躲？",
 en_s:"Shishuo Xinyu · Zi Xin",en_t:"Zhou Chu Eliminates the Three Evils",en_o:"When Zhou Chu was young he was fierce and chivalrous, and a scourge to his village. In the waters of Yixing there was a dragon, and in the mountains a white-browed tiger; both ravaged the people. The people of Yixing called these the Three Evils, and Zhou Chu was the worst. Someone persuaded him to kill the tiger and slay the dragon, secretly hoping that of the three evils only one would remain. Zhou Chu killed the tiger, then entered the water to fight the dragon. The dragon rose and sank, traveling dozens of li, and Zhou Chu stayed with it for three days and three nights. The villagers all thought he was dead and celebrated each other. When at last he slew the dragon and came out, and heard the villagers celebrating, he understood that he himself was counted a scourge, and was moved to reform. He went to Wu to seek Lu Yun, saying he wished to reform but his years were already wasted. Lu Yun said: The ancients prized hearing the Way in the morning and dying in the evening. Your road is still long. What a man fears is not establishing his ambition, not that his fame will not shine. Zhou Chu then reformed, and in the end became a loyal minister and filial son.",en_w:"Zhou Chu was wild in his youth, one of the Three Evils with the dragon and the tiger, and the worst of them. Urged to kill the tiger and dragon, he fought the dragon three days and nights; the village, thinking him dead, celebrated. He learned the truth, saw himself as a scourge, and sought Lu Yun to reform. Your road is still long, said Lu Yun. Zhou Chu reformed and became a loyal minister.",en_u:"The sharpest moment is not being hated, but discovering you are one of the Three Evils yourself. And reform is never too late.",en_q:"Have you ever had the sudden realization that you are the problem people talk about? At that moment, do you reform, argue, or hide?",opts:[
  {a:"改——当天就下决心",r:"你是周处。被点醒的那一刻疼，但你把疼变成刀，斩了自己的「旧害」。这份决断，万里挑一。",ea:"Reform. Decide that very day.",er:"You are Zhou Chu. The awakening hurts, but you turn the pain into a blade and cut away your old evil. That decisiveness is one in ten thousand."},
  {a:"先辩白——我不是那样的",r:"你想先解释。周处没辩，他听完了庆贺声才懂——有些真相，解释一万句，不如听见一声鞭炮。",ea:"Argue first. I am not like that.",er:"You want to explain first. Zhou Chu did not argue; he heard the celebration and understood. Some truths need ten thousand explanations less than one firecracker."},
  {a:"躲起来，换个地方重新做人",r:"你想换个「没有人认识我」的地方改过。可行，但周处没躲——他在故乡改的，改完还是周处。",ea:"Hide. Start over somewhere new.",er:"You want to reform where no one knows you. Workable, but Zhou Chu did not hide. He reformed at home, and after reform he was still Zhou Chu."},
  {a:"改一点，把最坏的地方收起来",r:"你选择「收着点」，不做大恶人也不做大善人。安全，但小心：蛟还没死透，哪天还会翻水。",ea:"Reform a little. Put away the worst parts.",er:"You choose to tone it down: not a great villain, not a great good man. Safe, but beware: the dragon is not dead yet. It will turn the waters again."},
  {a:"怀疑自己真的有那么坏吗",r:"你给自己留了余地。周处也未必全坏——但他听完庆贺声，连余地都不敢留了。你留的那点，是给自己回头的地方。",ea:"Doubt I was really that bad.",er:"You leave yourself room. Zhou Chu was not entirely bad either. But after hearing the celebration, he left no room at all. The room you keep is your way back."},
  {a:"改给在乎的人看，不为乡里",r:"你不需要全乡的认同，只要那几个人的一句「他变了」。这更真实——周处改完，也是先给陆云看，再给天下看。",ea:"Reform for the ones I love, not for the village.",er:"You need no approval from the whole village, only a changed from a few. More real. Zhou Chu also showed Lu Yun first, then the world."}
 ]},
{s:"《世说新语 · 言语》",t:"谢道韫咏絮",img:"tale_15.jpg",
 o:"谢太傅寒雪日内集，与儿女讲论文义。俄而雪骤，公欣然曰：「白雪纷纷何所似？」兄子胡儿曰：「撒盐空中差可拟。」兄女曰：「未若柳絮因风起。」公大笑乐。",
 w:"一个雪天，谢安把家人聚在一起讲论文义。雪下得紧了，谢安问：这纷纷白雪像什么？侄子谢朗说：像空中撒盐。侄女谢道韫说：不如说像柳絮随风而起。谢安大笑，十分高兴。",
 u:"「撒盐」不是不对，是「柳絮」飞起来了。才情的高下，往往就在那一个比喻的灵光里。",
 q:"你的才华/观点，在讲道理的场景里被一个「更亮的比喻」盖过时，你会怎么想？",
 en_s:"Shishuo Xinyu · Yan Yu",en_t:"Xie Daoyun's Willow Catkins",en_o:"Xie Taifu, on a snowy day, gathered his family to discuss literature and principles. Soon the snow fell heavily, and the Duke said cheerfully: To what can this flurry of white snow be likened? His nephew Hu'er said: It resembles salt scattered through the air. His niece said: Better to say willow catkins stirred by the wind. The Duke laughed with great joy.",en_w:"On a snowy day Xie An gathered the family to discuss writing. As snow fell heavily he asked: What does this white flurry resemble? His nephew said: salt scattered in the air. His niece Xie Daoyun said: willow catkins stirred by the wind. Xie An laughed with great joy.",en_u:"Salt is not wrong. But catkins fly. The height of talent often shows in a single flash of simile.",en_q:"When your talent or view is outshone by a brighter metaphor in a debating room, how do you take it?",opts:[
  {a:"服气——好就是好",r:"你是识货的人。被盖过不丢人，能认出柳絮比撒盐高，你已经有了谢安的一半眼光。",ea:"Admire it. Good is good.",er:"You know goods when you see them. Being outshone is no shame; recognizing catkins above salt already gives you half of Xie An's eye."},
  {a:"心里不服，下次想个更妙的",r:"你把较劲变成动力。可以，只是别让「赢那个比喻」盖过「说出真心话」——柳絮是急不出来的。",ea:"Unconvinced inside. Next time I will make a better one.",er:"You turn rivalry into fuel. Fine, but do not let beating that metaphor override saying what you truly feel. Catkins cannot be forced."},
  {a:"嘴上不说，心里记很久",r:"你咽下去了，但雪夜会复发。其实那场雪没有对错，是你把它酿成了心事。",ea:"Say nothing, but remember it for years.",er:"You swallow it, but the snow night recurs. That snow had no right or wrong. You are the one who brewed it into a grudge."},
  {a:"以后少说话，免得被比下去",r:"你选择沉默避险。可谢家这样的场合，恰恰是说话才有存在感——你躲掉了比较，也躲掉了发光。",ea:"Speak less from now on. Avoid being compared.",er:"You choose silence for safety. But in a house like Xie's, speaking is precisely how one shines. You dodged the comparison and the light."},
  {a:"觉得比喻不重要，道理才重要",r:"你是务实派。对，撒盐也描述了雪——但你要承认，一千六百年后大家记得的，是柳絮，不是盐。",ea:"Metaphors do not matter. Substance does.",er:"You are the pragmatist. Right: salt also describes snow. But admit it, sixteen hundred years later, everyone remembers catkins, not salt."},
  {a:"替她高兴——家族里有颗明珠",r:"你没有嫉妒，只有与有荣焉。这份心胸，比咏絮之才更少见——毕竟谢家，一个家族只能出一个道韫。",ea:"Happy for her. A pearl in the family.",er:"You have no jealousy, only pride. This breadth of heart is rarer than the catkin wit itself. A family can raise only one Daoyun."}
 ]},
{s:"《世说新语 · 言语》",t:"新亭对泣",img:"",
 o:"过江诸人，每至美日，辄相邀新亭，藉卉饮宴。周侯中坐而叹曰：「风景不殊，正自有山河之异！」皆相视流泪。唯王丞相愀然变色曰：「当共戮力王室，克复神州，何至作楚囚相对！」",
 w:"西晋灭亡后，南渡的士人们每逢好天气，就相约到新亭饮酒。周顗在座中叹息：风景还是老样子，只是山河已经不同了！众人都相对流泪。只有王导神色一变说：我们应当同心协力，光复中原，何至于像楚囚一样相对哭泣！",
 u:"「风景不殊，山河之异」——时代变了，我们只剩眼泪。但王导那句话，把眼泪变成了力气。",
 q:"当大环境变坏（行业下行、时代转向、集体情绪低落），你是先哭，还是先想「能做点什么」？",
 en_s:"Shishuo Xinyu · Yan Yu",en_t:"Weeping at the New Pavilion",en_o:"The men who had crossed the Yangtze, on every fine day, would invite one another to the New Pavilion and drink on the grass. Zhou Yi, seated in their midst, sighed: The scenery is not changed, but the rivers and mountains are different! All looked at one another and wept. Only Wang Dao, the Chancellor, changed countenance and said: We should all strive with united strength for the royal house and recover the Central Plains. Why must we sit like prisoners facing one another?",en_w:"After the fall of Western Jin, the southern exiles gathered at the New Pavilion on fine days. Zhou Yi sighed: the scenery is unchanged, but the rivers and mountains are different. All wept. Only Wang Dao said: we should strive together to recover the Central Plains. Why weep like prisoners?",en_u:"The scenery is the same; the rivers and mountains are not. When the age turns, all we have is tears. But Wang Dao's words turned tears into strength.",en_q:"When the big environment turns bad, an industry declining, an era shifting, a collective mood low, do you weep first, or think about what can be done?",opts:[
  {a:"先哭——哭完再说",r:"流泪不丢人，周顗也哭了。怕的是哭完只剩哭——新亭的眼泪，需要有人把它擦干去干活。",ea:"Weep first. Then act.",er:"Tears are no shame; Zhou Yi wept too. What is feared is tears with nothing after. The New Pavilion's tears need someone to dry them and get to work."},
  {a:"忍住不哭，带头做点事",r:"你是王导。清醒、冷静、扛事。只是也要允许自己偶尔哭一场——王导这样的人，撑久了也会累。",ea:"Hold back the tears. Lead by doing.",er:"You are Wang Dao. Clear, calm, load-bearing. But allow yourself a good cry sometimes. Men like Wang Dao tire too if they hold too long."},
  {a:"退出牌桌，保住自己",r:"你觉得个人改变不了大势。对了一半：王导也保不住晋室，但他至少没让南渡的士人散掉。",ea:"Leave the table. Protect yourself.",er:"You think one person cannot change the tide. Half right: Wang Dao could not save the Jin house either. But he kept the exiles from scattering."},
  {a:"写下来，把山河之异记下来",r:"你选择记录。时代需要记录者——新亭的泪被写进《世说》，才让一千年后的人知道：他们不是只会哭。",ea:"Write it down. Record the changed rivers and mountains.",er:"You choose to record. The age needs recorders. The New Pavilion's tears entered the Shishuo, so that a thousand years later people know: they did not only weep."},
  {a:"劝大家乐观一点，别太悲观",r:"你怕气氛坏了。但王导没劝「别哭」，他说「该做什么」——安慰有时像麻醉，做事才是药。",ea:"Cheer everyone up. Do not be so pessimistic.",er:"You fear the mood turning. But Wang Dao did not say do not weep. He said what should be done. Comfort is sometimes anesthesia; doing is the medicine."},
  {a:"觉得哭和笑都没用，随波逐流",r:"你看得太透，也容易太冷。新亭的风吹过，楚囚和宰相都在船上——你至少该选一个位置站好。",ea:"Tears and laughter are both useless. Drift with the tide.",er:"You see too clearly, and it chills you. The wind at the New Pavilion blows on prisoner and chancellor alike. At least pick a place to stand."}
 ]},
{s:"《世说新语 · 雅量》",t:"嵇康广陵散",img:"tale_17.jpg",
 o:"嵇中散临刑东市，神气不变。索琴弹之，奏《广陵散》。曲终，曰：「袁孝尼尝请学此散，吾靳固不与，《广陵散》于今绝矣！」太学生三千人上书，请以为师，不许。",
 w:"嵇康被押赴东市刑场，神色不变。他要来一张琴，弹了《广陵散》。曲终他说：袁孝尼曾想学这首曲子，我吝惜没有教他，《广陵散》从此绝传了！三千太学生上书求赦，未获允许。",
 u:"风骨不是不怕死，是死到临头，还在想着「这首曲子以后没人会弹了」。那一点惋惜，比三千太学生的上书都重。",
 q:"如果坚持原则的代价是「从头再来」甚至更重，而那件你在乎的事可能从此「绝传」——你还坚持吗？",
 en_s:"Shishuo Xinyu · Ya Liang",en_t:"Ji Kang and the Guangling Tune",en_o:"Ji Zhongsan, at his execution in the Eastern Market, showed no change in spirit. He asked for a zither and played the Guangling Tune. When the tune ended, he said: Yuan Xiaoni once asked to learn this tune; I was too sparing to teach him. The Guangling Tune is lost from this day on! Three thousand students of the Imperial Academy petitioned that he be made their teacher. It was not granted.",en_w:"Ji Kang, condemned to death in the Eastern Market, showed no change of countenance. He asked for a zither and played the Guangling Tune. When it ended he said: Yuan Xiaoni once asked to learn it; I was too sparing. Now it is lost forever. Three thousand students petitioned; it was refused.",en_u:"Spine is not fearlessness of death. It is worrying, at the edge of death, that no one will play this tune after me. That one regret weighs more than three thousand petitions.",en_q:"If the price of holding your principles is starting over, or worse, and the thing you love may die with you, do you hold?",opts:[
  {a:"坚持，哪怕是最后一曲",r:"你是嵇康。从容赴死，还惦记着曲子的传续。这种「死到临头还在可惜琴谱」的执，是风骨的极致。",ea:"Hold. Even if this is the last tune.",er:"You are Ji Kang. You go to the scaffold calmly and worry about the tune's transmission. That dying-while-sad-for-a-score stubbornness is the extreme of spine."},
  {a:"先保命，曲子以后慢慢教",r:"你是袁孝尼的选择——活着才能传曲。对，广陵散绝了，但嵇康不教，是怕教错人；你教了，才有下一曲。",ea:"Live first. Teach the tune later.",er:"You choose Yuan Xiaoni's road: live, and the tune lives. Right. The Guangling was lost, but Ji Kang did not teach, fearing the wrong student. You teach, and there will be a next tune."},
  {a:"把曲子偷偷传下去再走",r:"你想两全：风骨也要，传承也要。这是最聪明的嵇康——只是刑场上，未必来得及。",ea:"Secretly pass the tune on before I go.",er:"You want both: spine and transmission. The wisest Ji Kang. Only, on the scaffold, there may be no time."},
  {a:"妥协一次，换以后更大的坚持",r:"你信奉「留得青山」。可以，但青山若是一步步矮下去，你还会记得当年为什么上山吗？",ea:"Compromise once. Save myself for a bigger fight.",er:"You believe in keeping the green hills. Fine. But if the hills shrink step by step, will you still remember why you climbed them?"},
  {a:"曲子在，人在不在无所谓",r:"你把自己看得比作品轻。这是极致的奉献，只是三千太学生想救的，恰恰是「你在」——作品可以再作，人是唯一的。",ea:"The tune matters; I do not.",er:"You value the work above yourself. Extreme devotion. But the three thousand students wanted you alive. Works can be made again; the person is unique."},
  {a:"我会在活着的时候就把琴艺传遍",r:"你比嵇康更懂得传承的紧迫——不在绝处才教，而是平时就广布薪火。这样就算有一天你没了，曲子还在。",ea:"I would teach the zither widely while alive.",er:"You understand urgency better than Ji Kang: not teaching at the cliff's edge, but spreading the fire early. Then even if you fall, the tune remains."}
 ]},
{s:"《聊斋志异 · 卷一》",t:"崂山道士",img:"tale_18.jpg",
 o:"邑有王生，行七，故家子。少慕道，闻劳山多仙人，负笈往游。登一顶，有观宇，甚幽。一道士坐蒲团上，素发垂领，而神光爽迈。……王曰：「弟子操作多日，师略授小技，此来为不负也。」道士问：「何术之求？」王曰：「每见师行处，墙壁所不能隔，但得此法足矣。」道士笑而允之。乃传以诀，令自咒毕，呼曰：「入之！」王面墙，不敢入。又曰：「试入之。」王果从容入，及墙而阻。道士曰：「俯首骤入，勿逡巡！」王果去墙数步，奔而入；及墙，虚若无物，回视，果在墙外矣。大喜，入谢。道士曰：「归宜洁持，否则不验。」……王窃喜，以为得术，归家，妻曰：「汝去几月，何所得乎？」王乃自夸，欲以试之。头触硬壁，蓦然而踣。妻扶视之，额上坟起，如巨卵焉。",
 w:"崂山有个道士法术高强，能穿墙而过。王生学了几日，别的没学会，就想学穿墙术。道士教他口诀，他试着果然穿墙而过，欢喜不已。道士叮嘱：回去要洁身自持，否则法术不灵。王生回家向妻子炫耀，念咒往墙上一撞——头撞硬壁，摔倒在地，额头上鼓起一个大包。",
 u:"穿墙术是真的，但你若以为它是捷径，它就会在你头上撞出个大包——术不欺人，人自欺。",
 q:"你有没有一门「学了点皮毛就觉得自己会了」的本事——然后翻车过？现在还敢在人前显摆吗？",
