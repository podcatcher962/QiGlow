  {a:"请教老前辈，少走弯路",r:"你聪明：先找懂行的人问路。新死鬼也请教了——只是它学错了方向，你要学它求教，别学它吓人。",ea:"Ask the elders. Avoid the detours.",er:"You are wise: ask those who know first. The new ghost also asked, but learned the wrong lesson. Learn its asking, not its scaring."},
  {a:"凭感觉摸索，吃了亏再改",r:"你摸着石头过河。可以，但新死鬼推了一晚上磨才明白——有些亏，问一句就能省。",ea:"Feel my way, correct after mistakes.",er:"You cross the river by touch. Fine, but the new ghost only understood after grinding all night. Some losses one question would have saved."},
  {a:"既干活，也学着让人知道我在干活",r:"你懂分寸：干活是基础，被看见是能力。那个信佛人家，至少记住了「鬼推磨」的恩情。",ea:"Work, and learn to let my work be seen.",er:"You have the sense: work is the base, being seen is the skill. That devout house at least remembered the ghost that ground wheat."},
  {a:"觉得做鬼太累，想回去",r:"你想退缩。可以理解——但新死鬼要是回去了，就永远学不会做鬼。挺一挺，磨完这袋麦子就好了。",ea:"Being a ghost is too hard. Want to go back.",er:"You want to retreat. Understandable. But if the new ghost went back, it would never learn to be a ghost. Bear it; finish the sack of wheat."}
 ]},
{s:"《博物志 · 卷十》",t:"天河浮槎",img:"",
 o:"旧说云：天河与海通。近世有人居海渚者，年年八月有浮槎去来，不失期。人有奇志，立飞阁于槎上，多赍粮，乘槎而去。十余日中，犹观星月日辰，自后茫茫忽忽，亦不觉昼夜。去十余日，奄至一处，有城郭状，屋舍甚严。遥望宫中多织妇，见一丈夫牵牛渚次饮之。牵牛人乃惊问曰：「何由至此？」此人具说来意，并问此是何处。答曰：「君还至蜀郡，访严君平则知之。」竟不上岸，因还如期。后至蜀，问君平，曰：「某年月日，有客星犯牵牛宿。」计年月，正此人到天河时也。",
 w:"传说天河和大海相通。海边有人每年八月看到有木筏漂来漂去。有个有奇志的人备足粮食，乘着木筏出海，漂了十几天，到了一座城池——看见许多织女在织布，一个男子牵着牛在河边饮水。那人问他这是什么地方，牵牛人说：你回去问蜀郡的严君平就知道了。此人回来后去找严君平，严君平翻记录说：某年某月，有客星侵犯牵牛星。算算日期，正是他到达天河的时候。",
 u:"他乘一片木筏，漂到了牵牛星跟前——原来我们仰望的天河，不过是另一些人脚下的海。",
 q:"你还有没有那份「不知道通向哪里也要去看看」的好奇心？还是已经被日子磨平了？",
 en_s:"Bowuzhi · Scroll 10",en_t:"The Raft to the Milky Way",en_o:"An old saying: the Milky Way and the sea connect. In recent times a man lived on a sea islet; every year in the eighth month a raft came and went without fail. The man, of strange ambition, built a flying pavilion on the raft, loaded much grain, and went. For over ten days he watched the stars, moon, sun and seasons; after that all was dim and he knew not day from night. After more than ten days he suddenly reached a place with the shape of a city, with stern houses. Far off he saw many weaving women in the palace, and saw a man leading an ox to drink at the river's edge. The ox-herd asked in surprise: How did you come here? The man told his purpose and asked what place this was. The answer: Return to Shu and ask Yan Junping. He did not go ashore, but returned as expected. Later in Shu he asked Junping, who said: On such a year and day a guest star invaded the Oxherd asterism. Counting the dates, it was exactly when the man reached the Milky Way.",en_w:"It is said the Milky Way meets the sea. A man of strange ambition boarded the yearly raft, drifted over ten days, and reached a city of weaving maids and an ox-herd by the river. Told to ask Yan Junping of Shu, he returned, and Junping's records showed a guest star touching the Oxherd on the very day he arrived.",en_u:"He drifted on a single raft to the Oxherd's side. The Milky Way we gaze at is only another sea beneath other people's feet.",en_q:"Do you still have that curiosity to go and see where the road leads, even unknown? Or has life ground it flat?",opts:[
  {a:"有——不知道去哪，也要漂一漂",r:"你是那个乘槎人：备粮出海，不问归期。星河在脚下时，你才知道天有多宽——保持好奇，是你还没老的证据。",ea:"Yes. Even unknown, I would drift.",er:"You are the rafter: grain loaded, no question of return. Only when the Milky Way is under your feet do you know how wide the sky is. Curiosity is proof you have not aged."},
  {a:"没了——日子要紧，别瞎折腾",r:"你务实。可以，但乘槎人的故事提醒：海边年年有浮槎，就看你上不上——偶尔看一眼，也算没全丢。",ea:"Gone. Life is serious; no fooling around.",er:"You are practical. Fine. But the rafter's tale reminds: the raft comes every August. It only asks whether you board. Glance at it once in a while; that is not nothing."},
  {a:"怕回不来，不敢上槎",r:"你权衡风险。对，漂到牵牛星回不回得来真不好说——但严君平能查到记录，说明他回来了。有些冒险，比想象的安全。",ea:"Afraid of not coming back. Dare not board.",er:"You weigh the risk. True: whether one returns from the Oxherd is uncertain. But Junping had the record, which means he came back. Some adventures are safer than they look."},
  {a:"让别人去漂，我等着听故事",r:"你是听客。也可以——但你的孩子问「天上有什么」时，你只能转述别人的奇遇。",ea:"Let others drift. I will listen to stories.",er:"You are the listener. Also fine. But when your child asks what is up there, you can only retell another's adventure."},
  {a:"漂到一半就后悔了",r:"你会在半路怂。可以理解——但乘槎人没后悔，他问路、记日期、按时回来。后悔的人，错过的是牵牛人的回答。",ea:"Would regret it halfway.",er:"You would lose nerve midway. Understandable. But the rafter did not regret: he asked the way, marked the date, came home on time. The regretful miss the Oxherd's answer."},
  {a:"带着孩子一起漂",r:"你把好奇传下去。好——但记得像严君平那样记下日期，若干年后，孩子会拿着记录来对答案。",ea:"Bring the child along.",er:"You pass curiosity down. Good. But record the date like Junping. Years later the child will bring the record to check the answer."}
 ]},
{s:"《集异记 · 卷五》",t:"旗亭画壁",img:"",
 o:"开元中，诗人王昌龄、高适、王之涣齐名。时风尘未偶，而游处略同。一日天寒微雪，三诗人共诣旗亭，贳酒小饮。忽有梨园伶官十数人，登楼会宴。三诗人因避席隈映，拥炉火以观焉。俄有妙妓四辈，寻续而至……昌龄等私相约曰：「我辈各擅诗名，每不自定其甲乙，今者可以密观诸伶所讴，若诗入歌词之多者，则为优矣。」……三妓皆讴昌龄、高适之诗。之涣自以得名已久，因谓诸人曰：「此辈皆潦倒乐官，所唱皆巴人下里之词耳，岂阳春白雪之曲，俗物敢近哉？」因指诸妓之中最佳者曰：「待此子所唱，如非我诗，吾即终身不敢与子争衡矣。脱是吾诗，子等当须列拜床下，奉吾为师。」……须臾，次至双鬟发声，则曰：「黄河远上白云间，一片孤城万仞山。羌笛何须怨杨柳，春风不度玉门关。」",
 w:"开元年间，王昌龄、高适、王之涣齐名。一天微雪，三人去酒楼小饮，正遇梨园歌女唱诗。三人约定：看歌女们唱谁的诗多，谁就排第一。前几个歌女唱的都是王昌龄和高适的诗。王之涣指着最美的歌女说：等她唱，若唱的不是我的诗，我终身不与你们争高下；若是我的诗，你们要拜我为师。那歌女开口便唱：「黄河远上白云间，一片孤城万仞山……」——正是王之涣的《凉州词》。三人抚掌大笑。",
 u:"名气这东西，争不来，也压不住——它只在某个歌女开口的瞬间，自己落地。",
 q:"在才华被比较的场合（比稿、升职、朋友圈），你「排第几」？你还在意这个排名吗？",
 en_s:"Jiyiji · Scroll 5",en_t:"The Wine-Shop Wall Verses",en_o:"In the Kaiyuan era the poets Wang Changling, Gao Shi and Wang Zhihuan were equally famed. One cold day with light snow, the three poets went to a wine shop for a small drink. Suddenly a dozen entertainers of the Pear Garden came up to feast. The three poets withdrew aside and watched by the fire. Soon four lovely singers arrived. Changling and the others privately agreed: We each claim fame for poetry and never settle our order. Let us secretly watch which of our poems the singers perform; the one most sung is best. The first three sang Changling's and Gao Shi's poems. Zhihuan, thinking his fame long established, said: These are low entertainers singing common songs. Would vulgar things dare approach a song of the snowy heights? He pointed at the most beautiful singer: When she sings, if it is not my poem, I will never contend with you again. If it is mine, you must bow and call me teacher. Soon the double-coiled singer raised her voice: The Yellow River rises far into white clouds; a lone city amid ten-thousand-ren mountains. Why should the Qiang flute blame the willow? The spring wind never crosses the Jade Gate Pass.",en_w:"Wang Changling, Gao Shi and Wang Zhihuan, equally famed, met singers at a wine shop and agreed: the one whose poem is sung most ranks first. The first singers sang Changling and Gao Shi. Zhihuan pointed to the fairest singer: if she does not sing my poem, I yield forever; if she does, you bow to me as teacher. She sang his Liangzhou Verse. The three clapped and laughed.",en_u:"Fame cannot be fought for and cannot be suppressed. It lands by itself, the moment a singer opens her mouth.",en_q:"In arenas where talent is compared, pitch contests, promotions, feeds, where do you rank? Do you still care?",opts:[
  {a:"在意——但更在意作品本身",r:"你是王之涣：被压了一路，最后压轴的是他的诗。你信：名次会变，诗不会——所以你把力气花在写诗上，不是争名上。",ea:"I care, but more about the work itself.",er:"You are Wang Zhihuan: pressed all evening, and the finale was his poem. You believe ranks change; poems do not. So you spend strength on writing, not contending."},
  {a:"不太在意排名，写自己的",r:"你洒脱。可以，但王昌龄高适没在意，诗却流传了——不在意，也是一种把自己交给时间的自信。",ea:"Not much. Write my own.",er:"You are free. Fine. Changling and Gao Shi did not fuss, and their poems endured. Not caring is a kind of confidence that hands itself to time."},
  {a:"在意——输了会不服",r:"你胜负欲强。可以，但旗亭的故事里，三人最后抚掌大笑——那笑声比排名值钱。学着把输赢，笑过去。",ea:"I care. Losing stings.",er:"You are competitive. Fine. But in the wine-shop tale the three ended clapping. That laughter outlasts the ranking. Learn to laugh the win and loss away."},
  {a:"怕被比下去，不敢上场",r:"你躲着比较。可以理解，但旗亭的歌女不唱你的诗，不代表你没诗——你先得有诗，才谈得上唱不唱。",ea:"Afraid of being outshone. Dare not enter.",er:"You avoid comparison. Understandable. But the singers not performing your poem does not mean you have none. First have a poem, then speak of performance."},
  {a:"先记下谁唱了什么，回去复盘",r:"你是观察型：把比较当数据。对，三人复盘出了排名——但真正留到今天的，不是排名，是那首诗。",ea:"Note who sang what, and review after.",er:"You are the observer, turning comparison into data. Right: they reviewed a ranking. But what survives today is not the rank; it is the poem."},
  {a:"觉得比来比去没意思",r:"你觉得无谓。对，千年后没人记得当日谁第一——但《凉州词》还在。比名次更稳的，是留下作品。",ea:"Comparing is meaningless.",er:"You find it futile. Right: no one remembers who ranked first that day. But the Liangzhou Verse remains. A work outlasts a rank."}
 ]},
{s:"《史记 · 廉颇蔺相如列传》",t:"负荆请罪",img:"",
 o:"既罢归国，以相如功大，拜为上卿，位在廉颇之右。廉颇曰：「我为赵将，有攻城野战之大功，而蔺相如徒以口舌为劳，而位居我上。且相如素贱人，吾羞，不忍为之下。」宣言曰：「我见相如，必辱之。」相如闻，不肯与会。……居顷之，相如出，望见廉颇，相如引车避匿。……廉颇闻之，肉袒负荆，因宾客至蔺相如门谢罪，曰：「鄙贱之人，不知将军宽之至此也！」卒相与欢，为刎颈之交。",
 w:"蔺相如凭口舌之功拜为上卿，位在廉颇之上。廉颇不服，扬言要羞辱他。相如处处避让，门客不解。相如说：强秦不敢加兵于赵，是因为有我们两个——两虎相斗，必有一伤。廉颇听说后，肉袒负荆，到相如门前请罪。两人和好，成为刎颈之交。",
 u:"「负荆请罪」不是认怂，是认清了什么更贵重——国家的命，比自己的面子值钱。",
 q:"你拉得下脸去道歉吗？当「面子」和「大局」冲突，你背得起那根荆条吗？",
 en_s:"Shiji · Lian Po Lin Xiangru Liezhuan",en_t:"Carrying Thorns to Apologize",en_o:"When the embassy returned, Lin Xiangru, for his great merit, was made high minister, ranking above Lian Po. Lian Po said: I am a general of Zhao with great deeds of sieges and battles, while Xiangru has merit only by words, yet ranks above me. And he was once a lowly man; I am ashamed to be below him. He declared: When I see Xiangru, I will humiliate him. Xiangru heard and would not meet him. After a while Xiangru went out, saw Lian Po, and turned his carriage to avoid him. Lian Po, hearing this, bared his back, carried thorns, and through guests came to Xiangru's gate to apologize: A base fellow, I did not know you were so generous! In the end they rejoiced together and became friends who would die for each other.",en_w:"Lin Xiangru rose above Lian Po by his tongue. Lian Po, offended, vowed to shame him. Xiangru avoided him everywhere; his retainers wondered. Xiangru said: Strong Qin dares not attack Zhao because of us two. Two tigers fighting, one must fall. Lian Po heard this, bared his back with thorns, and came to apologize. They became fast friends.",en_u:"Carrying thorns is not surrender; it is recognizing what is more precious. The life of the state outweighs one man's face.",en_q:"Can you lower your face to apologize? When face and the greater good conflict, can you carry the thorns?",opts:[
  {a:"能——错了就认，背荆条去",r:"你是廉颇：肉袒负荆，上门请罪。认错不丢人，丢人的是明明错了还端着——你背起荆条那一刻，比打了胜仗还硬气。",ea:"Yes. Wrong is wrong; carry the thorns and go.",er:"You are Lian Po: bared back, thorns on, apology at the gate. Admitting wrong is no shame; the shame is holding on while wrong. The moment you carry the thorns, you stand taller than any victory."},
  {a:"认错，但心里别扭",r:"你肯认，但不痛快。可以，廉颇也是想了很久才去的——认错是过程，放下才是结果。",ea:"Admit wrong, but uneasy.",er:"You admit but without ease. Fine. Lian Po also took long to go. Admitting is a process; letting go is the result."},
  {a:"拉不下脸——算了，冷战吧",r:"你端着。可以理解，但廉颇要是一直端着，赵国就亡了——你的「大局」经得起几次冷战？",ea:"Cannot lower my face. Cold war then.",er:"You hold on. Understandable, but had Lian Po held on, Zhao would have fallen. How many cold wars can your greater good survive?"},
  {a:"看谁错得多，他先道歉我才道",r:"你讲对等。可廉颇是错的更狠的那个——先低头的人，不一定错得更多，只是把「我们」看得更重。",ea:"Depends who erred more. He apologizes first.",er:"You want parity. But Lian Po was the more wrong. The one who bows first is not necessarily more wrong; he values the we more."},
  {a:"用行动道歉，不说「对不起」",r:"你含蓄。可以，相如最后也不是听他说了什么，是看他来了——行动派的道歉，一样算数。",ea:"Apologize by deeds, not words.",er:"You are understated. Fine. Xiangru finally trusted not his words but his coming. A doer's apology counts too."},
  {a:"觉得没必要和好，各过各的",r:"你觉得惹不起躲得起。可赵国就那么大，将相不和，强秦就来了——有些「躲」，躲到最后是连躲的地方都没了。",ea:"No need to reconcile. Live apart.",er:"You think avoiding works. But Zhao was only that big. General and minister at odds, and strong Qin came. Some avoiding ends with no place to avoid to."}
 ]},
{s:"《史记 · 越王勾践世家》",t:"卧薪尝胆",img:"",
 o:"吴既赦越，越王勾践反国，乃苦身焦思，置胆于坐，坐卧即仰胆，饮食亦尝胆也。曰：「女忘会稽之耻邪？」身自耕作，夫人自织，食不加肉，衣不重采，折节下贤人，厚遇宾客，振贫吊死，与百姓同其劳。",
 w:"吴王夫差赦免了越国，越王勾践回到越国后，苦身焦思：把苦胆挂在座位上方，坐卧时抬头就尝一口，吃饭时也尝尝——提醒自己：你忘了会稽之耻吗？他亲自耕种，夫人亲自织布，吃饭不加肉，穿衣不穿彩色，礼贤下士，与百姓同甘共苦。二十年后，终于灭了吴国。",
 u:"卧薪尝胆不是自虐，是把自己变成一件「复仇的工具」——恨意是他熬过二十年的火，也是他这一生都烧不尽的疤。",
 q:"为了一件事（目标、翻身、雪耻），你能忍住多久的「苦日子」？你心里那枚苦胆，还挂着吗？",
 en_s:"Shiji · Yue Wang Goujian Shijia",en_t:"Sleeping on Brushwood, Tasting Gall",en_o:"Wu having pardoned Yue, King Goujian returned to his state, and afflicted his body and tormented his mind, placing a gall bladder in his seat; sitting or lying he looked up to taste it, and at meals he tasted it too, saying: Have you forgotten the shame of Kuaiji? He himself plowed, his wife wove, his food had no meat, his clothes no colors; he lowered himself to worthy men, treated guests generously, relieved the poor, mourned the dead, and shared the toil of the people. Twenty years later, he destroyed Wu.",en_w:"King Goujian of Yue, pardoned by Wu, hung a gall bladder by his seat, tasting it at every meal to remember the shame of Kuaiji. He farmed himself, his wife wove, no meat, no colors, honoring the worthy, sharing the people's toil. Twenty years later he destroyed Wu.",en_u:"Sleeping on brushwood and tasting gall is not self-torture; it is making yourself a tool of revenge. The hatred was the fire that kept him twenty years, and the scar that never healed.",en_q:"For one goal, a comeback, a vindication, how long can you bear the bitter days? Is your gall still hanging?",opts:[
  {a:"挂着——每天尝一口，不忘",r:"你是勾践：苦胆挂梁，坐卧仰胆。你信「不忘」的力量——只是要记得，尝胆是为了翻身，不是为了让自己苦一辈子。",ea:"Hanging. Taste it daily; never forget.",er:"You are Goujian: gall overhead, tasting at every turn. You believe in not-forgetting. Only remember: the gall is for turning around, not for bittering a lifetime."},
  {a:"尝过，后来摘了",r:"你痛过、忘过。可以理解——但勾践二十年不摘胆，靠的不是记性，是那口气。你摘了胆，那口气还在吗？",ea:"Tasted it once. Took it down.",er:"You ached and forgot. Understandable. But Goujian kept it twenty years by breath, not memory. You took it down. Is the breath still there?"},
  {a:"不吃苦，找捷径",r:"你务实。可以，但勾践的捷径（献西施、赂伯嚭）他也用了——先低头再翻身，本身就是一种「捷径」。",ea:"No suffering. Find a shortcut.",er:"You are practical. Fine. But Goujian used shortcuts too: the beauty, the bribe. Bowing first to rise later is itself a shortcut."},
  {a:"苦日子可以过，但心里要有个盼头",r:"你清醒：卧薪是手段，复国是目的。对，勾践心里有会稽之耻这个「盼头」——你也要有个方向，不然苦就白吃了。",ea:"Bitter days are bearable if there is hope ahead.",er:"You are clear: brushwood is a means, restoration the end. Right: Goujian's hope was the shame of Kuaiji. You need a direction too, or the bitterness is wasted."},
  {a:"怕苦怕到不敢开始",r:"你被「二十年」吓住了。可以理解——但勾践也不是一口气忍二十年，是每天只忍一天。你也试试：先忍今天。",ea:"The twenty years frighten me. Dare not begin.",er:"The twenty years scare you. Understandable. But Goujian did not bear twenty years at once; he bore one day at a time. Try: bear today."},
  {a:"觉得恨着活太累",r:"确实累。勾践灭吴后，范蠡走了，文种死了——靠恨撑起来的人，翻身之后往往空落落的。你可以不选恨，选目标。",ea:"Living on hatred is too tiring.",er:"It is. After Goujian destroyed Wu, Fan Li left and Wen Zhong died. Those propped by hatred often feel hollow after the rise. You need not choose hatred. Choose a goal."}
 ]},
{s:"《战国策 · 秦策一》",t:"苏秦刺股",img:"",
 o:"苏秦说秦王书十上而说不行，黑貂之裘敝，黄金百斤尽，资用乏绝，去秦而归。羸縢履跷，负书担囊，形容枯槁，面目黎黑，状有归色。归至家，妻不下纴，嫂不为炊，父母不与言。苏秦喟叹曰：「妻不以我为夫，嫂不以我为叔，父母不以我为子，是皆秦之罪也！」乃夜发书，陈箧数十，得《太公阴符》之谋，伏而诵之，简练以为揣摩。读书欲睡，引锥自刺其股，血流至足。",
 w:"苏秦游说秦王十次都没成功，黑貂裘磨破了，百斤黄金花光了，落魄回家。妻子不下织机，嫂子不给他做饭，父母不跟他说话。苏秦感叹一番，连夜翻出几十箱书，挑出《太公阴符》研读。读书想睡时，就用锥子扎自己的大腿，血流到脚。一年后，他说服六国合纵，佩六国相印。",
 u:"锥子刺的不是腿，是那份「被全世界看轻」的疼——要么用这口气杀了自己，要么用它凿出一条路。",
 q:"当你被家人、圈子「看轻」时，你是吞下这口气认命，还是把它变成刺股的那根锥子？",
 en_s:"Zhanguoce · Qince 1",en_t:"Su Qin Pierces His Thigh",en_o:"Su Qin presented ten memorials to the King of Qin, and none was heeded. His black sable robe was worn through, his hundred jin of gold spent, his means exhausted; he left Qin and returned. Thin-shanked, dragging shoes, bearing books and packs, his form withered, his face dark, he went home with a look of defeat. At home his wife did not leave her loom, his sister-in-law did not cook for him, his parents would not speak to him. Su Qin sighed: My wife treats me not as a husband, my sister-in-law not as a brother-in-law, my parents not as a son. It is all the fault of Qin! That night he opened his books, spread out dozens of cases, and found the schemes of the Tai Gong Yin Fu. He bent to recite, distilling it for reflection. When he grew drowsy, he took an awl and pierced his own thigh; the blood ran to his feet.",en_w:"Su Qin failed ten times before the King of Qin and went home in rags. His wife ignored him, his sister-in-law cooked for him nothing, his parents did not speak. That night he opened his books, found the Tai Gong Yin Fu, and studied with an awl against his thigh, blood running to his feet. A year later he persuaded six states to unite and wore the seals of six chancellors.",en_u:"The awl did not pierce his leg; it pierced the pain of being despised by the whole world. Either let that breath kill you, or use it to cut a road.",en_q:"When family and circle look down on you, do you swallow the breath and resign, or turn it into the awl against your thigh?",opts:[
  {a:"变成锥子——苦读苦练，证明自己",r:"你是苏秦：夜发书、引锥刺股。被看轻的疼最是清醒剂——你用它凿出了一条路，家人后来都来迎接你。",ea:"Turn it into an awl. Study and prove myself.",er:"You are Su Qin: books by night, awl by thigh. The sting of being despised is the clearest wake-up. You used it to cut a road, and the family came out to greet you."},
  {a:"吞下去，默默远离",r:"你选择离开那个圈子。可以理解——但苏秦证明了「离开」之前，先「证明」——你至少要让曾经看轻你的人，有一天说不出话。",ea:"Swallow it. Drift quietly away.",er:"You choose to leave that circle. Understandable. But Su Qin proved that before leaving, first prove. Let those who once looked down have nothing to say one day."},
  {a:"争口气，但不想自虐",r:"你不认同刺股。对，锥子是苏秦的极端——你可以用闹钟、用责任、用欲望，只要能点燃那份「不甘」，方法不限。",ea:"Fight for the breath, but no self-torture.",er:"You reject the awl. Right: the awl was Su Qin's extreme. You may use an alarm, a duty, a desire. Any fuel that lights the not-resigned will do."},
  {a:"被看轻惯了，懒得争了",r:"你累了。可以——但苏秦落魄时也被看轻，他差点也认了。你歇够了，那箱书还在，随时可以再翻开。",ea:"Used to being looked down. Too tired to fight.",er:"You are weary. Fine. But Su Qin was also despised in his fall, and nearly resigned too. When you have rested, the books are still in the case."},
  {a:"证明给在乎的人看，不在乎的就算了",r:"你目标精准：只为值得的人证明。苏秦是为六国，你是为家人——少些观众，反而更扛得住。",ea:"Prove to those who matter. The rest, skip.",er:"You aim precisely: prove only to the worthy. Su Qin proved for six states; you for family. Fewer spectators, more endurance."},
  {a:"现在就开始，从今晚那页书开始",r:"你不空谈，直接动手。对，苏秦也是从「夜发书」那一晚开始的——你今天翻开的那页，就是你的《太公阴符》。",ea:"Begin now, from tonight's page.",er:"You do not talk; you act. Right: Su Qin began on the night of opening the books. The page you open today is your Tai Gong Yin Fu."}
 ]},
{s:"《列子 · 汤问》",t:"愚公移山",img:"",
 o:"太行、王屋二山，方七百里，高万仞。本在冀州之南，河阳之北。北山愚公者，年且九十，面山而居。惩山北之塞，出入之迂也，聚室而谋曰：「吾与汝毕力平险，指通豫南，达于汉阴，可乎？」杂然相许。其妻献疑曰：「以君之力，曾不能损魁父之丘，如太行、王屋何？且焉置土石？」……愚公曰：「汝心之固，固不可彻，曾不若孀妻弱子。虽我之死，有子存焉；子又生孙，孙又生子；子又有子，子又有孙；子子孙孙无穷匮也，而山不加增，何苦而不平？」河曲智叟笑而止之曰：「甚矣，汝之不惠！以残年余力，曾不能毁山之一毛，其如土石何？」",
 w:"太行、王屋两座大山挡在门口，出行绕路。快九十岁的愚公召集全家：我们合力把山移平！妻子质疑：你连座小土丘都搬不动，怎么移这两座大山？愚公说：我死了有儿子，儿子有孙子，子子孙孙无穷无尽，而山不会变高，还怕移不平吗？河曲智叟嘲笑他太傻，愚公说：你连寡妇孤儿都不如。天帝被感动，派夸娥氏的两个儿子把山背走了。",
 u:"智叟笑愚公傻，可最后是愚公赢了——因为智叟只会「算」，愚公会「做」。世上哪座山，不是一代一代背走的？",
 q:"面对一座「看起来不可能」的山（大目标、老习惯、坏局面），你是智叟还是愚公？",
 en_s:"Liezi · Tang Wen",en_t:"The Fool Moves the Mountains",en_o:"The Taihang and Wangwu mountains, seven hundred li square, ten-thousand-ren high, lay south of Jizhou and north of Heyang. The Fool of the North Mountain, nearly ninety, lived facing them. Suffering the blockage to the north and the detour of his comings and goings, he gathered his family and said: Let us with all our strength level the danger and open a way to southern Yu and Han-yin. Is it possible? All agreed. His wife doubted: With your strength you could not harm even a small mound. What of Taihang and Wangwu? And where to put the earth and stones? The Fool said: Your heart is so set it cannot be opened; you are no match for the widow and the orphan. Though I die, there are sons; sons beget grandsons, grandsons beget sons; sons have sons, sons have grandsons; descendants without end, while the mountain does not grow. Why should we not level it? The Wise Man of the River Bend laughed and stopped him: How unwise you are! With your remnant years and strength, you cannot destroy one hair of the mountain. What of the earth and stones?",en_w:"Two great mountains blocked the Fool's door. At ninety, he gathered his family to move them. His wife doubted; the Wise Man laughed. The Fool said: I die, but sons, grandsons, endless generations, and the mountain does not grow. Heaven was moved and sent two giants to carry the mountains away.",en_u:"The Wise Man laughed at the Fool, but the Fool won. Because the Wise Man only calculates; the Fool acts. Which mountain was ever moved except by generation after generation?",en_q:"Facing a mountain that looks impossible, a great goal, an old habit, a bad situation, are you the Wise Man or the Fool?",opts:[
  {a:"愚公——子子孙孙，无穷匮也",r:"你是愚公：九十岁还想移山。你信时间站在你这边——因为你准备的不只是自己，是无穷匮的接力。",ea:"The Fool. Descendants without end.",er:"You are the Fool: at ninety, still moving mountains. You trust time is on your side, because you prepare not only yourself but an endless relay."},
  {a:"智叟——先算算值不值",r:"你理性。可以，智叟说的都对——但他输在「笑」，笑是放弃的开始。你可以算，别笑。",ea:"The Wise Man. First reckon the cost.",er:"You are rational. Fine: the Wise Man was right about everything. But he lost in the laugh. The laugh is where giving up begins. You may calculate; do not laugh."},
  {a:"先挖两锹试试",r:"你是行动派：不辩论，先动手。对，愚公也没等辩论完——挖两锹，山就少两锹。",ea:"Dig two spadefuls first.",er:"You are a doer: no debate, start digging. Right: the Fool did not wait for the debate to end. Two spadefuls, and the mountain is two spadefuls less."},
  {a:"等别人先挖",r:"你观望。可以，但愚公的队伍里，先动手的是九十岁的老头——你等的人，可能也是九十岁。",ea:"Wait for others to dig first.",er:"You watch. Fine. But in the Fool's team, the first to move was a ninety-year-old man. The one you wait for may be ninety too."},
  {a:"觉得山挪不走，就搬家",r:"你灵活：移山不如搬家。对，这也是解法——只是有些「山」在心里，搬家也躲不掉。",ea:"If the mountain cannot move, move house.",er:"You are flexible: moving is better than moving mountains. Right, it is a solution. But some mountains live in the heart; moving house does not dodge them."},
  {a:"把山当健身器材，慢慢啃",r:"你乐观：把苦难当修行。愚公挖山挖出了感动天帝的诚意——你挖着挖着，可能就挖出了自己的路。",ea:"Treat the mountain as a gym. Gnaw slowly.",er:"You are optimistic: suffering as practice. The Fool's digging moved Heaven. Dig on, and you may dig out your own road."}
 ]},
{s:"《庄子 · 养生主》",t:"庖丁解牛",img:"",
 o:"庖丁为文惠君解牛，手之所触，肩之所倚，足之所履，膝之所踦，砉然向然，奏刀騞然，莫不中音。合于《桑林》之舞，乃中《经首》之会。文惠君曰：「嘻，善哉！技盖至此乎？」庖丁释刀对曰：「臣之所好者道也，进乎技矣。始臣之解牛之时，所见无非牛者。三年之后，未尝见全牛也。方今之时，臣以神遇而不以目视，官知止而神欲行。……彼节者有间，而刀刃者无厚；以无厚入有间，恢恢乎其于游刃必有余地矣。」",
 w:"庖丁给文惠君宰牛，手触肩倚、刀起刀落，声音合着音乐的节拍。文惠君惊叹：技术怎么能到这种地步？庖丁放下刀说：我爱好的是道，已经超过技术了。我最初宰牛时，看见的是一整头牛；三年之后，看不见整牛了；现在，我用精神去接触而不是用眼睛看。牛的骨节有间隙，而我的刀刃薄得没有厚度——用没有厚度的刀进入有间隙的骨节，游刃有余。十九年了，刀还像新磨的一样。",
 u:"「游刃有余」不是天生的——是你先把自己磨薄，再把对手看透。十九年，一把刀，一个牛，足够练出那点「余地」。",
 q:"你的「刀」（手艺、专业）用了多少年？你是在「目视全牛」，还是已经「以神遇而不以目视」？",
 en_s:"Zhuangzi · Yangsheng Zhu",en_t:"Cook Ding Cuts the Ox",en_o:"Cook Ding was cutting an ox for Lord Wenhui. His hand touched, shoulder leaned, foot trod, knee pressed; the flesh fell with a hiss, the knife moved with a slide, all in accord with the music, matching the Dance of the Mulberry Grove, the rhythm of the Jingshou. Lord Wenhui said: Ah, excellent! How can skill reach this? Cook Ding set down his knife and answered: What I love is the Way, which goes beyond skill. When I first cut oxen, I saw nothing but the ox. After three years, I no longer saw the whole ox. Now I meet it with the spirit and no longer look with the eyes; the senses stop and the spirit moves. The joints have spaces, and my blade has no thickness; what enters from no-thickness into spaces moves freely, with room to spare.",en_w:"Cook Ding cut an ox with movements that matched music. Lord Wenhui marveled. Ding said: I love the Way, beyond skill. At first I saw the whole ox; after three years, no whole ox; now I meet it with spirit, not eyes. The joints have gaps, my blade has no thickness; entering from no-thickness into gaps, the blade roams with room to spare. Nineteen years, and the knife is still new.",en_u:"Roaming with room to spare is not born of talent. You first grind yourself thin, then see the opponent through. Nineteen years, one knife, one ox, enough to train that little room.",en_q:"How many years has your knife, your craft, been in use? Do you still see the whole ox, or meet it with the spirit?",opts:[
  {a:"以神遇——闭着眼都知道刀往哪走",r:"你是老庖丁：十九年磨一刀。你那份「游刃有余」不是运气，是把自己磨薄、把事看透后的必然。",ea:"Meet with the spirit. Eyes closed, I know where the blade goes.",er:"You are old Cook Ding: nineteen years, one knife. Your room to spare is not luck; it is the necessity of having ground yourself thin and seen the matter through."},
  {a:"还在目视全牛——刚入门",r:"你在练刀期。别急——庖丁也是从「所见无非牛」开始的。三年后，你也会看不见整头牛。",ea:"Still see the whole ox. Just begun.",er:"You are in the sharpening years. Do not rush. Ding also began with nothing but the ox. In three years, you too will stop seeing the whole ox."},
  {a:"换过好几把刀——遇到硬骨头就换",r:"你总在「解不动」时换行。可以，但庖丁的经验是：刀会卷刃，是心没静下来——你的问题可能不在刀。",ea:"Changed knives several times. Change whenever the bone is hard.",er:"You switch trades when the cutting stalls. Fine. But Ding's lesson: a rolled edge means the heart was not still. The problem may not be the knife."},
  {a:"我磨的不是刀，是别的",r:"你把功夫花在别处：代码、手艺、谈判、带孩子——都行。只要是「以无厚入有间」的活，都算庖丁。",ea:"I grind not a knife but other things.",er:"You spend the craft elsewhere: code, handiwork, negotiation, raising children. Any work that enters no-thickness into spaces is Cook Ding."},
  {a:"怕磨刀太慢，想走捷径",r:"你想速成。可以，但庖丁的「快」是十九年攒的——捷径解出的牛，多半骨头带肉，硌牙。",ea:"Grinding is too slow. Want a shortcut.",er:"You want speed. Fine. But Ding's speed was saved over nineteen years. An ox cut by a shortcut comes out with bone and gristle."},
  {a:"我的刀还新，慢慢磨",r:"你在路上，刀还是新的。好——记住：别急着显摆，也别急着砍硬骨头。磨到「以神遇」，自然游刃有余。",ea:"My knife is new. Grinding slowly.",er:"You are on the road; the knife is new. Good. Remember: do not show it off, do not rush at hard bones. Grind until the spirit meets, and the roaming will have room."}
 ]},
{s:"《韩非子 · 五蠹》",t:"守株待兔",img:"",
 o:"宋人有耕者。田中有株，兔走触株，折颈而死。因释其耒而守株，冀复得兔。兔不可复得，而身为宋国笑。",
 w:"宋国有个耕田的人。田里有一棵树桩，一只兔子跑来撞到树桩上，折断脖子死了。于是他放下农具守在树桩旁，盼着再捡到兔子。兔子当然再也捡不到了，他自己却成了宋国的笑话。",
 u:"守株待兔的笑话，不在「等」，在「把偶然当必然」——好运撞上来一次，不代表它会再来。",
 q:"你有没有「守过株」——把一次偶然的成功当成可以复制的套路，然后就再也不肯挪窝了？",
 en_s:"Hanfeizi · Wudu",en_t:"Waiting by the Stump",en_o:"There was a farmer of Song. In his field stood a stump; a rabbit running struck it, broke its neck, and died. Thereupon he set down his plow and waited by the stump, hoping for another rabbit. No rabbit ever came again, and he became the laughingstock of Song.",en_w:"A farmer of Song saw a rabbit kill itself on a stump in his field. He set down his plow and waited by the stump for another. No rabbit came; he became the joke of Song.",en_u:"The joke is not in the waiting, but in taking the accidental for the inevitable. Luck strikes once; that does not mean it will come again.",en_q:"Have you ever waited by a stump, treating one lucky success as a repeatable formula, and then refused to move?",opts:[
  {a:"守过——后来撞了南墙才醒",r:"你当过宋人。可以理解——但清醒就好：兔子是偶然，耕田才是必然。你回去耕地了吗？",ea:"Have waited. Woke after hitting the wall.",er:"You were the man of Song. Understandable. But waking is good: the rabbit was chance; plowing is necessity. Did you go back to the field?"},
  {a:"没守过——我运气从来没这么好",r:"你连偶然都没等到。可以——但别因为没等到兔子，连田都不种了。田才是你的。",ea:"Never waited. My luck was never that good.",er:"You have not even met the chance. Fine. But do not let the missing rabbit stop you from planting. The field is yours."},
  {a:"守，但一边守一边种",r:"你精明：等兔子不误耕地。对，这是宋人的升级版——兔子来了是惊喜，不来，田也长着。",ea:"Wait, but plant as I wait.",er:"You are shrewd: waiting does not neglect the field. Right: the upgrade of the man of Song. If the rabbit comes, a bonus; if not, the field grows."},
  {a:"把那次好运复盘成方法",r:"你善于总结。可以——但要注意：撞树的兔子是「流程」吗？把偶然研究成必然，小心变成新的株。",ea:"Review that luck into a method.",er:"You are good at summarizing. Fine. But beware: is the tree-striking rabbit a process? Studying chance into necessity may breed a new stump."},
  {a:"看别人捡到兔子，我也去守",r:"你随大流。可以——但宋人的笑话就是：人人都去守株，田就荒了。你确定那棵树桩上，还有第二只兔子？",ea:"See others pick up rabbits. I wait too.",er:"You follow the crowd. Fine. But the joke of Song: if everyone waits by stumps, the fields go fallow. Are you sure that stump holds a second rabbit?"},
  {a:"守株不可笑，可怜的是不种田",r:"你看得深：等兔子只是懒，不种田才是病。宋人可笑在放下耒耜——你只要还握着工具，偶尔等等也没啥。",ea:"Waiting is not the joke. Quitting the field is.",er:"You see deep: waiting is only laziness; not planting is the disease. The man of Song is laughable for laying down the plow. Keep your tools, and waiting once in a while is fine."}
 ]},
{s:"《淮南子 · 人间训》",t:"塞翁失马",img:"",
 o:"近塞上之人，有善术者，马无故亡而入胡。人皆吊之，其父曰：「此何遽不为福乎？」居数月，其马将胡骏马而归。人皆贺之，其父曰：「此何遽不能为祸乎？」家富良马，其子好骑，堕而折其髀。人皆吊之，其父曰：「此何遽不为福乎？」居一年，胡人大入塞，丁壮者引弦而战。近塞之人，死者十九。此独以跛之故，父子相保。",
 w:"边塞有个善占卜的老头，马丢了，邻居来安慰，他说：这怎么就不是福呢？几个月后，马带着胡人的骏马回来了。邻居来祝贺，他说：这怎么就不是祸呢？儿子爱骑马，摔断了腿。邻居来安慰，他说：这怎么就不是福呢？一年后胡人大举入侵，壮丁都去打仗，死伤惨重——只有他儿子因为瘸腿，父子俩保全了性命。",
 u:"福祸相倚，不是让你躺平认命——是让你在坏事里找生机，在好事里留戒心。",
 q:"你遇到「坏事」时，第一反应是「完了」，还是「这可能藏着什么」？",
 en_s:"Huainanzi · Renjian Xun",en_t:"The Old Man at the Frontier Loses His Horse",en_o:"Near the frontier lived a man skilled in divination. His horse ran away into the Hu without cause. All condoled with him. His father said: How do we know this is not good fortune? After a few months the horse returned with a fine Hu steed. All congratulated him. His father said: How do we know this is not disaster? The family now rich in fine horses, the son loved riding, fell, and broke his thigh. All condoled. His father said: How do we know this is not good fortune? A year later the Hu invaded in force; all the able-bodied drew their bows and fought, and of those near the frontier, nine in ten died. Only this family, because of the son's lameness, father and son were preserved.",en_w:"An old man by the frontier lost his horse; he said, how do we know this is not fortune? The horse returned with a fine steed; he said, how do we know this is not disaster? His son broke his leg riding; he said, how do we know this is not fortune? A year later the Hu invaded; the strong all died in battle. Only the lame son, father and son survived.",en_u:"Fortune and disaster lean on each other. That is not an invitation to lie flat; it is to find life in the bad and keep guard in the good.",en_q:"When bad news comes, is your first thought over or what may be hidden in it?",opts:[
  {a:"先问——这可能是福吗",r:"你是塞翁：丢马不悲，得马不喜。这份「再看看」的定力，让你在福祸之间不慌——人生的大风浪，都赢在稳。",ea:"Ask first: could this be fortune?",er:"You are the old man: not sad at the lost horse, not glad at the gained one. That let-us-see composure keeps you calm between fortune and disaster. The great waves of life are won by steadiness."},
  {a:"先慌——完了完了",r:"你是大多数人。可以理解——但塞翁的故事提醒：慌完，记得问一句「这怎么就不是福」。问多了，你也会变稳。",ea:"Panic first. It is over.",er:"You are most people. Understandable. But the tale reminds: after the panic, ask how do we know this is not fortune. Ask it often enough, and you become steady."},
  {a:"坏事变好事，好事变坏事，我都见过",r:"你是亲历者：吃过亏、占过便宜。对，福祸相倚不是道理，是你自己趟过的河。",ea:"Bad to good, good to bad. I have seen both.",er:"You are a witness: losses and gains both. Right: fortune leaning on disaster is not a saying; it is a river you have crossed."},
  {a:"只信好事，坏事不听劝",r:"你乐观过头。可以——但塞翁的「祸」往往藏在「福」后面，你至少给自己留一句「等等看」。",ea:"Believe only the good. Reject the warnings.",er:"You are over-optimistic. Fine. But the old man's disaster often hides behind the fortune. Leave yourself one phrase: wait and see."},
  {a:"坏事来了就硬扛，不找意义",r:"你是硬汉：不解读，只扛。可以——但塞翁的智慧不是找安慰，是看清「塞上」的规律，让自己少挨几下。",ea:"When bad comes, bear it hard. No meaning-making.",er:"You are the tough one: no interpretation, just bearing. Fine. But the old man's wisdom is not comfort; it is seeing the pattern of the frontier, so you take fewer blows."},
  {a:"觉得塞翁是事后诸葛亮",r:"他确实会说话。但他是「事前」就说了「此何遽不为福乎」——你不是不会说，是着急下结论。慢一点，福祸都会现形。",ea:"The old man is wise after the fact.",er:"He does talk well. But he said how do we know this is not fortune before the fact. You can speak too; you are just in a hurry to conclude. Slow down, and fortune and disaster both show their shapes."}
 ]},
{s:"《战国策 · 秦策一》",t:"苏秦刺股",img:"",
 o:"苏秦说秦王书十上而说不行，黑貂之裘敝，黄金百斤尽，资用乏绝，去秦而归。羸縢履跷，负书担囊，形容枯槁，面目黎黑，状有归色。归至家，妻不下纴，嫂不为炊，父母不与言。苏秦喟叹曰：「妻不以我为夫，嫂不以我为叔，父母不以我为子，是皆秦之罪也！」乃夜发书，陈箧数十，得《太公阴符》之谋，伏而诵之，简练以为揣摩。读书欲睡，引锥自刺其股，血流至足。",
 w:"苏秦游说秦王十次都没成功，黑貂裘磨破了，百斤黄金花光了，落魄回家。妻子不下织机，嫂子不给他做饭，父母不跟他说话。苏秦感叹一番，连夜翻出几十箱书，挑出《太公阴符》研读。读书想睡时，就用锥子扎自己的大腿，血流到脚。一年后，他说服六国合纵，佩六国相印。",
 u:"锥子刺的不是腿，是那份「被全世界看轻」的疼——要么用这口气杀了自己，要么用它凿出一条路。",
 q:"当你被家人、圈子「看轻」时，你是吞下这口气认命，还是把它变成刺股的那根锥子？",
 en_s:"Zhanguoce · Qince 1",en_t:"Su Qin Pierces His Thigh",en_o:"Su Qin presented ten memorials to the King of Qin, and none was heeded. His black sable robe was worn through, his hundred jin of gold spent, his means exhausted; he left Qin and returned. Thin-shanked, dragging shoes, bearing books and packs, his form withered, his face dark, he went home with a look of defeat. At home his wife did not leave her loom, his sister-in-law did not cook for him, his parents would not speak to him. Su Qin sighed: My wife treats me not as a husband, my sister-in-law not as a brother-in-law, my parents not as a son. It is all the fault of Qin! That night he opened his books, spread out dozens of cases, and found the schemes of the Tai Gong Yin Fu. He bent to recite, distilling it for reflection. When he grew drowsy, he took an awl and pierced his own thigh; the blood ran to his feet.",en_w:"Su Qin failed ten times before the King of Qin and went home in rags. His wife ignored him, his sister-in-law cooked for him nothing, his parents did not speak. That night he opened his books, found the Tai Gong Yin Fu, and studied with an awl against his thigh, blood running to his feet. A year later he persuaded six states to unite and wore the seals of six chancellors.",en_u:"The awl did not pierce his leg; it pierced the pain of being despised by the whole world. Either let that breath kill you, or use it to cut a road.",en_q:"When family and circle look down on you, do you swallow the breath and resign, or turn it into the awl against your thigh?",opts:[
  {a:"变成锥子——苦读苦练，证明自己",r:"你是苏秦：夜发书、引锥刺股。被看轻的疼最是清醒剂——你用它凿出了一条路，家人后来都来迎接你。",ea:"Turn it into an awl. Study and prove myself.",er:"You are Su Qin: books by night, awl by thigh. The sting of being despised is the clearest wake-up. You used it to cut a road, and the family came out to greet you."},
  {a:"吞下去，默默远离",r:"你选择离开那个圈子。可以理解——但苏秦证明了「离开」之前，先「证明」——你至少要让曾经看轻你的人，有一天说不出话。",ea:"Swallow it. Drift quietly away.",er:"You choose to leave that circle. Understandable. But Su Qin proved that before leaving, first prove. Let those who once looked down have nothing to say one day."},
  {a:"争口气，但不想自虐",r:"你不认同刺股。对，锥子是苏秦的极端——你可以用闹钟、用责任、用欲望，只要能点燃那份「不甘」，方法不限。",ea:"Fight for the breath, but no self-torture.",er:"You reject the awl. Right: the awl was Su Qin's extreme. You may use an alarm, a duty, a desire. Any fuel that lights the not-resigned will do."},
  {a:"被看轻惯了，懒得争了",r:"你累了。可以——但苏秦落魄时也被看轻，他差点也认了。你歇够了，那箱书还在，随时可以再翻开。",ea:"Used to being looked down. Too tired to fight.",er:"You are weary. Fine. But Su Qin was also despised in his fall, and nearly resigned too. When you have rested, the books are still in the case."},
  {a:"证明给在乎的人看，不在乎的就算了",r:"你目标精准：只为值得的人证明。苏秦是为六国，你是为家人——少些观众，反而更扛得住。",ea:"Prove to those who matter. The rest, skip.",er:"You aim precisely: prove only to the worthy. Su Qin proved for six states; you for family. Fewer spectators, more endurance."},
  {a:"现在就开始，从今晚那页书开始",r:"你不空谈，直接动手。对，苏秦也是从「夜发书」那一晚开始的——你今天翻开的那页，就是你的《太公阴符》。",ea:"Begin now, from tonight's page.",er:"You do not talk; you act. Right: Su Qin began on the night of opening the books. The page you open today is your Tai Gong Yin Fu."}
 ]},
{s:"《列子 · 汤问》",t:"愚公移山",img:"",
 o:"太行、王屋二山，方七百里，高万仞。本在冀州之南，河阳之北。北山愚公者，年且九十，面山而居。惩山北之塞，出入之迂也，聚室而谋曰：「吾与汝毕力平险，指通豫南，达于汉阴，可乎？」杂然相许。其妻献疑曰：「以君之力，曾不能损魁父之丘，如太行、王屋何？且焉置土石？」……愚公曰：「汝心之固，固不可彻，曾不若孀妻弱子。虽我之死，有子存焉；子又生孙，孙又生子；子又有子，子又有孙；子子孙孙无穷匮也，而山不加增，何苦而不平？」河曲智叟笑而止之曰：「甚矣，汝之不惠！以残年余力，曾不能毁山之一毛，其如土石何？」",
 w:"太行、王屋两座大山挡在门口，出行绕路。快九十岁的愚公召集全家：我们合力把山移平！妻子质疑：你连座小土丘都搬不动，怎么移这两座大山？愚公说：我死了有儿子，儿子有孙子，子子孙孙无穷无尽，而山不会变高，还怕移不平吗？河曲智叟嘲笑他太傻，愚公说：你连寡妇孤儿都不如。天帝被感动，派夸娥氏的两个儿子把山背走了。",
 u:"智叟笑愚公傻，可最后是愚公赢了——因为智叟只会「算」，愚公会「做」。世上哪座山，不是一代一代背走的？",
 q:"面对一座「看起来不可能」的山（大目标、老习惯、坏局面），你是智叟还是愚公？",
 en_s:"Liezi · Tang Wen",en_t:"The Fool Moves the Mountains",en_o:"The Taihang and Wangwu mountains, seven hundred li square, ten-thousand-ren high, lay south of Jizhou and north of Heyang. The Fool of the North Mountain, nearly ninety, lived facing them. Suffering the blockage to the north and the detour of his comings and goings, he gathered his family and said: Let us with all our strength level the danger and open a way to southern Yu and Han-yin. Is it possible? All agreed. His wife doubted: With your strength you could not harm even a small mound. What of Taihang and Wangwu? And where to put the earth and stones? The Fool said: Your heart is so set it cannot be opened; you are no match for the widow and the orphan. Though I die, there are sons; sons beget grandsons, grandsons beget sons; sons have sons, sons have grandsons; descendants without end, while the mountain does not grow. Why should we not level it? The Wise Man of the River Bend laughed and stopped him: How unwise you are! With your remnant years and strength, you cannot destroy one hair of the mountain. What of the earth and stones?",en_w:"Two great mountains blocked the Fool's door. At ninety, he gathered his family to move them. His wife doubted; the Wise Man laughed. The Fool said: I die, but sons, grandsons, endless generations, and the mountain does not grow. Heaven was moved and sent two giants to carry the mountains away.",en_u:"The Wise Man laughed at the Fool, but the Fool won. Because the Wise Man only calculates; the Fool acts. Which mountain was ever moved except by generation after generation?",en_q:"Facing a mountain that looks impossible, a great goal, an old habit, a bad situation, are you the Wise Man or the Fool?",opts:[
  {a:"愚公——子子孙孙，无穷匮也",r:"你是愚公：九十岁还想移山。你信时间站在你这边——因为你准备的不只是自己，是无穷匮的接力。",ea:"The Fool. Descendants without end.",er:"You are the Fool: at ninety, still moving mountains. You trust time is on your side, because you prepare not only yourself but an endless relay."},
  {a:"智叟——先算算值不值",r:"你理性。可以，智叟说的都对——但他输在「笑」，笑是放弃的开始。你可以算，别笑。",ea:"The Wise Man. First reckon the cost.",er:"You are rational. Fine: the Wise Man was right about everything. But he lost in the laugh. The laugh is where giving up begins. You may calculate; do not laugh."},
  {a:"先挖两锹试试",r:"你是行动派：不辩论，先动手。对，愚公也没等辩论完——挖两锹，山就少两锹。",ea:"Dig two spadefuls first.",er:"You are a doer: no debate, start digging. Right: the Fool did not wait for the debate to end. Two spadefuls, and the mountain is two spadefuls less."},
  {a:"等别人先挖",r:"你观望。可以，但愚公的队伍里，先动手的是九十岁的老头——你等的人，可能也是九十岁。",ea:"Wait for others to dig first.",er:"You watch. Fine. But in the Fool's team, the first to move was a ninety-year-old man. The one you wait for may be ninety too."},
  {a:"觉得山挪不走，就搬家",r:"你灵活：移山不如搬家。对，这也是解法——只是有些「山」在心里，搬家也躲不掉。",ea:"If the mountain cannot move, move house.",er:"You are flexible: moving is better than moving mountains. Right, it is a solution. But some mountains live in the heart; moving house does not dodge them."},
  {a:"把山当健身器材，慢慢啃",r:"你乐观：把苦难当修行。愚公挖山挖出了感动天帝的诚意——你挖着挖着，可能就挖出了自己的路。",ea:"Treat the mountain as a gym. Gnaw slowly.",er:"You are optimistic: suffering as practice. The Fool's digging moved Heaven. Dig on, and you may dig out your own road."}
 ]},
{s:"《庄子 · 养生主》",t:"庖丁解牛",img:"",
 o:"庖丁为文惠君解牛，手之所触，肩之所倚，足之所履，膝之所踦，砉然向然，奏刀騞然，莫不中音。合于《桑林》之舞，乃中《经首》之会。文惠君曰：「嘻，善哉！技盖至此乎？」庖丁释刀对曰：「臣之所好者道也，进乎技矣。始臣之解牛之时，所见无非牛者。三年之后，未尝见全牛也。方今之时，臣以神遇而不以目视，官知止而神欲行。……彼节者有间，而刀刃者无厚；以无厚入有间，恢恢乎其于游刃必有余地矣。」",
 w:"庖丁给文惠君宰牛，手触肩倚、刀起刀落，声音合着音乐的节拍。文惠君惊叹：技术怎么能到这种地步？庖丁放下刀说：我爱好的是道，已经超过技术了。我最初宰牛时，看见的是一整头牛；三年之后，看不见整牛了；现在，我用精神去接触而不是用眼睛看。牛的骨节有间隙，而我的刀刃薄得没有厚度——用没有厚度的刀进入有间隙的骨节，游刃有余。十九年了，刀还像新磨的一样。",
 u:"「游刃有余」不是天生的——是你先把自己磨薄，再把对手看透。十九年，一把刀，一个牛，足够练出那点「余地」。",
 q:"你的「刀」（手艺、专业）用了多少年？你是在「目视全牛」，还是已经「以神遇而不以目视」？",
 en_s:"Zhuangzi · Yangsheng Zhu",en_t:"Cook Ding Cuts the Ox",en_o:"Cook Ding was cutting an ox for Lord Wenhui. His hand touched, shoulder leaned, foot trod, knee pressed; the flesh fell with a hiss, the knife moved with a slide, all in accord with the music, matching the Dance of the Mulberry Grove, the rhythm of the Jingshou. Lord Wenhui said: Ah, excellent! How can skill reach this? Cook Ding set down his knife and answered: What I love is the Way, which goes beyond skill. When I first cut oxen, I saw nothing but the ox. After three years, I no longer saw the whole ox. Now I meet it with the spirit and no longer look with the eyes; the senses stop and the spirit moves. The joints have spaces, and my blade has no thickness; what enters from no-thickness into spaces moves freely, with room to spare.",en_w:"Cook Ding cut an ox with movements that matched music. Lord Wenhui marveled. Ding said: I love the Way, beyond skill. At first I saw the whole ox; after three years, no whole ox; now I meet it with spirit, not eyes. The joints have gaps, my blade has no thickness; entering from no-thickness into gaps, the blade roams with room to spare. Nineteen years, and the knife is still new.",en_u:"Roaming with room to spare is not born of talent. You first grind yourself thin, then see the opponent through. Nineteen years, one knife, one ox, enough to train that little room.",en_q:"How many years has your knife, your craft, been in use? Do you still see the whole ox, or meet it with the spirit?",opts:[
  {a:"以神遇——闭着眼都知道刀往哪走",r:"你是老庖丁：十九年磨一刀。你那份「游刃有余」不是运气，是把自己磨薄、把事看透后的必然。",ea:"Meet with the spirit. Eyes closed, I know where the blade goes.",er:"You are old Cook Ding: nineteen years, one knife. Your room to spare is not luck; it is the necessity of having ground yourself thin and seen the matter through."},
  {a:"还在目视全牛——刚入门",r:"你在练刀期。别急——庖丁也是从「所见无非牛」开始的。三年后，你也会看不见整头牛。",ea:"Still see the whole ox. Just begun.",er:"You are in the sharpening years. Do not rush. Ding also began with nothing but the ox. In three years, you too will stop seeing the whole ox."},
  {a:"换过好几把刀——遇到硬骨头就换",r:"你总在「解不动」时换行。可以，但庖丁的经验是：刀会卷刃，是心没静下来——你的问题可能不在刀。",ea:"Changed knives several times. Change whenever the bone is hard.",er:"You switch trades when the cutting stalls. Fine. But Ding's lesson: a rolled edge means the heart was not still. The problem may not be the knife."},
  {a:"我磨的不是刀，是别的",r:"你把功夫花在别处：代码、手艺、谈判、带孩子——都行。只要是「以无厚入有间」的活，都算庖丁。",ea:"I grind not a knife but other things.",er:"You spend the craft elsewhere: code, handiwork, negotiation, raising children. Any work that enters no-thickness into spaces is Cook Ding."},
  {a:"怕磨刀太慢，想走捷径",r:"你想速成。可以，但庖丁的「快」是十九年攒的——捷径解出的牛，多半骨头带肉，硌牙。",ea:"Grinding is too slow. Want a shortcut.",er:"You want speed. Fine. But Ding's speed was saved over nineteen years. An ox cut by a shortcut comes out with bone and gristle."},
  {a:"我的刀还新，慢慢磨",r:"你在路上，刀还是新的。好——记住：别急着显摆，也别急着砍硬骨头。磨到「以神遇」，自然游刃有余。",ea:"My knife is new. Grinding slowly.",er:"You are on the road; the knife is new. Good. Remember: do not show it off, do not rush at hard bones. Grind until the spirit meets, and the roaming will have room."}
 ]},
{s:"《韩非子 · 五蠹》",t:"守株待兔",img:"",
 o:"宋人有耕者。田中有株，兔走触株，折颈而死。因释其耒而守株，冀复得兔。兔不可复得，而身为宋国笑。",
 w:"宋国有个耕田的人。田里有一棵树桩，一只兔子跑来撞到树桩上，折断脖子死了。于是他放下农具守在树桩旁，盼着再捡到兔子。兔子当然再也捡不到了，他自己却成了宋国的笑话。",
 u:"守株待兔的笑话，不在「等」，在「把偶然当必然」——好运撞上来一次，不代表它会再来。",
 q:"你有没有「守过株」——把一次偶然的成功当成可以复制的套路，然后就再也不肯挪窝了？",
 en_s:"Hanfeizi · Wudu",en_t:"Waiting by the Stump",en_o:"There was a farmer of Song. In his field stood a stump; a rabbit running struck it, broke its neck, and died. Thereupon he set down his plow and waited by the stump, hoping for another rabbit. No rabbit ever came again, and he became the laughingstock of Song.",en_w:"A farmer of Song saw a rabbit kill itself on a stump in his field. He set down his plow and waited by the stump for another. No rabbit came; he became the joke of Song.",en_u:"The joke is not in the waiting, but in taking the accidental for the inevitable. Luck strikes once; that does not mean it will come again.",en_q:"Have you ever waited by a stump, treating one lucky success as a repeatable formula, and then refused to move?",opts:[
  {a:"守过——后来撞了南墙才醒",r:"你当过宋人。可以理解——但清醒就好：兔子是偶然，耕田才是必然。你回去耕地了吗？",ea:"Have waited. Woke after hitting the wall.",er:"You were the man of Song. Understandable. But waking is good: the rabbit was chance; plowing is necessity. Did you go back to the field?"},
  {a:"没守过——我运气从来没这么好",r:"你连偶然都没等到。可以——但别因为没等到兔子，连田都不种了。田才是你的。",ea:"Never waited. My luck was never that good.",er:"You have not even met the chance. Fine. But do not let the missing rabbit stop you from planting. The field is yours."},
  {a:"守，但一边守一边种",r:"你精明：等兔子不误耕地。对，这是宋人的升级版——兔子来了是惊喜，不来，田也长着。",ea:"Wait, but plant as I wait.",er:"You are shrewd: waiting does not neglect the field. Right: the upgrade of the man of Song. If the rabbit comes, a bonus; if not, the field grows."},
  {a:"把那次好运复盘成方法",r:"你善于总结。可以——但要注意：撞树的兔子是「流程」吗？把偶然研究成必然，小心变成新的株。",ea:"Review that luck into a method.",er:"You are good at summarizing. Fine. But beware: is the tree-striking rabbit a process? Studying chance into necessity may breed a new stump."},
  {a:"看别人捡到兔子，我也去守",r:"你随大流。可以——但宋人的笑话就是：人人都去守株，田就荒了。你确定那棵树桩上，还有第二只兔子？",ea:"See others pick up rabbits. I wait too.",er:"You follow the crowd. Fine. But the joke of Song: if everyone waits by stumps, the fields go fallow. Are you sure that stump holds a second rabbit?"},
  {a:"守株不可笑，可怜的是不种田",r:"你看得深：等兔子只是懒，不种田才是病。宋人可笑在放下耒耜——你只要还握着工具，偶尔等等也没啥。",ea:"Waiting is not the joke. Quitting the field is.",er:"You see deep: waiting is only laziness; not planting is the disease. The man of Song is laughable for laying down the plow. Keep your tools, and waiting once in a while is fine."}
 ]},
{s:"《淮南子 · 人间训》",t:"塞翁失马",img:"",
 o:"近塞上之人，有善术者，马无故亡而入胡。人皆吊之，其父曰：「此何遽不为福乎？」居数月，其马将胡骏马而归。人皆贺之，其父曰：「此何遽不能为祸乎？」家富良马，其子好骑，堕而折其髀。人皆吊之，其父曰：「此何遽不为福乎？」居一年，胡人大入塞，丁壮者引弦而战。近塞之人，死者十九。此独以跛之故，父子相保。",
 w:"边塞有个善占卜的老头，马丢了，邻居来安慰，他说：这怎么就不是福呢？几个月后，马带着胡人的骏马回来了。邻居来祝贺，他说：这怎么就不是祸呢？儿子爱骑马，摔断了腿。邻居来安慰，他说：这怎么就不是福呢？一年后胡人大举入侵，壮丁都去打仗，死伤惨重——只有他儿子因为瘸腿，父子俩保全了性命。",
 u:"福祸相倚，不是让你躺平认命——是让你在坏事里找生机，在好事里留戒心。",
 q:"你遇到「坏事」时，第一反应是「完了」，还是「这可能藏着什么」？",
 en_s:"Huainanzi · Renjian Xun",en_t:"The Old Man at the Frontier Loses His Horse",en_o:"Near the frontier lived a man skilled in divination. His horse ran away into the Hu without cause. All condoled with him. His father said: How do we know this is not good fortune? After a few months the horse returned with a fine Hu steed. All congratulated him. His father said: How do we know this is not disaster? The family now rich in fine horses, the son loved riding, fell, and broke his thigh. All condoled. His father said: How do we know this is not good fortune? A year later the Hu invaded in force; all the able-bodied drew their bows and fought, and of those near the frontier, nine in ten died. Only this family, because of the son's lameness, father and son were preserved.",en_w:"An old man by the frontier lost his horse; he said, how do we know this is not fortune? The horse returned with a fine steed; he said, how do we know this is not disaster? His son broke his leg riding; he said, how do we know this is not fortune? A year later the Hu invaded; the strong all died in battle. Only the lame son, father and son survived.",en_u:"Fortune and disaster lean on each other. That is not an invitation to lie flat; it is to find life in the bad and keep guard in the good.",en_q:"When bad news comes, is your first thought over or what may be hidden in it?",opts:[
  {a:"先问——这可能是福吗",r:"你是塞翁：丢马不悲，得马不喜。这份「再看看」的定力，让你在福祸之间不慌——人生的大风浪，都赢在稳。",ea:"Ask first: could this be fortune?",er:"You are the old man: not sad at the lost horse, not glad at the gained one. That let-us-see composure keeps you calm between fortune and disaster. The great waves of life are won by steadiness."},
  {a:"先慌——完了完了",r:"你是大多数人。可以理解——但塞翁的故事提醒：慌完，记得问一句「这怎么就不是福」。问多了，你也会变稳。",ea:"Panic first. It is over.",er:"You are most people. Understandable. But the tale reminds: after the panic, ask how do we know this is not fortune. Ask it often enough, and you become steady."},
  {a:"坏事变好事，好事变坏事，我都见过",r:"你是亲历者：吃过亏、占过便宜。对，福祸相倚不是道理，是你自己趟过的河。",ea:"Bad to good, good to bad. I have seen both.",er:"You are a witness: losses and gains both. Right: fortune leaning on disaster is not a saying; it is a river you have crossed."},
  {a:"只信好事，坏事不听劝",r:"你乐观过头。可以——但塞翁的「祸」往往藏在「福」后面，你至少给自己留一句「等等看」。",ea:"Believe only the good. Reject the warnings.",er:"You are over-optimistic. Fine. But the old man's disaster often hides behind the fortune. Leave yourself one phrase: wait and see."},
  {a:"坏事来了就硬扛，不找意义",r:"你是硬汉：不解读，只扛。可以——但塞翁的智慧不是找安慰，是看清「塞上」的规律，让自己少挨几下。",ea:"When bad comes, bear it hard. No meaning-making.",er:"You are the tough one: no interpretation, just bearing. Fine. But the old man's wisdom is not comfort; it is seeing the pattern of the frontier, so you take fewer blows."},
  {a:"觉得塞翁是事后诸葛亮",r:"他确实会说话。但他是「事前」就说了「此何遽不为福乎」——你不是不会说，是着急下结论。慢一点，福祸都会现形。",ea:"The old man is wise after the fact.",er:"He does talk well. But he said how do we know this is not fortune before the fact. You can speak too; you are just in a hurry to conclude. Slow down, and fortune and disaster both show their shapes."}
 ]}
];
