 w:"淝水之战，谢安正在和别人下棋。前线谢玄的捷报送到，他看完信，默默无言，慢慢把信收好，继续下棋。客人问他战况如何，他说：小孩子们已经把贼兵大破了。神色举止，和平常没有两样。",
 u:"捷报到手，还能稳稳落子——真正的镇定，不是没有波澜，是波澜在心里，手不动。",
 q:"当一件天大的事（好坏皆可）正砸向你，你还能照常把手头的事做完吗？",
 en_s:"Shishuo Xinyu · Ya Liang",en_t:"Xie An Plays Go",en_o:"Duke Xie was playing go with someone when news arrived from Xie Xuan on the Huai River. He read the letter to the end, remained silent, and slowly returned to the board. Asked how the campaign fared, he answered: The children have utterly broken the bandits. His expression and manner were no different from usual.",en_w:"During the Battle of the Fei River, Xie An was playing go. The victory dispatch from Xie Xuan arrived; he read it, said nothing, put it away, and went on playing. Asked the news, he said: the children have broken the bandits. His manner never changed.",en_u:"With the dispatch in hand, still placing the stone steadily. True calm is not the absence of waves, but waves inside while the hand does not move.",en_q:"When something enormous, good or bad, is crashing toward you, can you still finish what is in your hands?",opts:[
  {a:"能——先把棋下完",r:"你是谢安。天大的事，手上这颗子先落了。这份定力不是冷漠，是把情绪放进该放的地方。",ea:"Yes. Finish the game first.",er:"You are Xie An. With the world-shaking matter, this stone still falls. That composure is not coldness; it is putting emotion where it belongs."},
  {a:"会忍不住先看结果",r:"你诚实。大多数人都会先拆信。谢安的境界不是人人能有——但至少学他：看完信，再坐下把棋下完。",ea:"I would open the letter first.",er:"You are honest. Most would. Xie An's height is not for everyone. But learn this much: after reading, sit down and finish the game."},
  {a:"早坐不住了",r:"你是真性情。情绪外露不丢人，只是大事当前，别人看的是你的动作——先稳住手，心自然会跟着稳。",ea:"Cannot sit still.",er:"You are genuine. Showing emotion is no shame. But in great matters, eyes watch your hands. Steady the hand, and the heart follows."},
  {a:"会找人分享/倾诉",r:"你靠分享来消化。也可以。谢安是憋在心里下棋，你是说出来再下棋——只要别在棋盘上把情绪落成昏招。",ea:"Share it with someone. Talk it out.",er:"You digest by speaking. Fine. Xie An swallowed and played; you speak and then play. Just do not drop your emotion as a blunder on the board."},
  {a:"表面镇定，心里盘算退路",r:"你演得好，也想得多。谢安是真的稳，你是装的稳——装久了，也就成真的了。",ea:"Calm outside, planning exits inside.",er:"You act well and think much. Xie An was truly steady; you are steady in costume. Wear it long enough, and it becomes real."},
  {a:"觉得谢安有点装",r:"你觉得人性不该这么平静。但淝水之战是真的赢了——赢的时候还能下棋，不是装，是把「赢」看淡了。",ea:"Think Xie An was a little fake.",er:"You do not believe humanity is that calm. But the Fei River was truly won. To keep playing go when winning is not faking. It is having seen through the word win."}
 ]},
{s:"《太平广记 · 聂隐娘传》",t:"聂隐娘",img:"tale_42.jpg",
 o:"聂隐娘者，贞元中魏博大将聂锋之女也。年方十岁，有尼乞食于锋舍，见隐娘，悦之，云：「问押衙乞取此女教。」……尼乃以药化隐娘为二，令自击搏，如飞鸟。……隐娘自此刺杀人，如飞腾。……后遇磨镜少年及门，曰：「此人可与我为夫。」白父，父不敢不从，遂嫁之。……隐娘曰：「吾为汝杀此二人，取其首来。」……自此夫妻隐于山林，不知所终。",
 w:"聂隐娘是魏博大将聂锋之女，十岁时被一个尼姑带走，练成绝世剑术，从此专门刺杀仇家，来去如飞。长大后她看中一个磨镜少年，自己做主嫁给了他。后来她被派去刺杀刘昌裔，却折服于他的气度，转而投靠、救他，最后和丈夫隐居山林，不知所终。",
 u:"一身本事，多半是别人给的——难的是本事到手之后，还能自己做主，选一个「想护的人」。",
 q:"你的一身本事（技能、位置、资源），是替别人挣的还是自己挣的？你有没有用它护过想护的人？",
 en_s:"Taiping Guangji · Nie Yinniang",en_t:"Nie Yinniang",en_o:"Nie Yinniang was the daughter of Nie Feng, a general of Weibo, in the Zhenyuan era. At ten, a nun begging at the house saw her and took pleasure in her, saying: I ask for this girl to teach. The nun transformed Yinniang, made her strike and grapple like a flying bird. From then on Yinniang killed men as if flying. Later a mirror-polishing youth came to the gate, and she said: This man can be my husband. She told her father, who dared not refuse, and she married him. Yinniang said: I will kill those two for you and bring their heads. In the end the couple hid in the mountains, and none knew their end.",en_w:"Nie Yinniang, daughter of a general, was taken at ten by a nun and trained to a peerless sword art, killing for hire like a bird in flight. Grown, she chose a mirror-polishing youth as her husband by her own will. Sent to assassinate Liu Changyi, she was won over by his bearing, sided with him, saved him, and finally retired with her husband into the mountains.",en_u:"A body of skill is mostly given by others. The hard part is, once the skill is yours, still being able to choose whom to protect.",en_q:"Is your skill, your position, your resource, earned for others or for yourself? Have you used it to protect someone you wanted to protect?",opts:[
  {a:"自己挣的，也护着想护的人",r:"你是磨镜少年那版的隐娘：本事是自己的，选择也是自己的。这样的人生，到哪都能隐居得心安。",ea:"Earned it myself, and protect whom I choose.",er:"You are the mirror-polisher's Yinniang: the skill is yours, and the choice is yours. A life like that can retire in peace anywhere."},
  {a:"替别人挣的，身不由己",r:"你在替人打工卖命。隐娘也当过十年的刀——但她最后反了。你的刀，递到谁手里，你说了算吗？",ea:"Earned for others. Not my own choice.",er:"You work and bleed for another's cause. Yinniang was a blade for ten years too. But she turned at the end. Whose hand is your blade in?"},
  {a:"本事有，但没用它护过谁",r:"你怀剑不用。可以，但剑是用来护人的——哪怕护一次，你才知道自己练它值不值。",ea:"Have the skill, never protected anyone.",er:"You carry a sword unused. Fine, but a sword exists to guard. Guard someone once, and you will know whether the practice was worth it."},
  {a:"本事不够，先练再说",r:"你在磨剑期。隐娘练了十年。剑没磨好之前，护人的话先别轻易说——但练的方向要对。",ea:"Skill not enough. Train first.",er:"You are in the sharpening years. Yinniang trained ten years. Do not promise to guard anyone before the blade is ready. But train in the right direction."},
  {a:"能护自己就不错了",r:"你目标务实。对，护己是护人的前提——隐娘也是先学会了自保，才有资格选丈夫。",ea:"Protecting myself is enough.",er:"Practical. Right. Guarding yourself is the premise of guarding others. Yinniang also learned self-preservation before she could choose a husband."},
  {a:"怕本事大了招祸",r:"你藏锋。隐娘的师父用她杀人，她也差点成了祸。本事本身不招祸，替谁用、怎么用才招祸。",ea:"Afraid great skill brings disaster.",er:"You hide your edge. Yinniang's master used her to kill, and she nearly became a disaster herself. Skill does not bring disaster. Whose hand it is in, and how it is used, does."}
 ]},
{s:"《太平广记 · 虬髯客传》",t:"虬髯客",img:"tale_43.jpg",
 o:"虬髯客曰：「吾本欲以此世界求事，当龙战三二十年，建少功业。今既有主，住亦何为？太原李氏，真英主也。三五年内，即当太平，李郎以奇特之才，辅清平之主，竭心尽善，必极人臣。一妹以天人之姿，蕴不世之艺，从夫之贵，以盛轩裳。非一妹不能识李郎，非李郎不能荣一妹。」……遂与其妻从一奴，乘马而去，数步，遂不复见。",
 w:"虬髯客本有争夺天下之心，见到李靖和李世民后，认定李世民是真命之主。他把自己积蓄的资产全部赠给李靖夫妇，说：天下已有主，我留下也没意思。随即带着妻子骑马而去，几步之后，就再也看不见了。后来传说他在海外称王。",
 u:"识英雄、让天下——最高级的成全，是看清自己不是主角，然后体面离场，把舞台让给对的人。",
 q:"当你发现「主角」不是你，舞台终将属于别人——你会不甘、扶持，还是体面退场？",
 en_s:"Taiping Guangji · Qiuran Ke Zhuan",en_t:"The Curly-Bearded Stranger",en_o:"The curly-bearded stranger said: I meant to make my way in this world, to fight the dragon for twenty or thirty years and build some small achievement. Now that there is a master, what is there to stay for? Li of Taiyuan is the true lord. Within three to five years there will be peace. You, Li Lang, with your extraordinary talent, serve a clear ruler with all your heart; you will reach the height of a minister. And you, sister, with your heavenly bearing and matchless arts, rise with your husband's honor. No one but sister could recognize Li Lang; no one but Li Lang could honor sister. Then with his wife and one servant he mounted and rode away, and after a few steps was seen no more.",en_w:"The curly-bearded stranger had ambition to contend for the realm, but meeting Li Jing and Li Shimin, he judged Li Shimin the true lord. He gave his entire fortune to the couple, saying: the realm has a master; staying is meaningless. He rode off with his wife and vanished. Legend says he became a king overseas.",en_u:"Recognizing the hero, yielding the realm. The highest fulfillment is seeing clearly that you are not the lead, then exiting with grace and leaving the stage to the right one.",en_q:"When you discover the lead is not you and the stage will belong to another, do you resent, support, or exit with grace?",opts:[
  {a:"看清了，就体面退场",r:"你是虬髯客：不是我的局，资产赠了，马也骑了，几步之间消失。这份自量，比争强更有英雄气。",ea:"See clearly, and exit with grace.",er:"You are the stranger: not my game; give away the fortune, mount the horse, vanish in a few steps. That self-measure is more heroic than contending."},
  {a:"不甘心，想搏一搏",r:"你想龙战三二十年。可以，但虬髯客是看完了李世民的棋局才退的——你至少先看清对手是谁。",ea:"Unwilling. Want to try.",er:"You want to fight the dragon for thirty years. Fine. But the stranger read Li Shimin's whole board before retreating. At least see who your rival is first."},
  {a:"辅佐他，分一杯羹",r:"你是李靖：跟着英主，竭心尽善，位极人臣。对，不是谁都要当天子——当个能成事的萧何也很好。",ea:"Support him. Take a share.",er:"You are Li Jing: follow the true lord, serve with all your heart, rise to the top. Right. Not everyone must be emperor. Being a Xiao He who achieves things is fine too."},
  {a:"退场，但把家底留给后来人",r:"你不仅退，还赠了全部资产。这份大气，让李靖有了起家之本——你退得漂亮，也成就了别人的局。",ea:"Exit, but leave your foundation to those after.",er:"You not only leave, you give everything. That generosity gave Li Jing his start. You exited well and completed another's game."},
  {a:"看不清谁是主角，先观望",r:"你还在盘算。可以，但天下大势不等人——虬髯客观望完就做了决定，你观望完，别只剩观望。",ea:"Cannot tell who the lead is. Watch first.",er:"You are still calculating. Fine, but the tide waits for no one. The stranger watched and then decided. Do not end with watching only."},
  {a:"不服——凭什么他是主角",r:"你意难平。可李世民那样的真主，三五年就太平了——你的不服，要先对得起「看清」二字。",ea:"Unconvinced. Why is he the lead?",er:"Your grievance is real. But a true lord like Li Shimin brought peace in three to five years. Your unwillingness must first answer to the word see clearly."}
 ]},
{s:"《太平广记 · 红线传》",t:"红线盗盒",img:"tale_44.jpg",
 o:"红线者，潞州节度使薛嵩青衣。……嵩曰：「我承祖父遗业，受国家重恩，一旦失其疆土，即数百年勋业尽矣。」红线曰：「某贱妾，不解机谋，但闻主忧臣辱，主辱臣死。愿主不忧。」……红线曰：「某夜往魏郡，凡人之生死，亦视之轻矣。」……红线遂持金合，如飞而至。魏帅见之，惊惧，即日遣使修好。",
 w:"红线是潞州节度使薛嵩的婢女，身怀绝技。田承嗣欲吞并潞州，薛嵩忧惧。红线当夜潜入田承嗣府中，取走他枕边的金盒。田承嗣醒来发现金盒被盗，大惊失色——这表示取他首级也易如反掌，于是连忙遣使求和。一场大战，被一只金盒化解。",
 u:"真正的侠，不是杀多少人，是能杀人而不杀——一只金盒，抵过十万兵。",
 q:"当你与人剑拔弩张，你有能力「赢」甚至「伤」对方，但胜了也是两败——你会选择「不战而屈人之兵」吗？",
 en_s:"Taiping Guangji · Hongxian Zhuan",en_t:"Hongxian Steals the Box",en_o:"Hongxian was a serving maid of Xue Song, governor of Luzhou. Xue Song said: I inherit my ancestors' achievement and the state's deep grace. If I once lose this territory, centuries of merit are done. Hongxian said: I am but a lowly maid, ignorant of strategy. But I have heard: the lord's sorrow is the servant's shame; the lord's shame is the servant's death. I beg you not to grieve. That night Hongxian went to Weijun. She took the golden box and came back like flying. When the general of Weibo saw it, he was struck with terror and sent an envoy to make peace that very day.",en_w:"Hongxian, a maid with rare skill, served Xue Song, whose neighbor Tian Chengsi planned to swallow his province. That night Hongxian slipped into Tian's mansion and took the golden box from his pillow. Waking to find it gone, Tian was terrified: taking his head would be as easy. He sued for peace at once. A great war was dissolved by one box.",en_u:"The true knight does not kill many; he can kill and chooses not to. One golden box outweighs a hundred thousand soldiers.",en_q:"When you are at daggers drawn and could win or even wound, yet winning would ruin both, do you choose to subdue without fighting?",opts:[
  {a:"会——先亮实力，再给台阶",r:"你是红线：取走金盒，却留他一命。让对方知道你举重若轻，比真打一仗高明得多。",ea:"Yes. Show strength, then offer a way down.",er:"You are Hongxian: take the box, spare his life. Letting him see how lightly you can do it beats a real battle."},
  {a:"直接开打，不服就干",r:"你是爽快人。可以，但田承嗣十万兵压境，薛嵩差点就亡了——有些仗，赢了也是输。",ea:"Fight directly. Whoever yields loses face.",er:"You are a straight shooter. Fine. But Tian had a hundred thousand soldiers; Xue Song nearly perished. Some battles are lost even when won."},
  {a:"想和平，但不会亮剑",r:"你只想息事宁人。可薛嵩光忧不惧不行——和平的底气，从来是「我有能力打，但我选择不打」。",ea:"Want peace, but will not show the blade.",er:"You only want to smooth things over. But Xue Song's worry alone changed nothing. The ground of peace is always: I can fight, yet I choose not to."},
  {a:"看人下菜——对方吃这套才用",r:"你务实。对，红线这一手只对惜命的田承嗣有效——碰上莽夫，还是得备着真刀。",ea:"Size up the man. Use it only on those it works on.",er:"You are practical. Right. Hongxian's trick works only on a life-loving Tian Chengsi. Against a brute, keep a real blade ready."},
  {a:"把证据/把柄攥在手里谈",r:"你是职场版红线：留后手，再上桌。这是成熟人的玩法，只是别忘了：把柄用多了，路会越走越窄。",ea:"Hold evidence and leverage when talking.",er:"You are the office version of Hongxian: keep a backup, then sit at the table. A mature game. Only remember: leverage used too often narrows the road."},
  {a:"觉得红线太冒险",r:"确实险——万一失手就是死。但她一个婢女，替主解围，靠的是把命豁出去的底气。你敢为你在乎的人冒多大险？",ea:"Think Hongxian too reckless.",er:"It was risky. One failure meant death. But a lowly maid broke her master's siege by staking her life. How far would you go for those you care about?"}
 ]},
{s:"《太平广记 · 柳毅传》",t:"柳毅传书",img:"tale_45.jpg",
 o:"仪凤中，有儒生柳毅者，应举下第，将还湘滨。念乡人有客于泾阳者，遂往告别。至六七里，鸟起马惊，疾逸道左，又六七里，乃止。见有妇人，牧羊于道畔。毅怪视之，乃殊色也。……妇泣而对曰：「贱妾不幸，今日见辱问于长者。然而恨贯肌骨，亦何能愧避，幸一闻焉。妾，洞庭龙君小女也。父母配嫁泾川次子，而夫婿乐逸，为婢仆所惑，日以厌薄。……闻君将还吴，密通洞庭，或以尺书寄托侍者，未卜将以为可乎？」毅曰：「吾义夫也。闻子之说，气血俱动，恨无毛羽，不能奋飞。是何可否之谓乎！」",
 w:"书生柳毅落第回乡，在路边遇见一个牧羊的绝色女子。她自称洞庭龙君的小女儿，嫁给泾川龙王的次子，被丈夫和奴婢们厌弃虐待，托柳毅带一封家书回洞庭。柳毅慨然答应，历尽艰险把信送到龙宫。龙女得救后，龙君要把她嫁给柳毅，柳毅却坚持「义士救人，不是图报」，婉拒而去——但最后两人还是因缘重逢，结为夫妇。",
 u:"受人之托，忠人之事——他送一封素不相识的信，走了几千里路。这世上最可贵的，是陌生人之间的一句「我帮你」。",
 q:"一个陌生人的托付（带个话、捎封信、帮个忙），你会认真到底吗？",
 en_s:"Taiping Guangji · Liu Yi Zhuan",en_t:"Liu Yi Delivers the Letter",en_o:"In the Yifeng era, a scholar Liu Yi, failing the examination, was returning to the Xiang river. Remembering a countryman lodging in Jingyang, he went to say farewell. Six or seven li out, birds rose, the horse shied, and rushed to the left of the road, stopping after another six or seven li. There he saw a woman herding sheep by the roadside. Liu Yi looked at her strangely; she was of rare beauty. Weeping, she said: I am unfortunate. I, the youngest daughter of the Dragon Lord of Dongting, was married to the second son of the Jing River. My husband is idle and fond of pleasure, swayed by maids and servants, daily more cold to me. I hear you are returning to Wu; if you could secretly reach Dongting and carry a letter by my servant, would you? Liu Yi said: I am a man of honor. Hearing your tale, my blood stirs; I only regret having no wings to fly. What talk of whether I will?",en_w:"Scholar Liu Yi, returning from a failed examination, met a beauty herding sheep by the road. She was the Dragon Lord's daughter, married ill and abused, and begged him to carry a letter to Dongting. He agreed and braved dangers to deliver it. Saved, the Dragon Lord offered her to him; Liu Yi refused, saying a righteous man saves without seeking reward. Fate brought them together in the end.",en_u:"Entrusted, be true to the trust. He carried a stranger's letter thousands of li. The most precious thing in this world is one stranger saying to another: I will help.",en_q:"When a stranger entrusts you with something, a message, a letter, a favor, do you see it through?",opts:[
  {a:"会——答应的事，风雨无阻",r:"你是柳毅：素不相识，也肯赴龙宫。陌生人敢托付你，是因为你看起来就像个靠得住的人。",ea:"Yes. What I promise, I keep, rain or shine.",er:"You are Liu Yi: a stranger, and you would still go to the Dragon Palace. Strangers dare entrust you because you look like someone dependable."},
  {a:"看风险——太远的就算了",r:"你量力而行。可以，柳毅差点死在泾河——但他的义字，正是贵在明知危险也去。",ea:"Depends on the risk. Too far, skip it.",er:"You measure your strength. Fine. Liu Yi nearly died at the Jing River. His honor is precisely in going despite the danger."},
  {a:"随便应一声，回头就忘",r:"你随口答应。柳毅的信用就是从不随便答应——你若应了，至少要记得，那是人家把心交到你手里。",ea:"Answer vaguely, forget by evening.",er:"You promise casually. Liu Yi's credit is never to promise casually. If you answer, remember: they have placed their heart in your hand."},
  {a:"帮，但会先问清楚底细",r:"你谨慎。对，柳毅要是先问清楚龙宫在哪，可能就少走很多冤枉路——问清楚，不等于不帮。",ea:"Help, but ask the details first.",er:"You are cautious. Right. Had Liu Yi asked where the Dragon Palace was, he might have saved himself many detours. Asking clearly is not refusing."},
  {a:"怕惹麻烦，委婉拒绝",r:"你自保。可以理解。只是下次你落难时，也别怪别人和你一样怕麻烦。",ea:"Afraid of trouble. Decline politely.",er:"You protect yourself. Understandable. Only, when you fall next time, do not blame others for fearing the same trouble."},
  {a:"帮了，但不图回报",r:"你是柳毅本毅：救完人不要酬谢。龙君后来要把女儿嫁给他，他拒绝了——这份不图报，比信本身更值钱。",ea:"Help, but expect no return.",er:"You are Liu Yi himself: saved her, took no reward. When the Dragon Lord offered his daughter, he refused. That no-reward stands worth more than the letter."}
 ]},
{s:"《太平广记 · 李娃传》",t:"李娃",img:"tale_46.jpg",
 o:"汧国夫人李娃，长安之倡女也。节行瑰奇，有足称者，故监察御史白行简为传述。……生曰：「某不量卑陋，敢希一盼。」……娃曰：「愿以残喘，归来西肆。」……生自此，日会倡优侪类，狎戏游宴，囊中尽空。……娃曰：「与郎相知一年，尚无孕嗣。常闻竹林神者，报应如响，将致荐酹求之，可乎？」……生大恸，却行。……娃乃鬻其衣服，市一棺椁，以瘗之。……生被布裘，持破瓯，巡于闾里，以乞食为事。……娃闻之，乃令母曰：「此非我儿乎？」……生至，娃以绣襦拥之，归西厢，烹茶进之。……娃曰：「当令子志学，以启才艺。」……生由是益自勤苦，遂登甲科。",
 w:"荥阳公子郑生赴考长安，迷上名妓李娃，耗尽钱财，被鸨母设计抛弃，沦为乞丐。李娃知道后良心难安，赎身照顾他，激励他重新读书。郑生发愤苦读，考中进士，李娃也因贤德被封为汧国夫人。",
 u:"李娃最动人的不是美貌，是浪子回头时，她愿意陪他重走一遍——救一个人，是把他打碎的自尊一片片拾起来。",
 q:"你身边有「跌下去」的人吗？你愿意像李娃一样，把ta从谷底拉回来、陪ta重走一遍吗？",
 en_s:"Taiping Guangji · Li Wa Zhuan",en_t:"Li Wa",en_o:"Li Wa, Lady of Qian, was a singsong girl of Chang'an, of rare conduct, so Bai Xingjian the censor wrote her tale. The scholar said: I presume on my lowliness to hope for one glance. Li Wa said: I wish, with my remnant life, to return to the western establishment. From then the scholar spent his days with actors and jesters, feasting and roving, till his purse was empty. Li Wa said: We have known each other a year and there is no heir. I hear the god of the bamboo grove answers like an echo. Let me offer to him. The scholar wailed and went back. Li Wa sold her clothes and bought a coffin to bury him. The scholar, in a cloth coat, holding a broken bowl, begged through the lanes. Li Wa heard of it, and said to her mother: Is this not my son? When he came, she wrapped him in her embroidered gown, brought him to the west chamber, and brewed tea for him. Li Wa said: Let him now set his mind to study and open his talents. The scholar toiled harder from then on and passed the first rank.",en_w:"Zheng Sheng of Xingyang, going to the capital for the examinations, fell for the courtesan Li Wa, spent his fortune, was abandoned by the madam's scheme, and became a beggar. Li Wa, guilt-stricken, ransomed herself, nursed him, and urged him to study again. He passed the examinations; Li Wa, for her virtue, was made Lady of Qian.",en_u:"What moves in Li Wa is not beauty, but that when the prodigal turned back, she would walk the road with him again. To save a person is to pick up the shattered pride piece by piece.",en_q:"Is there someone near you who has fallen? Would you, like Li Wa, pull them up from the bottom and walk the road again with them?",opts:[
  {a:"愿意——ta值得我给一次机会",r:"你是李娃：郑生沦落街头，她认出了他，把他拉回西厢。你的那句「我认识他」，是很多人这辈子等不到的话。",ea:"Yes. They deserve one more chance from me.",er:"You are Li Wa: Zheng Sheng begging in the streets, and she recognized him, drew him back to the west chamber. Your words I know him are what many wait a lifetime to hear."},
  {a:"拉一把，但不敢全押上",r:"你帮，但有分寸。可以。李娃是赎了身、赌上全部的——你至少先确认对方真有回头的决心。",ea:"Pull them up, but not bet everything.",er:"You help with measure. Fine. Li Wa ransomed herself, staked all. At least first make sure they truly mean to turn back."},
  {a:"怕ta再次辜负",r:"你被辜负过。可以提防，但郑生第二次辜负李娃了吗？没有——他考中了。有些人，值得再信一次。",ea:"Afraid they will fail me again.",er:"You were let down before. Guard yourself, but did Zheng Sheng fail Li Wa twice? No. He passed. Some people deserve one more trust."},
  {a:"看ta自己争不争气",r:"你讲对等。对，郑生肯读书，李娃才留得住他——救人是拉一把，不是背他一辈子。",ea:"Depends on whether they try.",er:"You ask for reciprocity. Right. Zheng Sheng studied, so Li Wa could keep him. Saving is one pull, not carrying them for life."},
  {a:"自己都泥菩萨过河",r:"你先自救。真实。李娃能救郑生，因为她先攒下了赎身的钱——你先站稳，才有手拉别人。",ea:"I cannot even save myself.",er:"Save yourself first. Real. Li Wa could save Zheng because she had first saved her ransomed coins. Stand firm, then reach out."},
  {a:"救，但别让ta赖上我",r:"你设了边界。聪明。李娃也没养郑生一辈子——她推他读书，是让他自己站起来。",ea:"Save, but do not let them cling.",er:"You set boundaries. Smart. Li Wa did not support Zheng forever. She pushed him to study so he could stand alone."}
 ]},
{s:"《太平广记 · 霍小玉传》",t:"霍小玉",img:"tale_47.jpg",
 o:"霍王小女，字小玉，王甚爱之。母曰净持。净持，即王之宠婢也。王之初薨，诸弟兄以其出自贱庶，不甚收录。因分与资财，遣居于外，易姓为郑氏，人亦不知其王女。……生一见之，不觉神魂颠倒。……玉曰：「妾年始十八，君才二十有二，迨君壮室之秋，犹有八岁。一生欢爱，愿毕此期。然后妙选高门，以谐秦晋，亦未为晚。妾便舍弃人事，剪发披缁。夙昔之愿，于此足矣。」……生自以孤负盟约，大愆声价，不之复言。……玉乃持杯酒，酬地曰：「我为女子，薄命如斯！君是丈夫，负心若此！……我死之后，必为厉鬼，使君妻妾，终日不安！」乃引左手握生臂，掷杯于地，长恸号哭数声而绝。",
 w:"霍小玉是霍王爱女，因母亲出身低微，父亲死后被赶出家门。她与书生李益相爱，自知身份悬殊，只求相爱八年，之后让李益另娶高门。李益后来果然负心娶了贵族女，小玉相思成疾。再见时，她怒斥李益负心，掷杯于地，痛哭而绝——死后化厉鬼，让李益的妻妾永不安宁。",
 u:"她要的不是一辈子，是八年——连退路都替他铺好的痴，换来的却是连八年都不肯给的人。",
 q:"一段明知「没有结果」的感情，你还会认真投入吗？你给自己设过「八年之约」吗？",
 en_s:"Taiping Guangji · Huo Xiaoyu Zhuan",en_t:"Huo Xiaoyu",en_o:"The youngest daughter of Prince Huo, named Xiaoyu, was much loved by the prince. Her mother was Jingchi, the prince's favorite maid. When the prince died, the brothers, as she came of a base line, did not accept her; they divided property, sent her out, changed her name to Zheng, and none knew she was a prince's daughter. When the scholar saw her, he was beside himself. Xiaoyu said: I am eighteen, you twenty-two. By the time you take a wife of marriageable age there are still eight years. Let our whole life's love be spent in this time. Then choose a high gate and marry well; it will not be too late. I will give up the world, cut my hair, and take the robe. My wish is fulfilled. The scholar, knowing he had broken the vow and lost his standing, said nothing more. Xiaoyu raised her cup, poured it on the ground, and said: I am a woman, my life so thin! You are a man, your heart so faithless! After my death I will become a fierce ghost and make your wives and concubines uneasy forever. She grasped his arm with her left hand, dashed the cup to the ground, wailed long, and died.",en_w:"Huo Xiaoyu, prince's daughter, was cast out after her father died. She loved the scholar Li Yi, and knowing the gap between them, asked only for eight years of love before he married a noble bride. He proved faithless, married an aristocrat, and she pined to death. At their last meeting she cursed him, dashed her cup, and died, vowing to haunt his household.",en_u:"She did not ask for a lifetime, only eight years, a passion that paved his escape route too, and got a man who would not give even eight.",en_q:"Would you still invest deeply in a relationship you know has no future? Have you ever set yourself an eight-year pact?",opts:[
  {a:"会认真——过程比结果重要",r:"你是小玉：明知八年之限，还是把心整个给了。痴是真痴，只是要记得：托付可以，别把退路也替他铺好。",ea:"Yes, deeply. The process matters more than the result.",er:"You are Xiaoyu: knowing the eight-year limit, you still gave your whole heart. The passion is real. Just remember: you may give, but do not pave his escape route too."},
  {a:"不会——没有结果就不开始",r:"你止损。理性。只是小玉的故事提醒：太早算结果的人，也错过了那些「本可以有」的八年。",ea:"No. No future, no start.",er:"You cut losses. Rational. But Xiaoyu's tale warns: those who count the result too early miss the eight years that could have been."},
  {a:"投入，但给自己留后路",r:"你一边爱一边留退路。可以，但李益就是「留后路」留成了负心汉——后路可以有，别让ta知道你一直握着。",ea:"Invest, but keep a way out.",er:"You love with an exit. Fine, but Li Yi's way out made him a faithless man. An exit may exist; just do not let them know you always hold it."},
  {a:"先谈清楚再决定",r:"你把话说在前面。对，小玉要是跟李益谈清楚「八年之约」，至少不会连被骗都不知道。",ea:"Talk it out first, then decide.",er:"You speak plainly first. Right. Had Xiaoyu told Li Yi about the eight-year pact, at least she would not have been deceived without knowing."},
  {a:"觉得小玉太傻",r:"她确实傻——傻在把底线说给了不值得的人。但她的痴，也是真的。你笑她傻，可你被辜负那天，也会想做个厉鬼。",ea:"Think Xiaoyu foolish.",er:"She was foolish, foolish in telling her bottom line to one unworthy. But her passion was real. You laugh at her, yet on the day you are betrayed, you too will want to be a fierce ghost."},
  {a:"信缘分——既然遇见就好好处",r:"你随缘。可以。但小玉和郑生的故事里，不是缘分骗了她，是人——缘分没错，错的是把缘分托付错了人。",ea:"Believe in fate. Since we met, be good to each other.",er:"You go with the flow. Fine. But in Xiaoyu's tale it was not fate that deceived her; it was a man. Fate was not wrong. The one she entrusted fate to was."}
 ]},
{s:"《太平广记 · 杜子春传》",t:"杜子春",img:"tale_48.jpg",
 o:"杜子春者，盖周隋间人。少落拓，不事家产，然以志气闲旷，纵酒闲游。资产荡尽，投于亲故，皆以不事事见弃。……老人曰：「可更归，与老妻子一居，慎勿与人语。」……至夜，见一胡僧，坐于阶下……子春震恐，无辞而走。……老人拊掌笑曰：「悲喜之心，皆已除去，惟有一念未忘——爱也。若爱念不忘，则无所成。」",
 w:"杜子春年轻时败光家产，被亲友抛弃。一位神秘老人三次给他巨资，他都花光，最后一次老人让他守在炼丹炉边，无论见到什么恐怖幻象都不能出声。他在幻境中轮回转世，受尽磨难，眼看就要成功——直到幻境中他转世为女子，产下一子，婴儿被摔在地上，他忍不住「噫」了一声。炼丹失败。老人叹道：你的悲喜都除尽了，只剩一念未忘——爱。爱念不忘，则无所成。",
 u:"刀山火海都忍住了，最后败在一声「噫」——原来最难修的，不是放下悲喜，是放不下爱。",
 q:"如果成功要求你「不动心」——放下家人、感情、牵挂，你做得到吗？或者，值得做吗？",
 en_s:"Taiping Guangji · Du Zichun Zhuan",en_t:"Du Zichun",en_o:"Du Zichun lived between the Zhou and Sui. In youth he was dissipated, careless of property, but of idle and open temper, drinking and wandering. His fortune gone, he threw himself on kin and friends, who cast him off for doing nothing. The old man said: Go back and live with your wife and children; be careful not to speak to anyone. That night he saw a foreign monk sitting at the foot of the steps... Zichun, terrified, fled without a word. The old man clapped and laughed: The heart of grief and joy is gone; only one thought remains unforgotten: love. If the thought of love is not forgotten, nothing can be achieved.",en_w:"Du Zichun squandered his fortune and was cast off. A mysterious old man thrice gave him great sums; he spent them all. The last time, the old man set him to guard the alchemy furnace, forbidden to make a sound whatever horrors appeared. He endured reincarnations of torment, nearly succeeding, until in the vision he was reborn a woman, gave birth, and the baby was dashed to the ground. He could not hold back a gasp. The furnace failed. The old man sighed: your grief and joy are gone, only love remains. While love remains, nothing can be achieved.",en_u:"He bore the mountains of knives and seas of fire, and fell at last on one gasp. The hardest thing to cultivate is not letting go of joy and sorrow, but letting go of love.",en_q:"If success demanded you be unmoved, putting aside family, feeling, attachment, could you? And is it worth it?",opts:[
  {a:"做不到——没有牵挂，成仙也没意思",r:"你是那个「噫」字。对，杜子春败了丹，但他保住了人性里最贵的东西——有些成功，代价是连自己都不认识，宁可不成。",ea:"Cannot. Without attachments, immortality is pointless.",er:"You are that gasp. Right: Du Zichun lost the pill, but kept the most precious thing in human nature. Some success costs you not recognizing yourself; better not to succeed."},
  {a:"能做到——成大事者不拘小节",r:"你决绝。可以，但老人说的是「爱念不忘，则无所成」——你自己想清楚，那个「无所成」你认不认。",ea:"Can. Great deeds ignore small bonds.",er:"You are resolute. Fine. But the old man said: while the thought of love remains, nothing is achieved. Ask yourself plainly: do you accept that nothing?"},
  {a:"一半一半——家人不能放，别的能放",r:"你设了底线。这是多数人的答案。杜子春若只守三关，也许早就成了——他栽就栽在把「爱」也当成了可放之物。",ea:"Half and half. Family cannot go; the rest can.",er:"You set a line. Most people's answer. Had Du Zichun only guarded three gates, he might have succeeded. He fell because he treated love as also disposable."},
  {a:"先试试，忍不住再说",r:"你骑墙。可以，但老人给的试炼没有「再说」——一出声，丹就没了。人生也这样，没有彩排。",ea:"Try first. If I cannot bear it, we will see.",er:"You straddle the fence. Fine, but the old man's trial has no we will see. One sound, and the pill is gone. Life has no rehearsal either."},
  {a:"觉得这故事是pua——凭什么要我放下",r:"你警惕。对，老者不是慈悲，是试炼。但你也可以反过来想：不是要你放下，是告诉你——你心里到底什么放不下，这本身就是答案。",ea:"This tale is gaslighting. Why must I let go?",er:"You are wary. Right, the old man is not merciful but testing. Yet turn it around: it is not telling you to let go, but showing you what you cannot let go of. That itself is the answer."},
  {a:"那就成不了呗，认了",r:"你洒脱。杜子春没成仙，但也活成了自己。人这一生，不是非要炼成那颗丹——守着那声「噫」，也算没白活。",ea:"Then I fail. I accept it.",er:"You are free. Du Zichun did not become immortal, but he lived as himself. A life need not refine that pill. Keeping that gasp is not living in vain."}
 ]},
{s:"《太平广记 · 定婚店》",t:"月下老人",img:"tale_49.jpg",
 o:"杜陵韦固，少孤，思早娶妇，多歧求婚，必无成而罢。……元和二年，将游清河，旅次宋城南店。客有以前清河司马潘昉女见议者。来日，期于店西龙兴寺门。固以求之意切，旦往焉。斜月尚明，有老人倚布囊坐于阶上，向月检书。固步觇之，不识其字。……固问曰：「老父所寻者何书？固少小苦学，世间之字，自谓无不识者。西国梵字，亦能读之。唯此书目所未觌，如何？」老人笑曰：「此非世间书，君因何得见？」……因问囊中何物。曰：「赤绳子耳。以系夫妻之足。及其生，则潜用相系，虽仇敌之家，贵贱悬隔，天涯从宦，吴楚异乡，此绳一系，终不可逭。」",
 w:"韦固少年求婚屡屡不成。一天清晨在宋城旅店外，见一个老人倚着布袋，在月光下翻一本他看不懂的书。韦固问是什么书，老人说：这是天下婚牍；布袋里装的是赤绳——系夫妻之足的。老人告诉他：你未来的妻子，是店北卖菜婆婆怀里的三岁女娃。韦固嫌她寒酸，派仆人刺杀她，只刺中眉心。十四年后，韦固娶了刺史之女，眉间常贴一朵花钿——正是当年被刺的女娃，如今贵为官家女。",
 u:"你躲过了那根赤绳，躲不过十四年后——缘分这东西，你越用力挣脱，它越证明给你看。",
 q:"你信「缘分天定」吗？那些你拼命错过的人，有没有在多年后以另一种身份回到你面前？",
 en_s:"Taiping Guangji · Dinghun Dian",en_t:"The Old Man Under the Moon",en_o:"Wei Gu of Duling, orphaned young, wished to marry early; he courted in many directions, and always failed. In the second year of Yuanhe he was traveling to Qinghe, lodging at a shop south of Songcheng. A guest proposed the daughter of Pan Fang, former adjutant of Qinghe. The meeting was fixed for the next day at the gate of Longxing Temple west of the shop. Wei Gu, eager, went at dawn. The waning moon still shone; an old man sat on the steps leaning on a cloth sack, examining a book by moonlight. Wei Gu approached and looked; he did not know the script. He asked: What book is this, father? I have studied hard from childhood and thought I knew every script in the world, even the Sanskrit of the western lands. This alone I have never seen. The old man smiled: This is no book of the world; how should you see it? Asked what the sack held, he said: Red cords, to bind the feet of husband and wife. When they are born, they are secretly bound; though enemy houses, ranks far apart, posts at the ends of the earth, Wu and Chu in different lands, once this cord is tied, they can never escape.",en_w:"Wei Gu, repeatedly failing to marry, met an old man in the moonlight at Songcheng reading an unknown book: the marriage register of the world, with a sack of red cords that bind destined couples. The old man told him his destined wife was a three-year-old girl in the arms of a vegetable-seller's mother. Disgusted by her poverty, Wei Gu sent a servant to stab her; the knife only grazed her brow. Fourteen years later he married the prefect's daughter, who always wore a flower between her brows: the very girl, now noble.",en_u:"You dodged the red cord, but not the fourteen years after. Fate is like this: the harder you struggle, the more it proves itself to you.",en_q:"Do you believe in destined fate? Have the people you tried so hard to miss returned to you in another form years later?",opts:[
  {a:"信——我躲过，又遇见了",r:"你是韦固：刺了人家一刀，十四年后还是娶了她。你信的不是绳，是「该来的躲不掉」——所以你现在，认命认得很坦然。",ea:"Believe. I dodged, and met again.",er:"You are Wei Gu: stabbed her, and fourteen years later married her. You believe not in the cord, but that what is coming cannot be dodged. So now you accept fate with ease."},
  {a:"不信——人生是自己选的",r:"你自主。可以，但老人没逼韦固娶谁——是他自己的选择把他绕回了原点。信不信绳，绳都在。",ea:"Not believe. Life is my choice.",er:"You are autonomous. Fine. But the old man forced no one. Wei Gu's own choices led him back to the start. Cord or not, the cord is there."},
  {a:"半信半疑——尽了人事，听天命",r:"你务实：该争取的争取，结果交给天。对，韦固要是不求婚，也不会在宋城遇见老人——缘分也认「人事」的。",ea:"Half and half. Do what is human, hear fate.",er:"You are practical: strive where due, leave the rest to Heaven. Right. Had Wei Gu not been courting, he would not have met the old man. Fate honors human effort."},
  {a:"怕缘分——怕被安排",r:"你怕失去掌控。可以理解，但赤绳系的不是枷锁，是归宿——你怕的那根绳，说不定正牵着一个好结局。",ea:"Fear fate. Fear being arranged.",er:"You fear losing control. Understandable. But the red cord binds not a shackle but a home. The cord you fear may be leading a good ending."},
  {a:"觉得这故事太宿命论",r:"你抗拒。但换个角度：韦固的荒唐在于「想改命」——他真去改了，结果改了个寂寞。这故事讽刺的恰是强求，不是缘分。",ea:"Too fatalistic.",er:"You resist. But see it the other way: Wei Gu's folly was wanting to change fate. He truly tried, and changed nothing. The tale mocks force, not fate."},
  {a:"缘分是缘分，选择是选择",r:"你辩证。对，月老系了绳，路还是自己走的——韦固若当年善待那母女，后来的故事会温柔得多。绳只是起点，不是借口。",ea:"Fate is fate; choice is choice.",er:"You are dialectical. Right. The moon man ties the cord, but the road is walked yourself. Had Wei Gu been kind to the mother and child, the later story would have been gentler. The cord is a start, not an excuse."}
 ]},
{s:"《酉阳杂俎 · 天咫》",t:"吴刚伐桂",img:"",
 o:"旧言月中有桂，有蟾蜍。故异书言月桂高五百丈，下有一人常斫之，树创随合。人姓吴名刚，西河人，学仙有过，谪令伐树。",
 w:"传说月中有棵五百丈高的桂树，树下有个人不停地砍它——但斧头砍出的伤口，随砍随合。这人叫吴刚，西河人，修仙犯了过错，被罚砍这棵永远砍不倒的树。",
 u:"最狠的惩罚不是重活，是「永远砍不完」——你以为的惩罚，其实是在测试你，能否在无望的重复里守住心性。",
 q:"你有没有一份「永远看不到头」的苦差、坚持或等待？你还在砍那棵树吗？",
 en_s:"Youyang Zazu · Tian Zhi",en_t:"Wu Gang Cuts the Laurel",en_o:"Old tales say there is a cassia tree in the moon, and a toad. Strange books say the moon's cassia is five hundred zhang tall, and below it a man always chops at it; the tree's wounds close as they are made. The man is Wu Gang of Xihe, who erred in learning immortality and was condemned to cut the tree.",en_w:"In the moon grows a cassia five hundred zhang tall; a man beneath it chops forever, and the wounds heal as he cuts. His name is Wu Gang, a failed immortal punished to cut the unfellable tree.",en_u:"The cruelest punishment is not heavy labor but the tree that never falls. The punishment tests whether you can keep your heart in hopeless repetition.",en_q:"Is there a thankless toil, a waiting, a persistence of yours that never sees the end? Are you still cutting that tree?",opts:[
  {a:"还在砍——砍着砍着就习惯了",r:"你成了月宫里的吴刚：斧起斧落，伤口自合。这不是麻木，是你把无望磨成了日常——能这样活着，也是一种道行。",ea:"Still cutting. I have gotten used to it.",er:"You have become the moon's Wu Gang: axe up, axe down, the wound closes itself. That is not numbness; it is having ground hopelessness into a daily discipline. A way of cultivation in itself."},
  {a:"不砍了——没意义的事不干",r:"你止损。可以，但吴刚没得选——你还有得选，就珍惜这份自由，别用来躺平。",ea:"Stopped. Meaningless work I do not do.",er:"You cut your losses. Fine. But Wu Gang had no choice. You do. Cherish that freedom, and do not waste it lying flat."},
  {a:"换棵树砍，或者换个活法",r:"你灵活。对，桂树砍不倒，可以砍别的、做别的——吴刚困在月宫，你没困住自己，这就是差别。",ea:"Cut another tree, or live another way.",er:"You are flexible. Right: if the cassia will not fall, cut something else, do something else. Wu Gang is trapped in the moon; you are not. That is the difference."},
  {a:"边砍边骂，骂完接着砍",r:"你靠抱怨续命。可以，吴刚要是能骂，大概也这么活——只是别忘了，骂完还得砍，不如省点力气。",ea:"Curse while cutting, then cut on.",er:"You live on complaints. Fine. If Wu Gang could curse, he would live like this. Just remember: after cursing you still cut. Save the breath."},
  {a:"想砍，但不知道树在哪",r:"你还没找到自己的「树」。别急——要么找到那件值得你砍一辈子的事，要么确认它根本不值得。",ea:"Want to cut, but do not know where the tree is.",er:"You have not found your tree. Do not rush. Either find the thing worth cutting for a lifetime, or confirm it is not worth it."},
  {a:"觉得吴刚傻——树砍不倒就别砍了",r:"你说得对，但吴刚砍的不是树，是赎罪——有些「砍树」看似无意义，却是你和自己和解的唯一方式。",ea:"Think Wu Gang foolish. Do not cut what will not fall.",er:"You are right. But Wu Gang cuts not the tree but his atonement. Some cutting looks meaningless, yet it is the only way you make peace with yourself."}
 ]},
{s:"《太平广记 · 昆仑奴传》",t:"昆仑奴",img:"",
 o:"唐大历中，有崔生者，其父为显僚，与盖代之勋臣一品者熟。生时为千牛，其父使往省一品疾。生少年，容貌如玉，举止安详。……一品家中有昆仑奴磨勒，负生至红绡妓所，往来无碍。……生问曰：「红绡妓而竟不能通一语，可乎？」磨勒曰：「此小事耳。」……乃负生飞越十重垣而去。……后一品知之，欲杀磨勒。磨勒遂持匕首，飞出高垣，瞥若翅翎，疾同鹰隼，攒矢如雨，莫能中之。",
 w:"唐大历年间，崔生奉父命去探望一品大官的病，对府中歌姬红绡一见钟情，却不敢开口。家中的昆仑奴磨勒看出他的心事，夜里背着他飞越十重高墙，送他到红绡处相会。后来事情败露，一品要杀磨勒，磨勒手持匕首，飞出高墙，箭如雨下也伤不到他分毫，从此不知所踪。",
 u:"一身本事不用来仗势欺人，用来成全一对有情人——侠之大者，是帮人把说不出口的心事，变成翻过墙去的勇气。",
 q:"你有没有一份「说不出口的心事」，缺的只是一个替你翻墙的人？或者，你愿意当那个替人翻墙的磨勒吗？",
 en_s:"Taiping Guangji · Kunlun Nu",en_t:"The Kunlun Slave",en_o:"In the Dali era of Tang there was Cui Sheng, whose father was a high official acquainted with a first-rank lord of the age. His father sent Cui to inquire after the lord's illness. Cui was young, his face like jade, his manner serene. In the lord's house was the Kunlun slave Mole, who carried Cui to the quarters of the songstress Hongxiao, coming and going unhindered. Cui asked: The songstress, and I cannot even speak one word to her, is that acceptable? Mole said: This is a small matter. He carried Cui flying over ten walls. Later the lord learned of it and wanted to kill Mole. Mole took a dagger, flew out over the high wall, quick as wings, swift as a hawk; arrows rained but none could hit him.",en_w:"In the Tang, Cui Sheng fell for the songstress Hongxiao at a lord's house but dared not speak. The Kunlun slave Mole read his heart, carried him over ten walls at night to meet her. When discovered, Mole flew over the wall with a dagger; arrows could not touch him, and he vanished.",en_u:"Skill used not to bully others but to bring two lovers together. The great knight turns unspoken hearts into the courage to cross walls.",en_q:"Is there an unspoken longing in you that only lacks someone to cross the wall for you? Or would you be that Mole for someone else?",opts:[
  {a:"愿意——成人之美，是我的本事",r:"你是磨勒：背人飞越十重垣。你的本事不为自己，专替别人把话说完——这份侠气，比墙高。",ea:"Yes. Completing others' love is my craft.",er:"You are Mole, carrying a man over ten walls. Your skill is not for yourself but to finish others' sentences. That chivalry stands taller than walls."},
  {a:"我的事，我自己翻墙",r:"你是自强派。可以，崔生要是有你这胆量，也不用磨勒了——只是有些墙，一个人真的翻不过去。",ea:"My affairs, I cross my own walls.",er:"You are the self-reliant kind. Fine. Had Cui your nerve, he would not have needed Mole. But some walls truly cannot be crossed alone."},
  {a:"怕帮了忙惹祸上身",r:"你权衡风险。对，磨勒后来确实被追杀——但他值了。你至少可以帮到「不惹祸」的那一步。",ea:"Afraid helping will bring trouble.",er:"You weigh risk. Right: Mole was indeed hunted later. But he thought it worth it. You can at least help up to the point of no trouble."},
  {a:"等一个磨勒来帮我",r:"你等得辛苦。可以，但磨勒只帮崔生这种「值得帮」的人——你先让自己值得，翻墙的人自然来。",ea:"Waiting for a Mole to help me.",er:"You wait wearily. Fine. But Mole helps only those worth helping, like Cui. Make yourself worth it first, and the wall-crosser comes."},
  {a:"替人翻墙，但收点好处",r:"你实在。可以，但磨勒的侠在「不求」——你收了钱，就只是服务，不是侠了。",ea:"Help, but take a fee.",er:"You are practical. Fine. But Mole's chivalry lies in expecting nothing. Once you charge, it is service, not chivalry."},
  {a:"先看清墙那边是什么人",r:"你谨慎。对，磨勒也是看清了红绡值得才帮的——不是所有墙都该翻，先看清对面是谁。",ea:"First see who is beyond the wall.",er:"You are cautious. Right. Mole too saw Hongxiao was worth it. Not every wall should be crossed. See who is on the other side first."}
 ]},
{s:"《山海经 · 海外北经》",t:"夸父逐日",img:"",
 o:"夸父与日逐走，入日；渴，欲得饮，饮于河、渭，河、渭不足，北饮大泽。未至，道渴而死。弃其杖，化为邓林。",
 w:"夸父追赶太阳，追到太阳落山的地方。渴了，去喝黄河、渭水的水，两条河的水都不够喝，又往北去找大泽。还没走到，就在路上渴死了。他扔掉的手杖，化成一片桃林。",
 u:"追太阳的人渴死了，但他的杖化成桃林——逐日的结局是死，可他给后来人留下了荫凉。有些梦，注定追不到，但追它的人，本身就是风景。",
 q:"你心里有没有一个「注定追不到」的太阳？追了它多少年，值不值得？",
 en_s:"Shanhaijing · Haiwai Beijing",en_t:"Kuafu Chases the Sun",en_o:"Kuafu raced the sun and entered its brilliance; thirsty, he wanted drink, drank from the Yellow River and the Wei, and they were not enough, so he went north to the great marsh. He never reached it and died of thirst on the road. He cast away his staff, and it became a peach grove.",en_w:"Kuafu chased the sun to where it sets. Thirsty, he drank the Yellow River and the Wei dry, still thirsty, and went north for the great marsh. He died on the road. His thrown staff became a peach grove.",en_u:"The sun-chaser died of thirst, but his staff became a grove. The end of the chase is death, yet he left shade for those after. Some dreams can never be caught, but the one who chases is himself a view.",en_q:"Is there a sun in your heart that can never be caught? How many years have you chased it? Is it worth it?",opts:[
  {a:"追——追不到也追",r:"你是夸父：明知入日，还是要逐。渴死路上也不悔——至少你的杖，最后化成了别人的桃林。",ea:"Chase. Even if I never catch it.",er:"You are Kuafu: knowing the sun will burn, you still race. Die thirsty on the road without regret. At least your staff becomes another's grove."},
  {a:"不追了——换个人间目标",r:"你务实。可以，但别把「不追」说成「看透」——有些太阳，错过了就是错过了。",ea:"Stop chasing. Pick a human goal.",er:"You are practical. Fine. But do not call not-chasing seeing-through. Some suns, once missed, are missed."},
  {a:"追一半，累了就歇",r:"你边追边歇。夸父不歇，所以他死了——你歇着歇着，可能就忘了自己追过什么。",ea:"Chase halfway, rest when tired.",er:"You chase and rest by turns. Kuafu never rested, so he died. You rest until you may forget what you chased."},
  {a:"把太阳记在心里，慢慢走",r:"你不追了，但心里留着那轮日。夸父的杖化成桃林，你心里的太阳化成什么，你自己知道。",ea:"Keep the sun in my heart, walk slowly.",er:"You no longer chase, but the sun stays within. Kuafu's staff became a grove; what your inner sun becomes, you know."},
  {a:"觉得夸父是傻子",r:"他确实傻——傻在把命押给一个追不到的目标。但人间那些「桃林」，哪一片不是傻子种的？",ea:"Think Kuafu a fool.",er:"He was a fool, a fool who staked his life on an uncatchable goal. But which grove in this world was not planted by a fool?"},
  {a:"追太阳不如种桃林",r:"你选得聪明：与其追日，不如种树。夸父的杖化桃林是意外，你直接种——你的桃林，比他的荫凉更多。",ea:"Better to plant the grove than chase the sun.",er:"You chose wisely: instead of chasing the sun, plant trees. Kuafu's grove was accident; you plant directly. Your shade will outlast his."}
 ]},
{s:"《山海经 · 海外西经》",t:"刑天舞干戚",img:"",
 o:"刑天与帝至此争神，帝断其首，葬之常羊之山。乃以乳为目，以脐为口，操干戚以舞。",
 w:"刑天和天帝争夺神位，天帝砍下他的头，葬在常羊山上。刑天没了头，就用乳头当眼睛，用肚脐当嘴巴，挥舞着盾牌和斧头，继续战斗。",
 u:"头被砍了，还要站起来继续舞——人可以被击败，但「不服」这件事本身，是砍不掉的。",
 q:"当你的「头」（职位、名声、脸面、靠山）被砍掉时，你还站得起来吗？",
 en_s:"Shanhaijing · Haiwai Xijing",en_t:"Xingtian Dances with Shield and Axe",en_o:"Xingtian contended with the Emperor for the godhead; the Emperor cut off his head and buried it on Changyang Mountain. Then Xingtian used his nipples for eyes and his navel for a mouth, and grasping shield and axe, went on dancing.",en_w:"Xingtian fought the Emperor for godhood. The Emperor cut off his head. Headless, Xingtian made his nipples his eyes and his navel his mouth, and kept fighting with shield and axe.",en_u:"Beheaded, he still rises to dance. A person can be defeated, but the word not-submitting itself cannot be cut off.",en_q:"When your head, your post, your name, your face, your backing, is cut off, can you still stand?",opts:[
  {a:"站起来——以乳为目，继续舞",r:"你是刑天：头没了，用肚脐当嘴也要喊。这份不服输，天帝看了也头疼——你输过，但没败过。",ea:"Stand up. Nipples for eyes, keep dancing.",er:"You are Xingtian: headless, shouting through the navel. That refusal to yield gives even the Emperor a headache. You have lost, but never been defeated."},
  {a:"头没了，就先歇着",r:"你允许自己倒下。可以，刑天是神话，你是人——人要先疗伤，再谈站起来。",ea:"Head gone. Rest first.",er:"You allow yourself to fall. Fine. Xingtian is myth; you are human. Heal first, then speak of standing."},
  {a:"换个方式活——没头也能过",r:"你灵活。对，刑天是继续战，你是继续活——殊途同归，都是没让「断头」定义自己。",ea:"Live another way. Life without a head is possible.",er:"You are flexible. Right: Xingtian kept fighting, you keep living. Same end: not letting the beheading define you."},
  {a:"假装头还在，死撑",r:"你撑着面子。可以，但刑天是坦荡地没有头——你藏着的「没有」，比他的更累。",ea:"Pretend the head is still there. Tough it out.",er:"You keep up appearances. Fine. But Xingtian was honestly headless. Your hidden lack is more tiring than his."},
  {a:"觉得刑天太轴",r:"他确实轴。但轴到极致，就成了风骨——你笑他轴，可你心里有没有那根不肯弯的骨头？",ea:"Think Xingtian too stubborn.",er:"He was. But stubbornness to the extreme becomes backbone. You laugh at him, yet is there a bone in you that will not bend?"},
  {a:"把我的意志传下去，让别人接着舞",r:"你选择传承：自己倒下了，让「不服」活下去。刑天的干戚没人接，你的有人接——你比他幸运。",ea:"Pass my will on. Let others dance on.",er:"You choose inheritance: I fall, but not-submitting lives. No one took Xingtian's axe. Someone takes yours. You are luckier."}
 ]},
{s:"《山海经 · 海内经》",t:"大禹治水",img:"",
 o:"洪水滔天，鲧窃帝之息壤以堙洪水，不待帝命。帝令祝融杀鲧于羽郊。鲧复生禹，帝乃命禹卒布土以定九州。……禹八年于外，三过其门而不入。",
 w:"洪水滔天，鲧偷了天帝的息壤去堵水，天帝派祝融杀了他。鲧死后腹中生出禹，天帝命禹治理洪水。禹治水八年在外，三次经过自己家门口都没有进去——他的妻子涂山氏抱着儿子在门口等他，他也只看了看就转身走了。",
 u:"三过家门而不入——不是不想进，是肩上扛着九州的洪水。有些责任，重到连团圆都得往后放。",
 q:"当「大家的责任」和「自己的家」冲突时，你会怎么选？你为责任「过门不入」过吗？",
 en_s:"Shanhaijing · Hainei Jing",en_t:"Yu Tames the Flood",en_o:"The flood rose to heaven. Gun stole the Emperor's swelling soil to dam the flood, without awaiting the Emperor's command. The Emperor ordered Zhurong to slay Gun on the Feather Ridge. Gun's body gave birth to Yu, and the Emperor ordered Yu at last to spread the soil and settle the Nine Provinces. Yu was abroad eight years, thrice passing his own gate without entering.",en_w:"The flood was heaven-high. Gun stole Heaven's soil to dam it and was killed. From his body was born Yu, whom Heaven ordered to tame the waters. Yu labored eight years, thrice passing his own door without entering, while his wife held their son at the gate. He looked, and turned away.",en_u:"Thrice passing his own gate and not entering. Not that he did not want to, but the flood of the Nine Provinces was on his shoulders. Some responsibilities are so heavy that reunion must wait.",en_q:"When the responsibility of all and the home of your own conflict, which do you choose? Have you ever passed your own door without entering for a duty?",opts:[
  {a:"先治水，家回头再顾",r:"你是大禹：三过不入。你信「把水治好，才有家」——这份牺牲，家里人嘴上不说，心里其实懂。",ea:"Tame the water first. The family can wait.",er:"You are Yu: thrice passing, not entering. You believe: only when the water is tamed is there a home. The family says nothing, but understands."},
  {a:"先顾家，责任再想办法",r:"你选小家。可以理解——但大禹的故事提醒：洪水不等人，有些责任拖久了，家也没了。",ea:"Home first. The duty, another way.",er:"You choose the small home. Understandable. But Yu's tale warns: floods wait for no one. Put duty off too long, and the home is gone too."},
  {a:"带着家一起治水",r:"你想两全。对，涂山氏其实一直在支持禹——家的意义，不一定是守在屋里，也可以是并肩站在洪水边。",ea:"Tame the water with my family beside me.",er:"You want both. Right: Tushan-shi always supported Yu. Home need not mean staying indoors; it can mean standing together on the flood's edge."},
  {a:"过门就进，看看孩子",r:"你是人性派：责任再大，也要抱抱孩子。可以，大禹是神话的完美，你是人间——你没错，只是九州的水会慢些退。",ea:"Enter the gate. See the child.",er:"You are the human kind: duty or not, hold the child. Fine. Yu is mythic perfection; you are human. You are not wrong. Only the waters of the Nine Provinces recede slower."},
  {a:"分不清哪个更重要",r:"你诚实。大禹也不是没纠结——他只是选择了「先做该做的」。纠结完，总要有一个先落地的。",ea:"Cannot tell which matters more.",er:"You are honest. Yu also wavered. He just chose to do what must be done first. After the wavering, one must land."},
  {a:"觉得三过不入太狠心",r:"对家里人确实狠。但禹后来还天下于民、不私其子——他的「狠」，是把对家的亏欠，化成了对天下的公平。",ea:"Think thrice-not-entering too cruel.",er:"It was cruel to the family. But Yu later gave the realm back to the people and did not favor his own son. His cruelty was turning his debt to home into fairness for the world."}
 ]},
{s:"《酉阳杂俎 · 天咫》",t:"吴刚伐桂",img:"",
 o:"旧言月中有桂，有蟾蜍。故异书言月桂高五百丈，下有一人常斫之，树创随合。人姓吴名刚，西河人，学仙有过，谪令伐树。",
 w:"传说月中有棵五百丈高的桂树，树下有个人不停地砍它——但斧头砍出的伤口，随砍随合。这人叫吴刚，西河人，修仙犯了过错，被罚砍这棵永远砍不倒的树。",
 u:"最狠的惩罚不是重活，是「永远砍不完」——你以为的惩罚，其实是在测试你，能否在无望的重复里守住心性。",
 q:"你有没有一份「永远看不到头」的苦差、坚持或等待？你还在砍那棵树吗？",
 en_s:"Youyang Zazu · Tian Zhi",en_t:"Wu Gang Cuts the Laurel",en_o:"Old tales say there is a cassia tree in the moon, and a toad. Strange books say the moon's cassia is five hundred zhang tall, and below it a man always chops at it; the tree's wounds close as they are made. The man is Wu Gang of Xihe, who erred in learning immortality and was condemned to cut the tree.",en_w:"In the moon grows a cassia five hundred zhang tall; a man beneath it chops forever, and the wounds heal as he cuts. His name is Wu Gang, a failed immortal punished to cut the unfellable tree.",en_u:"The cruelest punishment is not heavy labor but the tree that never falls. The punishment tests whether you can keep your heart in hopeless repetition.",en_q:"Is there a thankless toil, a waiting, a persistence of yours that never sees the end? Are you still cutting that tree?",opts:[
  {a:"还在砍——砍着砍着就习惯了",r:"你成了月宫里的吴刚：斧起斧落，伤口自合。这不是麻木，是你把无望磨成了日常——能这样活着，也是一种道行。",ea:"Still cutting. I have gotten used to it.",er:"You have become the moon's Wu Gang: axe up, axe down, the wound closes itself. That is not numbness; it is having ground hopelessness into a daily discipline. A way of cultivation in itself."},
  {a:"不砍了——没意义的事不干",r:"你止损。可以，但吴刚没得选——你还有得选，就珍惜这份自由，别用来躺平。",ea:"Stopped. Meaningless work I do not do.",er:"You cut your losses. Fine. But Wu Gang had no choice. You do. Cherish that freedom, and do not waste it lying flat."},
  {a:"换棵树砍，或者换个活法",r:"你灵活。对，桂树砍不倒，可以砍别的、做别的——吴刚困在月宫，你没困住自己，这就是差别。",ea:"Cut another tree, or live another way.",er:"You are flexible. Right: if the cassia will not fall, cut something else, do something else. Wu Gang is trapped in the moon; you are not. That is the difference."},
  {a:"边砍边骂，骂完接着砍",r:"你靠抱怨续命。可以，吴刚要是能骂，大概也这么活——只是别忘了，骂完还得砍，不如省点力气。",ea:"Curse while cutting, then cut on.",er:"You live on complaints. Fine. If Wu Gang could curse, he would live like this. Just remember: after cursing you still cut. Save the breath."},
  {a:"想砍，但不知道树在哪",r:"你还没找到自己的「树」。别急——要么找到那件值得你砍一辈子的事，要么确认它根本不值得。",ea:"Want to cut, but do not know where the tree is.",er:"You have not found your tree. Do not rush. Either find the thing worth cutting for a lifetime, or confirm it is not worth it."},
  {a:"觉得吴刚傻——树砍不倒就别砍了",r:"你说得对，但吴刚砍的不是树，是赎罪——有些「砍树」看似无意义，却是你和自己和解的唯一方式。",ea:"Think Wu Gang foolish. Do not cut what will not fall.",er:"You are right. But Wu Gang cuts not the tree but his atonement. Some cutting looks meaningless, yet it is the only way you make peace with yourself."}
 ]},

 o:"唐大历中，有崔生者，其父为显僚，与盖代之勋臣一品者熟。生时为千牛，其父使往省一品疾。生少年，容貌如玉，举止安详。……一品家中有昆仑奴磨勒，负生至红绡妓所，往来无碍。……生问曰：「红绡妓而竟不能通一语，可乎？」磨勒曰：「此小事耳。」……乃负生飞越十重垣而去。……后一品知之，欲杀磨勒。磨勒遂持匕首，飞出高垣，瞥若翅翎，疾同鹰隼，攒矢如雨，莫能中之。",
 w:"唐大历年间，崔生奉父命去探望一品大官的病，对府中歌姬红绡一见钟情，却不敢开口。家中的昆仑奴磨勒看出他的心事，夜里背着他飞越十重高墙，送他到红绡处相会。后来事情败露，一品要杀磨勒，磨勒手持匕首，飞出高墙，箭如雨下也伤不到他分毫，从此不知所踪。",
 u:"一身本事不用来仗势欺人，用来成全一对有情人——侠之大者，是帮人把说不出口的心事，变成翻过墙去的勇气。",
 q:"你有没有一份「说不出口的心事」，缺的只是一个替你翻墙的人？或者，你愿意当那个替人翻墙的磨勒吗？",
 en_s:"Taiping Guangji · Kunlun Nu",en_t:"The Kunlun Slave",en_o:"In the Dali era of Tang there was Cui Sheng, whose father was a high official acquainted with a first-rank lord of the age. His father sent Cui to inquire after the lord's illness. Cui was young, his face like jade, his manner serene. In the lord's house was the Kunlun slave Mole, who carried Cui to the quarters of the songstress Hongxiao, coming and going unhindered. Cui asked: The songstress, and I cannot even speak one word to her, is that acceptable? Mole said: This is a small matter. He carried Cui flying over ten walls. Later the lord learned of it and wanted to kill Mole. Mole took a dagger, flew out over the high wall, quick as wings, swift as a hawk; arrows rained but none could hit him.",en_w:"In the Tang, Cui Sheng fell for the songstress Hongxiao at a lord's house but dared not speak. The Kunlun slave Mole read his heart, carried him over ten walls at night to meet her. When discovered, Mole flew over the wall with a dagger; arrows could not touch him, and he vanished.",en_u:"Skill used not to bully others but to bring two lovers together. The great knight turns unspoken hearts into the courage to cross walls.",en_q:"Is there an unspoken longing in you that only lacks someone to cross the wall for you? Or would you be that Mole for someone else?",opts:[
  {a:"愿意——成人之美，是我的本事",r:"你是磨勒：背人飞越十重垣。你的本事不为自己，专替别人把话说完——这份侠气，比墙高。",ea:"Yes. Completing others' love is my craft.",er:"You are Mole, carrying a man over ten walls. Your skill is not for yourself but to finish others' sentences. That chivalry stands taller than walls."},
  {a:"我的事，我自己翻墙",r:"你是自强派。可以，崔生要是有你这胆量，也不用磨勒了——只是有些墙，一个人真的翻不过去。",ea:"My affairs, I cross my own walls.",er:"You are the self-reliant kind. Fine. Had Cui your nerve, he would not have needed Mole. But some walls truly cannot be crossed alone."},
  {a:"怕帮了忙惹祸上身",r:"你权衡风险。对，磨勒后来确实被追杀——但他值了。你至少可以帮到「不惹祸」的那一步。",ea:"Afraid helping will bring trouble.",er:"You weigh risk. Right: Mole was indeed hunted later. But he thought it worth it. You can at least help up to the point of no trouble."},
  {a:"等一个磨勒来帮我",r:"你等得辛苦。可以，但磨勒只帮崔生这种「值得帮」的人——你先让自己值得，翻墙的人自然来。",ea:"Waiting for a Mole to help me.",er:"You wait wearily. Fine. But Mole helps only those worth helping, like Cui. Make yourself worth it first, and the wall-crosser comes."},
  {a:"替人翻墙，但收点好处",r:"你实在。可以，但磨勒的侠在「不求」——你收了钱，就只是服务，不是侠了。",ea:"Help, but take a fee.",er:"You are practical. Fine. But Mole's chivalry lies in expecting nothing. Once you charge, it is service, not chivalry."},
  {a:"先看清墙那边是什么人",r:"你谨慎。对，磨勒也是看清了红绡值得才帮的——不是所有墙都该翻，先看清对面是谁。",ea:"First see who is beyond the wall.",er:"You are cautious. Right. Mole too saw Hongxiao was worth it. Not every wall should be crossed. See who is on the other side first."}
 ]},
{s:"《山海经 · 海外北经》",t:"夸父逐日",img:"",
 o:"夸父与日逐走，入日；渴，欲得饮，饮于河、渭，河、渭不足，北饮大泽。未至，道渴而死。弃其杖，化为邓林。",
 w:"夸父追赶太阳，追到太阳落山的地方。渴了，去喝黄河、渭水的水，两条河的水都不够喝，又往北去找大泽。还没走到，就在路上渴死了。他扔掉的手杖，化成一片桃林。",
 u:"追太阳的人渴死了，但他的杖化成桃林——逐日的结局是死，可他给后来人留下了荫凉。有些梦，注定追不到，但追它的人，本身就是风景。",
 q:"你心里有没有一个「注定追不到」的太阳？追了它多少年，值不值得？",
 en_s:"Shanhaijing · Haiwai Beijing",en_t:"Kuafu Chases the Sun",en_o:"Kuafu raced the sun and entered its brilliance; thirsty, he wanted drink, drank from the Yellow River and the Wei, and they were not enough, so he went north to the great marsh. He never reached it and died of thirst on the road. He cast away his staff, and it became a peach grove.",en_w:"Kuafu chased the sun to where it sets. Thirsty, he drank the Yellow River and the Wei dry, still thirsty, and went north for the great marsh. He died on the road. His thrown staff became a peach grove.",en_u:"The sun-chaser died of thirst, but his staff became a grove. The end of the chase is death, yet he left shade for those after. Some dreams can never be caught, but the one who chases is himself a view.",en_q:"Is there a sun in your heart that can never be caught? How many years have you chased it? Is it worth it?",opts:[
  {a:"追——追不到也追",r:"你是夸父：明知入日，还是要逐。渴死路上也不悔——至少你的杖，最后化成了别人的桃林。",ea:"Chase. Even if I never catch it.",er:"You are Kuafu: knowing the sun will burn, you still race. Die thirsty on the road without regret. At least your staff becomes another's grove."},
  {a:"不追了——换个人间目标",r:"你务实。可以，但别把「不追」说成「看透」——有些太阳，错过了就是错过了。",ea:"Stop chasing. Pick a human goal.",er:"You are practical. Fine. But do not call not-chasing seeing-through. Some suns, once missed, are missed."},
  {a:"追一半，累了就歇",r:"你边追边歇。夸父不歇，所以他死了——你歇着歇着，可能就忘了自己追过什么。",ea:"Chase halfway, rest when tired.",er:"You chase and rest by turns. Kuafu never rested, so he died. You rest until you may forget what you chased."},
  {a:"把太阳记在心里，慢慢走",r:"你不追了，但心里留着那轮日。夸父的杖化成桃林，你心里的太阳化成什么，你自己知道。",ea:"Keep the sun in my heart, walk slowly.",er:"You no longer chase, but the sun stays within. Kuafu's staff became a grove; what your inner sun becomes, you know."},
  {a:"觉得夸父是傻子",r:"他确实傻——傻在把命押给一个追不到的目标。但人间那些「桃林」，哪一片不是傻子种的？",ea:"Think Kuafu a fool.",er:"He was a fool, a fool who staked his life on an uncatchable goal. But which grove in this world was not planted by a fool?"},
  {a:"追太阳不如种桃林",r:"你选得聪明：与其追日，不如种树。夸父的杖化桃林是意外，你直接种——你的桃林，比他的荫凉更多。",ea:"Better to plant the grove than chase the sun.",er:"You chose wisely: instead of chasing the sun, plant trees. Kuafu's grove was accident; you plant directly. Your shade will outlast his."}
 ]},
{s:"《山海经 · 海外西经》",t:"刑天舞干戚",img:"",
 o:"刑天与帝至此争神，帝断其首，葬之常羊之山。乃以乳为目，以脐为口，操干戚以舞。",
 w:"刑天和天帝争夺神位，天帝砍下他的头，葬在常羊山上。刑天没了头，就用乳头当眼睛，用肚脐当嘴巴，挥舞着盾牌和斧头，继续战斗。",
 u:"头被砍了，还要站起来继续舞——人可以被击败，但「不服」这件事本身，是砍不掉的。",
 q:"当你的「头」（职位、名声、脸面、靠山）被砍掉时，你还站得起来吗？",
 en_s:"Shanhaijing · Haiwai Xijing",en_t:"Xingtian Dances with Shield and Axe",en_o:"Xingtian contended with the Emperor for the godhead; the Emperor cut off his head and buried it on Changyang Mountain. Then Xingtian used his nipples for eyes and his navel for a mouth, and grasping shield and axe, went on dancing.",en_w:"Xingtian fought the Emperor for godhood. The Emperor cut off his head. Headless, Xingtian made his nipples his eyes and his navel his mouth, and kept fighting with shield and axe.",en_u:"Beheaded, he still rises to dance. A person can be defeated, but the word not-submitting itself cannot be cut off.",en_q:"When your head, your post, your name, your face, your backing, is cut off, can you still stand?",opts:[
  {a:"站起来——以乳为目，继续舞",r:"你是刑天：头没了，用肚脐当嘴也要喊。这份不服输，天帝看了也头疼——你输过，但没败过。",ea:"Stand up. Nipples for eyes, keep dancing.",er:"You are Xingtian: headless, shouting through the navel. That refusal to yield gives even the Emperor a headache. You have lost, but never been defeated."},
  {a:"头没了，就先歇着",r:"你允许自己倒下。可以，刑天是神话，你是人——人要先疗伤，再谈站起来。",ea:"Head gone. Rest first.",er:"You allow yourself to fall. Fine. Xingtian is myth; you are human. Heal first, then speak of standing."},
  {a:"换个方式活——没头也能过",r:"你灵活。对，刑天是继续战，你是继续活——殊途同归，都是没让「断头」定义自己。",ea:"Live another way. Life without a head is possible.",er:"You are flexible. Right: Xingtian kept fighting, you keep living. Same end: not letting the beheading define you."},
  {a:"假装头还在，死撑",r:"你撑着面子。可以，但刑天是坦荡地没有头——你藏着的「没有」，比他的更累。",ea:"Pretend the head is still there. Tough it out.",er:"You keep up appearances. Fine. But Xingtian was honestly headless. Your hidden lack is more tiring than his."},
  {a:"觉得刑天太轴",r:"他确实轴。但轴到极致，就成了风骨——你笑他轴，可你心里有没有那根不肯弯的骨头？",ea:"Think Xingtian too stubborn.",er:"He was. But stubbornness to the extreme becomes backbone. You laugh at him, yet is there a bone in you that will not bend?"},
  {a:"把我的意志传下去，让别人接着舞",r:"你选择传承：自己倒下了，让「不服」活下去。刑天的干戚没人接，你的有人接——你比他幸运。",ea:"Pass my will on. Let others dance on.",er:"You choose inheritance: I fall, but not-submitting lives. No one took Xingtian's axe. Someone takes yours. You are luckier."}
 ]},
{s:"《山海经 · 海内经》",t:"大禹治水",img:"",
 o:"洪水滔天，鲧窃帝之息壤以堙洪水，不待帝命。帝令祝融杀鲧于羽郊。鲧复生禹，帝乃命禹卒布土以定九州。……禹八年于外，三过其门而不入。",
 w:"洪水滔天，鲧偷了天帝的息壤去堵水，天帝派祝融杀了他。鲧死后腹中生出禹，天帝命禹治理洪水。禹治水八年在外，三次经过自己家门口都没有进去——他的妻子涂山氏抱着儿子在门口等他，他也只看了看就转身走了。",
 u:"三过家门而不入——不是不想进，是肩上扛着九州的洪水。有些责任，重到连团圆都得往后放。",
 q:"当「大家的责任」和「自己的家」冲突时，你会怎么选？你为责任「过门不入」过吗？",
 en_s:"Shanhaijing · Hainei Jing",en_t:"Yu Tames the Flood",en_o:"The flood rose to heaven. Gun stole the Emperor's swelling soil to dam the flood, without awaiting the Emperor's command. The Emperor ordered Zhurong to slay Gun on the Feather Ridge. Gun's body gave birth to Yu, and the Emperor ordered Yu at last to spread the soil and settle the Nine Provinces. Yu was abroad eight years, thrice passing his own gate without entering.",en_w:"The flood was heaven-high. Gun stole Heaven's soil to dam it and was killed. From his body was born Yu, whom Heaven ordered to tame the waters. Yu labored eight years, thrice passing his own door without entering, while his wife held their son at the gate. He looked, and turned away.",en_u:"Thrice passing his own gate and not entering. Not that he did not want to, but the flood of the Nine Provinces was on his shoulders. Some responsibilities are so heavy that reunion must wait.",en_q:"When the responsibility of all and the home of your own conflict, which do you choose? Have you ever passed your own door without entering for a duty?",opts:[
  {a:"先治水，家回头再顾",r:"你是大禹：三过不入。你信「把水治好，才有家」——这份牺牲，家里人嘴上不说，心里其实懂。",ea:"Tame the water first. The family can wait.",er:"You are Yu: thrice passing, not entering. You believe: only when the water is tamed is there a home. The family says nothing, but understands."},
  {a:"先顾家，责任再想办法",r:"你选小家。可以理解——但大禹的故事提醒：洪水不等人，有些责任拖久了，家也没了。",ea:"Home first. The duty, another way.",er:"You choose the small home. Understandable. But Yu's tale warns: floods wait for no one. Put duty off too long, and the home is gone too."},
  {a:"带着家一起治水",r:"你想两全。对，涂山氏其实一直在支持禹——家的意义，不一定是守在屋里，也可以是并肩站在洪水边。",ea:"Tame the water with my family beside me.",er:"You want both. Right: Tushan-shi always supported Yu. Home need not mean staying indoors; it can mean standing together on the flood's edge."},
  {a:"过门就进，看看孩子",r:"你是人性派：责任再大，也要抱抱孩子。可以，大禹是神话的完美，你是人间——你没错，只是九州的水会慢些退。",ea:"Enter the gate. See the child.",er:"You are the human kind: duty or not, hold the child. Fine. Yu is mythic perfection; you are human. You are not wrong. Only the waters of the Nine Provinces recede slower."},
  {a:"分不清哪个更重要",r:"你诚实。大禹也不是没纠结——他只是选择了「先做该做的」。纠结完，总要有一个先落地的。",ea:"Cannot tell which matters more.",er:"You are honest. Yu also wavered. He just chose to do what must be done first. After the wavering, one must land."},
  {a:"觉得三过不入太狠心",r:"对家里人确实狠。但禹后来还天下于民、不私其子——他的「狠」，是把对家的亏欠，化成了对天下的公平。",ea:"Think thrice-not-entering too cruel.",er:"It was cruel to the family. But Yu later gave the realm back to the people and did not favor his own son. His cruelty was turning his debt to home into fairness for the world."}
 ]},
{s:"《幽明录 · 卷四》",t:"新死鬼",img:"",
 o:"有新死鬼，形疲瘦顿。忽见生时友人，死及二十年，肥健，相问讯曰：「卿那尔？」曰：「吾饥饿殆不自任，卿知诸方便，故当以法见教。」友鬼云：「此甚易耳。但为人作怪，人必大怖，当与卿食。」……新鬼大喜，即便辞去。乃至一家，奉佛精进，屋西厢有磨，鬼便上椎之，如人推磨。此人见之，便语家人曰：「佛怜我家贫，令鬼推磨。」乃辇麦与之。至夕，磨数斛，疲顿乃去。",
 w:"有个新死的鬼，又累又饿。遇到死去二十年的老鬼，老鬼教他：你去吓人，人一害怕就会给你吃的。新鬼大喜，去了一家信佛的人家，上磨推磨。主人见了说：佛可怜我家穷，派鬼来推磨！于是给他麦子磨。鬼磨了好几斛，累得半死才走——吓人没吓成，反而当了免费劳力。",
 u:"新鬼想靠「吓人」吃饭，结果被当成「佛的恩赐」——这世上最远的弯路，是以为别人会怕你，其实人家只是把你当工具。",
 q:"你刚进入一个新环境（新工作、新圈子）时，是想着「镇住别人」，还是先老实干活？",
 en_s:"Youming Lu · Scroll 4",en_t:"The Newly Dead Ghost",en_o:"There was a newly dead ghost, thin and weary. Suddenly he saw a friend from life, dead some twenty years, fat and healthy. The friend asked: How are you so? The new ghost said: I am near starving and cannot bear it. You know the ways; teach me. The old ghost said: This is easy. Just make mischief for people; they will be terrified and give you food. The new ghost rejoiced and left. He came to a devout Buddhist house with a mill in the west wing. The ghost climbed on the mill and turned it like a man. Seeing this, the master said to his family: Buddha pities our poverty and sends a ghost to turn the mill. He brought wheat. That evening the ghost ground several hu of grain, weary, and left.",en_w:"A newly dead ghost, starving, asked a twenty-year-old ghost how to get food. Scare people, said the old ghost. The new ghost went to a devout house and started turning their mill. The master said: Buddha sends a ghost to grind our wheat! He fed it work all evening. The ghost left exhausted, having been free labor.",en_u:"The new ghost hoped to live by fright; he ended up being taken for a gift from Buddha. The longest detour is believing others fear you, when they only use you as a tool.",en_q:"Entering a new environment, a new job, a new circle, do you try to awe them, or quietly do the work?",opts:[
  {a:"先老实干活——让人看到我的价值",r:"你是那个「推磨」的鬼：本想着吓人，结果磨了麦子。但主人因此记住了它——踏实干活，比吓人管用。",ea:"Work quietly first. Let them see my value.",er:"You are the grinding ghost: meant to scare, ended up grinding wheat. But the master remembered it. Steady work beats fright."},
  {a:"先立威——不能让人小看",r:"你想镇场子。可以，但新死鬼的下场是：吓人没吓成，活没少干——立威要有真本事托底。",ea:"Establish authority first. Never be looked down on.",er:"You want to dominate. Fine, but the new ghost's fate: fright failed, work done. Authority needs real skill beneath."},
  {a:"请教老前辈，少走弯路",r:"你聪明：先找懂行的人问路。新死鬼也请教了——只是它学错了方向，你要学它求教，别学它吓人。",ea:"Ask the elders. Avoid the detours.",er:"You are wise: ask those who know first. The new ghost also asked, but learned the wrong lesson. Learn its asking, not its scaring."},
  {a:"凭感觉摸索，吃了亏再改",r:"你摸着石头过河。可以，但新死鬼推了一晚上磨才明白——有些亏，问一句就能省。",ea:"Feel my way, correct after mistakes.",er:"You cross the river by touch. Fine, but the new ghost only understood after grinding all night. Some losses one question would have saved."},
  {a:"既干活，也学着让人知道我在干活",r:"你懂分寸：干活是基础，被看见是能力。那个信佛人家，至少记住了「鬼推磨」的恩情。",ea:"Work, and learn to let my work be seen.",er:"You have the sense: work is the base, being seen is the skill. That devout house at least remembered the ghost that ground wheat."},
  {a:"觉得做鬼太累，想回去",r:"你想退缩。可以理解——但新死鬼要是回去了，就永远学不会做鬼。挺一挺，磨完这袋麦子就好了。",ea:"Being a ghost is too hard. Want to go back.",er:"You want to retreat. Understandable. But if the new ghost went back, it would never learn to be a ghost. Bear it; finish the sack of wheat."}
 ]},
{s:"《博物志 · 卷十》",t:"天河浮槎",img:"",
 o:"旧说云：天河与海通。近世有人居海渚者，年年八月有浮槎去来，不失期。人有奇志，立飞阁于槎上，多赍粮，乘槎而去。十余日中，犹观星月日辰，自后茫茫忽忽，亦不觉昼夜。去十余日，奄至一处，有城郭状，屋舍甚严。遥望宫中多织妇，见一丈夫牵牛渚次饮之。牵牛人乃惊问曰：「何由至此？」此人具说来意，并问此是何处。答曰：「君还至蜀郡，访严君平则知之。」竟不上岸，因还如期。后至蜀，问君平，曰：「某年月日，有客星犯牵牛宿。」计年月，正此人到天河时也。",
 w:"传说天河和大海相通。海边有人每年八月看到有木筏漂来漂去。有个有奇志的人备足粮食，乘着木筏出海，漂了十几天，到了一座城池——看见许多织女在织布，一个男子牵着牛在河边饮水。那人问他这是什么地方，牵牛人说：你回去问蜀郡的严君平就知道了。此人回来后去找严君平，严君平翻记录说：某年某月，有客星侵犯牵牛星。算算日期，正是他到达天河的时候。",
 u:"他乘一片木筏，漂到了牵牛星跟前——原来我们仰望的天河，不过是另一些人脚下的海。",
 q:"你还有没有那份「不知道通向哪里也要去看看」的好奇心？还是已经被日子磨平了？",
 en_s:"Bowuzhi · Scroll 10",en_t:"The Raft to the Milky Way",en_o:"An old saying: the Milky Way and the sea connect. In recent times a man lived on a sea islet; every year in the eighth month a raft came and went without fail. The man, of strange ambition, built a flying pavilion on the raft, loaded much grain, and went. For over ten days he watched the stars, moon, sun and seasons; after that all was dim and he knew not day from night. After more than ten days he suddenly reached a place with the shape of a city, with stern houses. Far off he saw many weaving women in the palace, and saw a man leading an ox to drink at the river's edge. The ox-herd asked in surprise: How did you come here? The man told his purpose and asked what place this was. The answer: Return to Shu and ask Yan Junping. He did not go ashore, but returned as expected. Later in Shu he asked Junping, who said: On such a year and day a guest star invaded the Oxherd asterism. Counting the dates, it was exactly when the man reached the Milky Way.",en_w:"It is said the Milky Way meets the sea. A man of strange ambition boarded the yearly raft, drifted over ten days, and reached a city of weaving maids and an ox-herd by the river. Told to ask Yan Junping of Shu, he returned, and Junping's records showed a guest star touching the Oxherd on the very day he arrived.",en_u:"He drifted on a single raft to the Oxherd's side. The Milky Way we gaze at is only another sea beneath other people's feet.",en_q:"Do you still have that curiosity to go and see where the road leads, even unknown? Or has life ground it flat?",opts:[
  {a:"有——不知道去哪，也要漂一漂",r:"你是那个乘槎人：备粮出海，不问归期。星河在脚下时，你才知道天有多宽——保持好奇，是你还没老的证据。",ea:"Yes. Even unknown, I would drift.",er:"You are the rafter: grain loaded, no question of return. Only when the Milky Way is under your feet do you know how wide the sky is. Curiosity is proof you have not aged."},
  {a:"没了——日子要紧，别瞎折腾",r:"你务实。可以，但乘槎人的故事提醒：海边年年有浮槎，就看你上不上——偶尔看一眼，也算没全丢。",ea:"Gone. Life is serious; no fooling around.",er:"You are practical. Fine. But the rafter's tale reminds: the raft comes every August. It only asks whether you board. Glance at it once in a while; that is not nothing."},
  {a:"怕回不来，不敢上槎",r:"你权衡风险。对，漂到牵牛星回不回得来真不好说——但严君平能查到记录，说明他回来了。有些冒险，比想象的安全。",ea:"Afraid of not coming back. Dare not board.",er:"You weigh the risk. True: whether one returns from the Oxherd is uncertain. But Junping had the record, which means he came back. Some adventures are safer than they look."},
  {a:"让别人去漂，我等着听故事",r:"你是听客。也可以——但你的孩子问「天上有什么」时，你只能转述别人的奇遇。",ea:"Let others drift. I will listen to stories.",er:"You are the listener. Also fine. But when your child asks what is up there, you can only retell another's adventure."},
  {a:"漂到一半就后悔了",r:"你会在半路怂。可以理解——但乘槎人没后悔，他问路、记日期、按时回来。后悔的人，错过的是牵牛人的回答。",ea:"Would regret it halfway.",er:"You would lose nerve midway. Understandable. But the rafter did not regret: he asked the way, marked the date, came home on time. The regretful miss the Oxherd's answer."},
  {a:"带着孩子一起漂",r:"你把好奇传下去。好——但记得像严君平那样记下日期，若干年后，孩子会拿着记录来对答案。",ea:"Bring the child along.",er:"You pass curiosity down. Good. But record the date like Junping. Years later the child will bring the record to check the answer."}
 ]},
{s:"《集异记 · 卷五》",t:"旗亭画壁",img:"",
 o:"开元中，诗人王昌龄、高适、王之涣齐名。时风尘未偶，而游处略同。一日天寒微雪，三诗人共诣旗亭，贳酒小饮。忽有梨园伶官十数人，登楼会宴。三诗人因避席隈映，拥炉火以观焉。俄有妙妓四辈，寻续而至……昌龄等私相约曰：「我辈各擅诗名，每不自定其甲乙，今者可以密观诸伶所讴，若诗入歌词之多者，则为优矣。」……三妓皆讴昌龄、高适之诗。之涣自以得名已久，因谓诸人曰：「此辈皆潦倒乐官，所唱皆巴人下里之词耳，岂阳春白雪之曲，俗物敢近哉？」因指诸妓之中最佳者曰：「待此子所唱，如非我诗，吾即终身不敢与子争衡矣。脱是吾诗，子等当须列拜床下，奉吾为师。」……须臾，次至双鬟发声，则曰：「黄河远上白云间，一片孤城万仞山。羌笛何须怨杨柳，春风不度玉门关。」",
 w:"开元年间，王昌龄、高适、王之涣齐名。一天微雪，三人去酒楼小饮，正遇梨园歌女唱诗。三人约定：看歌女们唱谁的诗多，谁就排第一。前几个歌女唱的都是王昌龄和高适的诗。王之涣指着最美的歌女说：等她唱，若唱的不是我的诗，我终身不与你们争高下；若是我的诗，你们要拜我为师。那歌女开口便唱：「黄河远上白云间，一片孤城万仞山……」——正是王之涣的《凉州词》。三人抚掌大笑。",
 u:"名气这东西，争不来，也压不住——它只在某个歌女开口的瞬间，自己落地。",
 q:"在才华被比较的场合（比稿、升职、朋友圈），你「排第几」？你还在意这个排名吗？",
 en_s:"Jiyiji · Scroll 5",en_t:"The Wine-Shop Wall Verses",en_o:"In the Kaiyuan era the poets Wang Changling, Gao Shi and Wang Zhihuan were equally famed. One cold day with light snow, the three poets went to a wine shop for a small drink. Suddenly a dozen entertainers of the Pear Garden came up to feast. The three poets withdrew aside and watched by the fire. Soon four lovely singers arrived. Changling and the others privately agreed: We each claim fame for poetry and never settle our order. Let us secretly watch which of our poems the singers perform; the one most sung is best. The first three sang Changling's and Gao Shi's poems. Zhihuan, thinking his fame long established, said: These are low entertainers singing common songs. Would vulgar things dare approach a song of the snowy heights? He pointed at the most beautiful singer: When she sings, if it is not my poem, I will never contend with you again. If it is mine, you must bow and call me teacher. Soon the double-coiled singer raised her voice: The Yellow River rises far into white clouds; a lone city amid ten-thousand-ren mountains. Why should the Qiang flute blame the willow? The spring wind never crosses the Jade Gate Pass.",en_w:"Wang Changling, Gao Shi and Wang Zhihuan, equally famed, met singers at a wine shop and agreed: the one whose poem is sung most ranks first. The first singers sang Changling and Gao Shi. Zhihuan pointed to the fairest singer: if she does not sing my poem, I yield forever; if she does, you bow to me as teacher. She sang his Liangzhou Verse. The three clapped and laughed.",en_u:"Fame cannot be fought for and cannot be suppressed. It lands by itself, the moment a singer opens her mouth.",en_q:"In arenas where talent is compared, pitch contests, promotions, feeds, where do you rank? Do you still care?",opts:[
  {a:"在意——但更在意作品本身",r:"你是王之涣：被压了一路，最后压轴的是他的诗。你信：名次会变，诗不会——所以你把力气花在写诗上，不是争名上。",ea:"I care, but more about the work itself.",er:"You are Wang Zhihuan: pressed all evening, and the finale was his poem. You believe ranks change; poems do not. So you spend strength on writing, not contending."},
  {a:"不太在意排名，写自己的",r:"你洒脱。可以，但王昌龄高适没在意，诗却流传了——不在意，也是一种把自己交给时间的自信。",ea:"Not much. Write my own.",er:"You are free. Fine. Changling and Gao Shi did not fuss, and their poems endured. Not caring is a kind of confidence that hands itself to time."},
  {a:"在意——输了会不服",r:"你胜负欲强。可以，但旗亭的故事里，三人最后抚掌大笑——那笑声比排名值钱。学着把输赢，笑过去。",ea:"I care. Losing stings.",er:"You are competitive. Fine. But in the wine-shop tale the three ended clapping. That laughter outlasts the ranking. Learn to laugh the win and loss away."},
  {a:"怕被比下去，不敢上场",r:"你躲着比较。可以理解，但旗亭的歌女不唱你的诗，不代表你没诗——你先得有诗，才谈得上唱不唱。",ea:"Afraid of being outshone. Dare not enter.",er:"You avoid comparison. Understandable. But the singers not performing your poem does not mean you have none. First have a poem, then speak of performance."},
  {a:"先记下谁唱了什么，回去复盘",r:"你是观察型：把比较当数据。对，三人复盘出了排名——但真正留到今天的，不是排名，是那首诗。",ea:"Note who sang what, and review after.",er:"You are the observer, turning comparison into data. Right: they reviewed a ranking. But what survives today is not the rank; it is the poem."},
  {a:"觉得比来比去没意思",r:"你觉得无谓。对，千年后没人记得当日谁第一——但《凉州词》还在。比名次更稳的，是留下作品。",ea:"Comparing is meaningless.",er:"You find it futile. Right: no one remembers who ranked first that day. But the Liangzhou Verse remains. A work outlasts a rank."}
 ]},
{s:"《史记 · 廉颇蔺相如列传》",t:"负荆请罪",img:"",
 o:"既罢归国，以相如功大，拜为上卿，位在廉颇之右。廉颇曰：「我为赵将，有攻城野战之大功，而蔺相如徒以口舌为劳，而位居我上。且相如素贱人，吾羞，不忍为之下。」宣言曰：「我见相如，必辱之。」相如闻，不肯与会。……居顷之，相如出，望见廉颇，相如引车避匿。……廉颇闻之，肉袒负荆，因宾客至蔺相如门谢罪，曰：「鄙贱之人，不知将军宽之至此也！」卒相与欢，为刎颈之交。",
 w:"蔺相如凭口舌之功拜为上卿，位在廉颇之上。廉颇不服，扬言要羞辱他。相如处处避让，门客不解。相如说：强秦不敢加兵于赵，是因为有我们两个——两虎相斗，必有一伤。廉颇听说后，肉袒负荆，到相如门前请罪。两人和好，成为刎颈之交。",
 u:"「负荆请罪」不是认怂，是认清了什么更贵重——国家的命，比自己的面子值钱。",
 q:"你拉得下脸去道歉吗？当「面子」和「大局」冲突，你背得起那根荆条吗？",
 en_s:"Shiji · Lian Po Lin Xiangru Liezhuan",en_t:"Carrying Thorns to Apologize",en_o:"When the embassy returned, Lin Xiangru, for his great merit, was made high minister, ranking above Lian Po. Lian Po said: I am a general of Zhao with great deeds of sieges and battles, while Xiangru has merit only by words, yet ranks above me. And he was once a lowly man; I am ashamed to be below him. He declared: When I see Xiangru, I will humiliate him. Xiangru heard and would not meet him. After a while Xiangru went out, saw Lian Po, and turned his carriage to avoid him. Lian Po, hearing this, bared his back, carried thorns, and through guests came to Xiangru's gate to apologize: A base fellow, I did not know you were so generous! In the end they rejoiced together and became friends who would die for each other.",en_w:"Lin Xiangru rose above Lian Po by his tongue. Lian Po, offended, vowed to shame him. Xiangru avoided him everywhere; his retainers wondered. Xiangru said: Strong Qin dares not attack Zhao because of us two. Two tigers fighting, one must fall. Lian Po heard this, bared his back with thorns, and came to apologize. They became fast friends.",en_u:"Carrying thorns is not surrender; it is recognizing what is more precious. The life of the state outweighs one man's face.",en_q:"Can you lower your face to apologize? When face and the greater good conflict, can you carry the thorns?",opts:[
  {a:"能——错了就认，背荆条去",r:"你是廉颇：肉袒负荆，上门请罪。认错不丢人，丢人的是明明错了还端着——你背起荆条那一刻，比打了胜仗还硬气。",ea:"Yes. Wrong is wrong; carry the thorns and go.",er:"You are Lian Po: bared back, thorns on, apology at the gate. Admitting wrong is no shame; the shame is holding on while wrong. The moment you carry the thorns, you stand taller than any victory."},
  {a:"认错，但心里别扭",r:"你肯认，但不痛快。可以，廉颇也是想了很久才去的——认错是过程，放下才是结果。",ea:"Admit wrong, but uneasy.",er:"You admit but without ease. Fine. Lian Po also took long to go. Admitting is a process; letting go is the result."},
  {a:"拉不下脸——算了，冷战吧",r:"你端着。可以理解，但廉颇要是一直端着，赵国就亡了——你的「大局」经得起几次冷战？",ea:"Cannot lower my face. Cold war then.",er:"You hold on. Understandable, but had Lian Po held on, Zhao would have fallen. How many cold wars can your greater good survive?"},
  {a:"看谁错得多，他先道歉我才道",r:"你讲对等。可廉颇是错的更狠的那个——先低头的人，不一定错得更多，只是把「我们」看得更重。",ea:"Depends who erred more. He apologizes first.",er:"You want parity. But Lian Po was the more wrong. The one who bows first is not necessarily more wrong; he values the we more."},
  {a:"用行动道歉，不说「对不起」",r:"你含蓄。可以，相如最后也不是听他说了什么，是看他来了——行动派的道歉，一样算数。",ea:"Apologize by deeds, not words.",er:"You are understated. Fine. Xiangru finally trusted not his words but his coming. A doer's apology counts too."},
  {a:"觉得没必要和好，各过各的",r:"你觉得惹不起躲得起。可赵国就那么大，将相不和，强秦就来了——有些「躲」，躲到最后是连躲的地方都没了。",ea:"No need to reconcile. Live apart.",er:"You think avoiding works. But Zhao was only that big. General and minister at odds, and strong Qin came. Some avoiding ends with no place to avoid to."}
 ]},
{s:"《史记 · 越王勾践世家》",t:"卧薪尝胆",img:"",
 o:"吴既赦越，越王勾践反国，乃苦身焦思，置胆于坐，坐卧即仰胆，饮食亦尝胆也。曰：「女忘会稽之耻邪？」身自耕作，夫人自织，食不加肉，衣不重采，折节下贤人，厚遇宾客，振贫吊死，与百姓同其劳。",
 w:"吴王夫差赦免了越国，越王勾践回到越国后，苦身焦思：把苦胆挂在座位上方，坐卧时抬头就尝一口，吃饭时也尝尝——提醒自己：你忘了会稽之耻吗？他亲自耕种，夫人亲自织布，吃饭不加肉，穿衣不穿彩色，礼贤下士，与百姓同甘共苦。二十年后，终于灭了吴国。",
 u:"卧薪尝胆不是自虐，是把自己变成一件「复仇的工具」——恨意是他熬过二十年的火，也是他这一生都烧不尽的疤。",
 q:"为了一件事（目标、翻身、雪耻），你能忍住多久的「苦日子」？你心里那枚苦胆，还挂着吗？",
 en_s:"Shiji · Yue Wang Goujian Shijia",en_t:"Sleeping on Brushwood, Tasting Gall",en_o:"Wu having pardoned Yue, King Goujian returned to his state, and afflicted his body and tormented his mind, placing a gall bladder in his seat; sitting or lying he looked up to taste it, and at meals he tasted it too, saying: Have you forgotten the shame of Kuaiji? He himself plowed, his wife wove, his food had no meat, his clothes no colors; he lowered himself to worthy men, treated guests generously, relieved the poor, mourned the dead, and shared the toil of the people. Twenty years later, he destroyed Wu.",en_w:"King Goujian of Yue, pardoned by Wu, hung a gall bladder by his seat, tasting it at every meal to remember the shame of Kuaiji. He farmed himself, his wife wove, no meat, no colors, honoring the worthy, sharing the people's toil. Twenty years later he destroyed Wu.",en_u:"Sleeping on brushwood and tasting gall is not self-torture; it is making yourself a tool of revenge. The hatred was the fire that kept him twenty years, and the scar that never healed.",en_q:"For one goal, a comeback, a vindication, how long can you bear the bitter days? Is your gall still hanging?",opts:[
  {a:"挂着——每天尝一口，不忘",r:"你是勾践：苦胆挂梁，坐卧仰胆。你信「不忘」的力量——只是要记得，尝胆是为了翻身，不是为了让自己苦一辈子。",ea:"Hanging. Taste it daily; never forget.",er:"You are Goujian: gall overhead, tasting at every turn. You believe in not-forgetting. Only remember: the gall is for turning around, not for bittering a lifetime."},
  {a:"尝过，后来摘了",r:"你痛过、忘过。可以理解——但勾践二十年不摘胆，靠的不是记性，是那口气。你摘了胆，那口气还在吗？",ea:"Tasted it once. Took it down.",er:"You ached and forgot. Understandable. But Goujian kept it twenty years by breath, not memory. You took it down. Is the breath still there?"},
  {a:"不吃苦，找捷径",r:"你务实。可以，但勾践的捷径（献西施、赂伯嚭）他也用了——先低头再翻身，本身就是一种「捷径」。",ea:"No suffering. Find a shortcut.",er:"You are practical. Fine. But Goujian used shortcuts too: the beauty, the bribe. Bowing first to rise later is itself a shortcut."},
  {a:"苦日子可以过，但心里要有个盼头",r:"你清醒：卧薪是手段，复国是目的。对，勾践心里有会稽之耻这个「盼头」——你也要有个方向，不然苦就白吃了。",ea:"Bitter days are bearable if there is hope ahead.",er:"You are clear: brushwood is a means, restoration the end. Right: Goujian's hope was the shame of Kuaiji. You need a direction too, or the bitterness is wasted."},
  {a:"怕苦怕到不敢开始",r:"你被「二十年」吓住了。可以理解——但勾践也不是一口气忍二十年，是每天只忍一天。你也试试：先忍今天。",ea:"The twenty years frighten me. Dare not begin.",er:"The twenty years scare you. Understandable. But Goujian did not bear twenty years at once; he bore one day at a time. Try: bear today."},
  {a:"觉得恨着活太累",r:"确实累。勾践灭吴后，范蠡走了，文种死了——靠恨撑起来的人，翻身之后往往空落落的。你可以不选恨，选目标。",ea:"Living on hatred is too tiring.",er:"It is. After Goujian destroyed Wu, Fan Li left and Wen Zhong died. Those propped by hatred often feel hollow after the rise. You need not choose hatred. Choose a goal."}
 ]},
{s:"《幽明录 · 卷四》",t:"新死鬼",img:"",
 o:"有新死鬼，形疲瘦顿。忽见生时友人，死及二十年，肥健，相问讯曰：「卿那尔？」曰：「吾饥饿殆不自任，卿知诸方便，故当以法见教。」友鬼云：「此甚易耳。但为人作怪，人必大怖，当与卿食。」……新鬼大喜，即便辞去。乃至一家，奉佛精进，屋西厢有磨，鬼便上椎之，如人推磨。此人见之，便语家人曰：「佛怜我家贫，令鬼推磨。」乃辇麦与之。至夕，磨数斛，疲顿乃去。",
 w:"有个新死的鬼，又累又饿。遇到死去二十年的老鬼，老鬼教他：你去吓人，人一害怕就会给你吃的。新鬼大喜，去了一家信佛的人家，上磨推磨。主人见了说：佛可怜我家穷，派鬼来推磨！于是给他麦子磨。鬼磨了好几斛，累得半死才走——吓人没吓成，反而当了免费劳力。",
 u:"新鬼想靠「吓人」吃饭，结果被当成「佛的恩赐」——这世上最远的弯路，是以为别人会怕你，其实人家只是把你当工具。",
 q:"你刚进入一个新环境（新工作、新圈子）时，是想着「镇住别人」，还是先老实干活？",
 en_s:"Youming Lu · Scroll 4",en_t:"The Newly Dead Ghost",en_o:"There was a newly dead ghost, thin and weary. Suddenly he saw a friend from life, dead some twenty years, fat and healthy. The friend asked: How are you so? The new ghost said: I am near starving and cannot bear it. You know the ways; teach me. The old ghost said: This is easy. Just make mischief for people; they will be terrified and give you food. The new ghost rejoiced and left. He came to a devout Buddhist house with a mill in the west wing. The ghost climbed on the mill and turned it like a man. Seeing this, the master said to his family: Buddha pities our poverty and sends a ghost to turn the mill. He brought wheat. That evening the ghost ground several hu of grain, weary, and left.",en_w:"A newly dead ghost, starving, asked a twenty-year-old ghost how to get food. Scare people, said the old ghost. The new ghost went to a devout house and started turning their mill. The master said: Buddha sends a ghost to grind our wheat! He fed it work all evening. The ghost left exhausted, having been free labor.",en_u:"The new ghost hoped to live by fright; he ended up being taken for a gift from Buddha. The longest detour is believing others fear you, when they only use you as a tool.",en_q:"Entering a new environment, a new job, a new circle, do you try to awe them, or quietly do the work?",opts:[
  {a:"先老实干活——让人看到我的价值",r:"你是那个「推磨」的鬼：本想着吓人，结果磨了麦子。但主人因此记住了它——踏实干活，比吓人管用。",ea:"Work quietly first. Let them see my value.",er:"You are the grinding ghost: meant to scare, ended up grinding wheat. But the master remembered it. Steady work beats fright."},
  {a:"先立威——不能让人小看",r:"你想镇场子。可以，但新死鬼的下场是：吓人没吓成，活没少干——立威要有真本事托底。",ea:"Establish authority first. Never be looked down on.",er:"You want to dominate. Fine, but the new ghost's fate: fright failed, work done. Authority needs real skill beneath."},
