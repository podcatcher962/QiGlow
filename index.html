 en_s:"Liaozhai Zhiyi · Scroll 1",en_t:"The Taoist of Lao Mountain",en_o:"In the county there was a student, Wang, seventh in his family, son of an old house. From youth he admired the Way; hearing that Lao Mountain had many immortals, he packed his book-bag and went. Climbing a peak, he found a temple, very secluded. A Taoist sat on a rush mat, white hair hanging to his collar, but with a shining, spirited countenance. Wang said: I have labored for many days, master; teach me a small art, so that this visit is not in vain. The Taoist asked: What art do you seek? Wang said: I often see that walls cannot stop you, master. If I could only learn that, it would be enough. The Taoist smiled and agreed. He taught him the formula and told him to chant it, then called: Enter! Wang faced the wall and dared not go in. Again: Try entering. Wang entered leisurely, but stopped at the wall. The Taoist said: Lower your head and rush in; do not hesitate! Wang stepped back a few paces and rushed at the wall; reaching it, it was empty as air, and looking back, he was indeed outside. Overjoyed, he went in to thank him. The Taoist said: When you return, keep yourself pure and disciplined; otherwise the art will not work. Wang secretly rejoiced, thinking he had the art. At home, he boasted to his wife: I have learned something in these months! He chanted the formula and rushed at the wall. His head struck hard wall; he fell. His wife helped him up; on his forehead a lump had risen like a great egg.",en_w:"A Taoist of Lao Mountain could pass through walls. Wang the student learned nothing but this one trick, and it worked. The Taoist warned: keep pure at home, or it will fail. Wang boasted to his wife, chanted, and charged the wall. His head struck it; a lump rose like an egg.",en_u:"Wall-walking is real. But take it as a shortcut, and it will raise a lump on your head. The art does not deceive; you deceive yourself.",en_q:"Have you ever boasted a half-learned skill as mastery, and crashed? Do you still show off now?",opts:[
  {a:"翻过车，现在不敢了",r:"那个「巨卵」你额头上还留着。疼过就知道：术要练，更要守——你现在比王生强，因为你连墙都不乱撞了。",ea:"Crashed. Not daring to show off anymore.",er:"The great egg is still on your forehead. Having learned the pain, you know: art must be practiced, and kept. You are stronger than Wang now; you do not even charge walls."},
  {a:"还在显摆，没撞过墙",r:"你运气好，还没撞上硬壁。崂山道士的话听进去：洁持则验，不洁则败——别等起包才信。",ea:"Still showing off. Have not crashed yet.",er:"You are lucky; no hard wall yet. Hear the Taoist: keep pure and it works; tainted and it fails. Do not wait for the lump to believe."},
  {a:"我不学穿墙，我学踏实的本事",r:"你是聪明人：学功课、学手艺、学真东西。王生求速成，你求根底——几年后，王生的包还肿着，你的墙已经通了。",ea:"I do not learn wall-walking. I learn real skills.",er:"You are the wise one: lessons, crafts, real things. Wang sought shortcuts; you seek foundations. Years later, Wang's lump still swells; your wall is already open."},
  {a:"学了皮毛就敢教别人",r:"你自己撞了包，还顺便教人撞包。要么真去把功夫练扎实，要么诚实说「我只学到这点」——误人子弟，包会长在良心上。",ea:"Learned a little and started teaching others.",er:"You crash yourself and teach others to crash. Either train for real, or honestly say I only know this much. Misleading students grows a lump on your conscience."},
  {a:"穿墙不成，但撞墙的样子够好笑",r:"你把翻车当成段子讲给大家听。这一手比王生高明——自己笑自己，别人就笑不起来了。",ea:"Failed the wall, but my crash is funny enough.",er:"You turn the crash into a story and tell it well. That is higher than Wang: laugh at yourself first, and others cannot laugh at you."},
  {a:"觉得王生只是没练够，不是术的问题",r:"你说到了关键：术是真的，人是假的。想速成的心，才是那堵撞不破的墙。",ea:"Wang just did not practice enough. The art itself is fine.",er:"You touch the key: the art is real, the person is false. The shortcut-seeking heart is the wall that cannot be broken."}
 ]},
{s:"《聊斋志异 · 卷一》",t:"画皮",img:"tale_19.jpg",
 o:"太原王生，早行，遇一女郎，抱袱独奔，甚艰于步。……女曰：「父母贪赂，鬻妾朱门。嫡妒甚，朝詈而夕楚辱之，所弗堪也，将远遁耳。」……生喜，微窥之，见一狞鬼，面翠色，齿巉巉如锯。铺人皮于榻上，执彩笔而绘之；已而掷笔，举皮，如振衣状，披于身，遂化为女子。",
 w:"太原王生清晨赶路，遇到一个美貌女子，说被父母卖给大户人家，受正妻虐待逃了出来。王生心动，带她回家。后来他偷偷窥看，只见一个青面獠牙的恶鬼，把一张人皮铺在榻上，拿彩笔描画，画完提起人皮像穿衣服一样披在身上，就变成了那个女子。",
 u:"画皮之可怕，不在那张皮，在它画得太好——好到你明知是假，也舍不得揭。",
 q:"你有没有遇到过「披着好皮」的人或事——包装完美、人人夸赞，但你心里隐隐觉得不对劲？",
 en_s:"Liaozhai Zhiyi · Scroll 1",en_t:"The Painted Skin",en_o:"Wang Sheng of Taiyuan was walking early when he met a young woman, carrying a bundle, walking alone and with difficulty. The woman said: My parents, greedy for a bride-price, sold me into a rich house. The first wife is fiercely jealous; scolding by day and beating by night. I cannot bear it, and am fleeing far away. Wang Sheng, delighted, took her home. Later he peeped at her and saw a hideous ghost, with a green face and saw-like teeth. It spread a human skin on the bed, took a colored brush and painted it; then threw down the brush, lifted the skin like a garment, and put it on. It became the woman.",en_w:"Wang Sheng met a beauty on the road, said to be fleeing a cruel household, and took her home. Peeping later, he saw a green-faced ghost spreading a human skin on the bed and painting it with a brush; it lifted the skin, draped it on, and became the woman.",en_u:"The horror of the painted skin is not the skin. It is that it is drawn so well, so well that knowing it false, you cannot bear to tear it.",en_q:"Have you met a person or thing with a perfect skin, everyone praising it, while a small voice inside you says something is off?",opts:[
  {a:"直觉不对劲，就悄悄远离",r:"你信自己的第六感。王生要是有你这根弦，早就绕路了——可惜人总被皮吸引，不信直觉。",ea:"Trust the instinct. Drift quietly away.",er:"You trust your sixth sense. With your nerve, Wang Sheng would have taken the other road. But people are drawn to skins and ignore instincts."},
  {a:"当面揭穿，撕给他看",r:"你是道士型的猛人。撕皮痛快，但也要看清：揭完皮，屋里有没有能镇住鬼的拂尘？",ea:"Tear it off to their face.",er:"You are the Taoist-type. Tearing the skin is satisfying, but first check: after the tear, is there a whisk in the room to subdue the ghost?"},
  {a:"先调查清楚再说",r:"你不轻信，也不莽撞——查背景、看细节、找人验证。画皮最怕你这样认真的人。",ea:"Investigate first. Then decide.",er:"You neither trust nor rush: check backgrounds, details, verify with people. Painted skins fear a serious man like you."},
  {a:"被皮迷住，明知道也放不下",r:"你是王生。那皮画得太好，你舍不得揭——那就别怪鬼半夜掏心。有些美人，是要命的那种。",ea:"Charmed by the skin. Know it is false, cannot let go.",er:"You are Wang Sheng. The skin is drawn too well; you cannot bear to tear. Then do not blame the ghost for taking your heart at midnight. Some beauties are the deadly kind."},
  {a:"觉得自己能感化它",r:"你想给鬼一个机会。菩萨心肠，但画皮鬼不吃这套——感化之前，先确认它没有刀。",ea:"Think I can reform it.",er:"You have a bodhisattva heart. But painted-skin ghosts do not eat that. Before reforming it, make sure it has no knife."},
  {a:"处处提防，但也怕冤枉好人",r:"你活在「万一是真的好看」的纠结里。折中的办法：保持距离看久了——皮会旧，鬼会露。",ea:"On guard always, but afraid of wronging the good.",er:"You live in the tangle of what if it is really beautiful. The middle way: watch from a distance long enough. Skins age; ghosts show."}
 ]},
{s:"《聊斋志异 · 卷四》",t:"促织",img:"tale_20.jpg",
 o:"宣德间，宫中尚促织之戏，岁征民间。此物故非西产；有华阴令欲媚上官，以一头进，试使斗而才，因责常供。令以责之里正。市中游侠儿得佳者笼养之，昂其直，居为奇货。里胥猾黠，假此科敛丁口，每责一头，辄倾数家之产。……成名操童子业，久不售。为人迂讷，遂为猾胥报充里正役，百计营谋不能脱。不终岁，薄产累尽。",
 w:"明朝宣德年间，宫里流行斗蟋蟀，年年向民间征收。华阴县令为讨好上司进贡了一只好蟋蟀，从此成了常例。猾吏借机盘剥，每征一头蟋蟀，就有好几户人家倾家荡产。老实巴交、考不上功名的成名被推上去当里正，不到一年，薄薄的家产赔了个干净。",
 u:"上面要一只蟋蟀，下面赔上多少条命——规则荒诞时，最老实的人最先被碾碎。",
 q:"当你发现规则本身荒诞（KPI 无意义、形式主义、层层加码），而你恰恰是链条上最弱的一环——你会怎么活？",
 en_s:"Liaozhai Zhiyi · Scroll 4",en_t:"The Cricket",en_o:"In the Xuande era of the Ming, the palace prized the sport of cricket-fighting and levied crickets from the people every year. This creature was not native to the west. A magistrate of Huayin, wishing to please his superior, presented one, and since it fought well, it was made a standing levy. The magistrate charged the village headmen. Unemployed youths kept fine ones in cages, hoarding them as rare goods. The crafty clerks used this to levy tribute and squeeze the people; every cricket demanded cost several households their whole fortunes. Cheng Ming, a scholar who had long failed the examinations, was honest and awkward, and was reported by the crafty clerks to serve as village headman. He schemed by every means to escape but could not. Within a year, his thin fortune was exhausted.",en_w:"In the Ming, the palace loved cricket fights and levied crickets yearly. A magistrate pleased his superior with one fine cricket, and it became a standing tax. Clerks squeezed the people; each cricket cost several families their fortunes. The honest scholar Cheng Ming was forced into the headman post and lost his whole small estate within a year.",en_u:"Above, they want one cricket. Below, they lose how many lives? When the rule itself is absurd, the most honest are ground first.",en_q:"When you find the rule itself absurd, meaningless KPIs, formalism, layer upon layer, and you are the weakest link in the chain, how do you live?",opts:[
  {a:"硬扛，扛到扛不动为止",r:"你是成名——迂讷、老实、逆来顺受。你也许等不来儿子变蟋蟀的奇遇，但你能守住一口气，比献媚的人干净。",ea:"Bear it. Bear it until you cannot.",er:"You are Cheng Ming: honest, awkward, resigned. You may not get the son-turned-cricket miracle, but you keep one breath cleaner than the flatterers."},
  {a:"想办法钻个空子活下去",r:"你学里胥的活法——盘算、周旋、给自己留后路。不光彩，但乱世里，先活着才能谈别的。",ea:"Find a loophole to survive.",er:"You learn the clerk's way: scheme, maneuver, keep a back door. Not glorious, but in chaos, living comes first."},
  {a:"想办法离开这个系统",r:"你选择逃离——换行、躺平、远走。成名走不了，你有脚，能走多远走多远。",ea:"Find a way out of the system.",er:"You choose escape: change trade, lie flat, move far. Cheng Ming could not leave. You have legs; walk as far as you can."},
  {a:"联合一样被压的人反抗",r:"你信人多力量大。可是别忘了，蟋蟀案里最先死的，往往是领头那只——反抗要算好代价。",ea:"Unite with the equally crushed and resist.",er:"You believe in strength in numbers. But remember: in the cricket case, the first to die was often the leading one. Reckon the price before resisting."},
  {a:"忍，但把下一代的路铺好",r:"你为子女谋——倾家荡产也要供孩子读书、学本事。成名抓蟋蟀是为了交差，你是为了让孩子不用抓蟋蟀。",ea:"Endure, but pave the road for the next generation.",er:"You plan for your children: exhaust the estate to school them, teach them skills. Cheng Ming caught crickets to pay the levy. You do it so your children never have to."},
  {a:"把自己的命看得比蟋蟀重",r:"你是清醒的那个：不为一头蟋蟀赔上全家。官府要蟋蟀，你给得起就凑，给不起就装死——蟋蟀会死，你不能死。",ea:"Value my own life above the cricket.",er:"You are the clear-eyed one: do not ruin the family for one cricket. The office wants a cricket; give what you can, feign death if you must. Crickets die. You must not."}
 ]},
{s:"《聊斋志异 · 卷二》",t:"聂小倩",img:"tale_21.jpg",
 o:"宁采臣，浙人。性慷爽，廉隅自重。……既而月落星稀，起归寓。至斋外，见一女子，徘徊户外，问之曰：「夜来何来？」女曰：「妾与君同居，何云来也？」……女笑曰：「月夜不寐，愿修燕好。」宁正容拒之曰：「卿防物议，我畏人言；略一失足，廉耻道丧。」……小倩曰：「此婢子皆以其夜，遇之者莫不毙。妾所恋恋者，唯君一人，望君救我！」",
 w:"宁采臣为人廉正。夜里有女子来敲门，自称聂小倩，想与他共度良宵。宁采臣正色拒绝：你怕人说闲话，我怕人言——失足一次，廉耻尽丧。后来小倩含泪相告：我本是被恶鬼胁迫的亡魂，每晚骗人色授魂与，再取人心肝；唯有你拒我，我斗胆求你救我。宁采臣依言移棺安葬，小倩随他回家，终得解脱。",
 u:"拒绝她，不是看轻她，是恰恰救了她——原来廉正，可以是另一条命的路。",
 q:"当一个人身不由己地做坏事（被胁迫、被裹挟、被环境推着），却向你求救——你救不救？",
 en_s:"Liaozhai Zhiyi · Scroll 2",en_t:"Nie Xiaoqian",en_o:"Ning Caichen was a man of Zhejiang, generous and open-hearted, scrupulous of his honor. When the moon set and stars thinned, he rose to return to his lodgings. Outside the study he saw a woman pacing about. He asked: Why do you come at night? The woman laughed: Since I share this lodging with you, why say come? The woman smiled: On a moonlit night I cannot sleep; I would gladly be your lover. Ning refused with a stern face: You fear gossip; I fear rumor. One misstep and honor is lost. Xiaoqian then said: All who met these maids at night have died. The only one I cling to is you, sir. I beg you to save me!",en_w:"Ning Caichen, a man of integrity, was visited at night by a beauty named Nie Xiaoqian. She offered herself; he refused with a stern face. She wept and confessed: I am a dead soul coerced by a demon, luring men to their death each night. Only you refused me. Save me. He did, and she was freed.",en_u:"Refusing her was not despising her. It was exactly what saved her. Integrity can be the road another life walks free.",en_q:"When someone does wrong against their will, coerced, dragged along, pushed by circumstance, and begs you for help, do you save them?",opts:[
  {a:"救，先听她把话说完整",r:"你信「恶鬼也有苦衷」。救人要有本事兜底——宁采臣救了，靠的是剑客和棺木，不是一腔热血。",ea:"Save them. Hear the whole story first.",er:"You believe even evil ghosts have grievances. Saving needs the skill to back it up: Ning saved her with a swordsman and a coffin, not hot blood alone."},
  {a:"先自保，再做打算",r:"你把自己放前面——这是合理的谨慎。但小倩等的就是那句「我救你」，你晚一步，她就被鬼吞了。",ea:"Protect myself first. Then decide.",er:"You put yourself first. Reasonable caution. But Xiaoqian was waiting for the words I save you. One step late and the ghost swallows her."},
  {a:"只帮能帮的，不过界",r:"你画出边界：送她安葬可以，替她挡鬼不行。清醒，但你可能也会错过「顺手成全一段新生」的机会。",ea:"Only help what I can. Do not cross the line.",er:"You draw borders: bury her, yes; fight the demon for her, no. Clear, but you may also miss the chance to complete a new life."},
  {a:"劝她自首/向善，但不插手",r:"你给建议，不扛因果。对，可小倩需要的是行动——一句「你应该反抗」，她几百年前就想过了。",ea:"Advise her to repent, but do not get involved.",er:"You give advice, not consequences. Right. But Xiaoqian needed action. A sentence of you should resist was thought of centuries ago."},
  {a:"怀疑她在做局，不轻易信",r:"你见过太多「小倩」——防人之心是护身符。只是你要准备好：真小倩来的时候，你也会当她是画皮。",ea:"Suspect a trap. Do not trust easily.",er:"You have seen too many Xiaoqians. Wariness is your amulet. But be ready: when a real Xiaoqian comes, you will take her for a painted skin."},
  {a:"救，但带上帮手和准备",r:"你是最稳的宁采臣——不是孤身赴险，而是请剑客、查底细、备棺木。救人要救彻，救完还要送她走完余生。",ea:"Save them, but bring help and preparation.",er:"You are the steadiest Ning Caichen: not going alone, but hiring the swordsman, checking the facts, preparing the coffin. Save fully, and see them through the rest of their life."}
 ]},
{s:"《聊斋志异 · 卷二》",t:"婴宁",img:"tale_22.jpg",
 o:"婴宁，狐产女，少孤。……吴生曰：「婴宁，狐女也，自幼随鬼母生长，性甚憨，不识人情。」……良久，闻户外隐有笑声。媪又唤曰：「婴宁，汝姨兄在此。」户外嗤嗤笑不已。婢推之以入，犹掩其口，笑不可遏。……然笑处嫣然，狂而不损其媚。",
 w:"婴宁是狐母所生、鬼母带大的女孩，天性烂漫，最爱笑。王家表哥来见她，她躲在外面嗤嗤笑个不停，被推进来还掩着口笑得直不起腰。她见人便笑、遇事便笑，那种笑天真烂漫，狂放却不减妩媚。后来她进了王家，人们都爱她，家里再没有忧愁的样子。",
 u:"一个「不识人情」的笑，抵过满屋子的规矩——成年人的世界太早学会了收声，才格外想念那声嗤嗤。",
 q:"你上一次「完全不管别人怎么看」地开怀大笑，是什么时候？那个爱笑的你，还在吗？",
 en_s:"Liaozhai Zhiyi · Scroll 2",en_t:"Yingning",en_o:"Yingning was born of a fox, orphaned young. The scholar Wu said: Yingning is a fox girl, raised from childhood by a ghost mother, simple by nature, knowing nothing of the ways of the world. After a long while, from outside the door came the sound of hidden laughter. The old woman called again: Yingning, your cousin is here. From outside the door came giggles that would not stop. The maid pushed her in, and she still covered her mouth, unable to stop laughing. Yet her smile was charming, wild without losing its grace.",en_w:"Yingning, fox-born and ghost-raised, was the most artless of girls, loving laughter. When her cousin came, she giggled outside the door and could not stop. Pushed in, she still covered her mouth. Her smile was wild yet graceful. Later she entered the Wang household, and everyone loved her; the house knew no more sorrow.",en_u:"One artless laugh outweighs a house full of rules. The adult world learns to hush itself too early; that is why we miss the giggle.",en_q:"When did you last laugh out loud with no care for what anyone thought? Is that laughing self still there?",opts:[
  {a:"还在——我笑起来很疯",r:"你是成年婴宁。旁人笑你傻，你笑旁人愁——这份狂笑不损你的媚，只让懂你的人更爱你。",ea:"Still there. I laugh wildly.",er:"You are an adult Yingning. Others call you silly; you laugh at their worries. The wild laugh does not lose your grace; it only makes those who understand you love you more."},
  {a:"在熟人面前才放得开",r:"你给笑上了锁，只对信得过的人开。可以理解，但小心锁太久，钥匙会锈。",ea:"Only relaxed around close friends.",er:"You have locked laughter and open the lock only for the trusted. Understandable, but beware: keep the lock long and the key rusts."},
  {a:"很久没真的笑过了",r:"生活把你磨成了收声的人。婴宁不是不懂愁，她是选择笑——你选回来一天试试，明天见人先笑三声。",ea:"It has been long since I truly laughed.",er:"Life has ground you into a hushed person. Yingning knew sorrow too; she chose laughter. Try one day: greet someone tomorrow with three laughs."},
  {a:"觉得笑不笑看场合，稳重才好",r:"你是大人模样。稳重是好的，只是太稳重的人，容易让人忘记他也曾是个孩子——偶尔露一手，关系会活。",ea:"Depends on the occasion. Steadiness is better.",er:"You are the adult figure. Steadiness is good, but overly steady people make others forget they were once children. Show it once in a while; relationships come alive."},
  {a:"想笑但不敢，怕被当傻子",r:"你怕「不识人情」的评语。可婴宁恰恰因为不在乎，才成了所有人宠着的那一个——你敢试一次吗？",ea:"Want to laugh but dare not. Afraid of being called a fool.",er:"You fear the judgment of knowing nothing of the world. But Yingning was loved precisely because she did not care. Dare one try?"},
  {a:"心里在笑，脸上不动",r:"你是内敛型——笑意藏在眼底。也挺好，闷骚的婴宁，也是婴宁。",ea:"Laughing inside, face still.",er:"You are the restrained type, laughter in the eyes. Also fine. A reserved Yingning is still Yingning."}
 ]},
{s:"《幽明录 · 卷五》",t:"刘阮天台",img:"",
 o:"汉明帝永平五年，剡县刘晨、阮肇共入天台山取谷皮，迷不得返。经十三日，粮食乏尽，饥馁殆死。遥望山上有一桃树，大有子实，而绝岩邃涧，永无登路。攀援藤葛，乃得至上。各啖数枚，而饥止体充。复下山，持杯取水，见芜菁叶从山腹流出，甚鲜新，复一杯流出，有胡麻饭糁，相谓曰：「此知去人径不远。」便共没水，逆流二三里，得度山，出一大溪。溪边有二女子，姿质妙绝……至暮，令各就一帐宿，女往就之，言声清婉，令人忘忧。……遂停半年。气候草木是春时，百鸟啼鸣，更怀悲思，求归甚苦。女曰：「罪牵君当可如何？」遂呼前来女子，有三四十人，集会奏乐，共送刘阮，指示还路。既出，亲旧零落，邑屋改异，无复相识。问讯得七世孙，传闻上世入山，迷不得归。",
 w:"刘晨和阮肇进天台山采药迷了路，饿得几乎要死，摘了山顶的桃子充饥，又顺着溪水逆流而上，遇到两位仙女。她们留二人住了半年，锦衣玉食，夜夜欢歌，让人忘了忧愁。半年后他们想家，执意要走。仙女送他们出山——回到人间，亲戚旧友都已零落，房屋全变，无人相识。打听才知道，已经过了七世。",
 u:"天上半年，人间七世。你以为是短暂停留，回来才发现，你欠下的时间，已经无人可还。",
 q:"如果有一段「太舒服」的时光/关系/状态，让你忘了时间——你会一直待着，还是提醒自己「该回去了」？",
 en_s:"Youming Lu · Scroll 5",en_t:"Liu Ruan on Mount Tiantai",en_o:"In the fifth year of Yongping of the Han, Liu Chen and Ruan Zhao of Shan County entered Mount Tiantai to gather bark, and lost their way, unable to return. After thirteen days, their food was gone and they were near starving. Far off on the mountain they saw a peach tree heavy with fruit, but it stood across sheer cliffs and deep ravines with no road at all. Clinging to vines they climbed up. Each ate several peaches, and hunger ceased and strength returned. Descending, they took cups to fetch water and saw turnip leaves flowing out from the mountain's belly, very fresh, and then another cup flowed out, with husked sesame rice in it. They said to each other: This shows we are not far from human habitation. They waded upstream two or three li, crossed the mountain, and came out at a great stream. By the stream stood two women of surpassing beauty. At dusk, they were led to sleep in separate tents; the women came to them, their voices clear and sweet, and made men forget their cares. They stayed half a year. The climate and plants were spring; a hundred birds sang, and they grew homesick and begged hard to return. The women said: Fate holds you; what can we do? They summoned the girls of before, thirty or forty in all, and held a music gathering to see Liu and Ruan off, pointing the way back. When they came out, kin and old friends were scattered, houses and streets all changed, and none knew them. Inquiring, they found descendants of the seventh generation, who said that their ancestors had gone into the mountain and never returned.",en_w:"Liu Chen and Ruan Zhao lost their way in Mount Tiantai, ate peaches from a cliff, and followed the stream to two beautiful maidens who kept them half a year in luxury and music. Homesick, they insisted on returning. The maidens saw them off. Back in the human world, kin had scattered, houses changed; they had been gone seven generations.",en_u:"Half a year in heaven, seven generations in the world. You think it a short stay; you come back to find the time you owed has no one left to repay.",en_q:"If a too-comfortable stretch of time, a relationship, a state, makes you forget the clock, do you stay, or remind yourself it is time to go back?",opts:[
  {a:"一直待着，舒服就好",r:"你选留在仙境。没什么不对——但你要知道，人间不会等你，七世之后，无人相识的感觉会来找你。",ea:"Stay. Comfort is enough.",er:"You choose to remain in fairyland. Nothing wrong with it. But know this: the human world will not wait. Seven generations later, the strangeness of being known by none will find you."},
  {a:"待一阵，然后坚决回去",r:"你是刘阮：享过福，还是挂念人间。半年归去，哪怕亲旧零落——你宁可要真的疼，也不要假的甜。",ea:"Stay a while, then firmly return.",er:"You are Liu and Ruan: you enjoyed the bliss, but still missed the human world. Returning even to scattered kin, you prefer real pain to false sweetness."},
  {a:"待着，但定期回人间看看",r:"你想两头都要。可惜仙凡之间没有班车——你这点算计，仙女早就看穿了。",ea:"Stay, but visit the human world regularly.",er:"You want both. But there is no shuttle between immortal and mortal. That little calculation of yours was long seen through by the maidens."},
  {a:"从一开始就惦记着回去的时间",r:"你连快乐都要计日程功。放松点——仙女留你，是看你真开心，不是看你会不会划日历。",ea:"Keep an eye on the return date from the start.",er:"You count the days even in joy. Relax. The maidens kept you because you were truly happy, not because you can mark a calendar."},
  {a:"把家人也接来一起待",r:"你的快乐要有人分享——这是你的软肋。可仙女说「罪牵君」，凡人是接不进来的，你只好自己偷着乐。",ea:"Bring the family in to stay too.",er:"Your joy must be shared. That is your weakness. But the maidens said fate holds you; mortals cannot be brought in. You will have to enjoy it secretly."},
  {a:"怕回去物是人非，宁可留下",r:"你已经预见到七世之后的荒凉，索性不回去了。逃避可耻但有用——只是午夜，你会不会也想听听百鸟之外的故人声？",ea:"Afraid of returning to a changed world. Prefer to stay.",er:"You foresee the desolation of seven generations and choose not to go back. Escape works, but shameful to use. At midnight, will you not want to hear a human voice among the hundred birds?"}
 ]},
{s:"《太平广记 · 南柯太守传》",t:"南柯一梦",img:"",
 o:"东平淳于棼，吴楚游侠之士。……年大梦，见二紫衣使者，跪曰：「槐安国王遣小臣致命奉邀。」……生上车，行可数十里，不觉已达城郭。……王赐生甲第，车骑服饰，玩好宾客，无不毕陈。……生自守郡二十载，风化广被，百姓歌谣，建功德碑，立生祠宇。王甚重之，赐食邑，锡爵位，居台辅。……俄而风雨暴至，舟覆，王命二使者送生归。生解襦就枕，忽然若寤。见家之僮仆拥篲于庭，二客濯足于榻，斜日未隐于西垣，余樽尚湛于东牖。梦中倏忽，若度一世矣。",
 w:"淳于棼醉卧槐树下，梦见两个紫衣使者奉槐安国国王之命请他入国。他做了驸马，出任南柯太守二十年，政绩卓著、百姓立碑，后来升任宰相、权倾朝野。忽然风雨大作，船翻被送回国。醒来一看，夕阳还在西墙，酒樽还在东窗——原来所谓槐安国，不过是槐树下的一个蚁穴。",
 u:"二十年荣华，一觉醒来，槐树根下只有蚁穴。功名再大，也大不过一樽酒的时间。",
 q:"你正在追逐的东西（职位、财富、名声），如果知道它最终只是「槐安国」——你还追吗？",
 en_s:"Taiping Guangji · Nanke Taishou Zhuan",en_t:"The Dream of the Southern Bough",en_o:"Chunyu Fen of Dongping was a knight-errant of Wu and Chu... One day, drunk and dreaming, he saw two messengers in purple silk, who knelt and said: The King of the Kingdom of Huai'an has sent us to invite you. Chunyu Fen boarded the carriage; after traveling several dozen li, he arrived at a walled city without knowing it. The King bestowed on him a great mansion; carriages, robes, ornaments, guests, nothing was lacking. For twenty years he governed Nanke as prefect; his influence spread far, the people sang his praises, erected tablets of merit, and built him shrines. The King valued him greatly, granted him lands and rank, and he rose to chief minister. Suddenly wind and rain broke the boat; the King ordered the two messengers to send him home. Chunyu Fen woke. He saw the household servant sweeping the courtyard, the two guests washing their feet by the couch; the setting sun had not yet left the western wall, and the wine was still full in the eastern window. In his dream, in a flash, he had lived a whole lifetime.",en_w:"Chunyu Fen dreamed that purple messengers carried him to the Kingdom of Huai'an. He became a prince consort, governed Nanke for twenty years with great success, rose to chief minister, then was sent home in a storm. Waking, the sun was still on the wall, the wine still in the cup. The kingdom was only an ant nest under the locust tree.",en_u:"Twenty years of glory, and in one nap, only an ant nest under the roots. No title is bigger than the time of one cup of wine.",en_q:"If what you are chasing, position, wealth, fame, turns out to be only a Southern Bough kingdom, do you still chase it?",opts:[
  {a:"追——就算是梦，也要做完整的梦",r:"你享受过程本身：当驸马、做太守、掌相位，梦里二十年也值。醒来看蚁穴，你也认——你本就是来体验的。",ea:"Chase it. Even a dream should be dreamed completely.",er:"You enjoy the process: consort, prefect, minister, twenty years of dream is worth it. Waking to the ant nest, you accept it. You came to experience."},
  {a:"不追了，清醒地过",r:"你是那个醒得最早的人。看破槐安国，就少了很多无谓的奔走。只是小心：太早看破，会不会连「做梦的兴致」也丢了？",ea:"Stop chasing. Live clear-eyed.",er:"You are the earliest to wake. Seeing through the Southern Bough saves you many useless errands. Only beware: wake too early, and you may lose the appetite for dreaming too."},
  {a:"追，但给自己设个醒来的钟",r:"你一边入梦一边定闹钟——做三年太守就走。分寸感是好的，但槐安国的钟，向来不是你想拨就能拨。",ea:"Chase, but set myself an alarm.",er:"You dream with a clock: three years as prefect, then leave. A sense of proportion is good, but the bell of Huai'an is not yours to ring."},
  {a:"把槐安国好好经营，当真的过",r:"你不纠结真假——蚁穴也罢，宫殿也罢，经营好眼前的日子就是真本事。这才是最务实的梦话。",ea:"Run the Southern Bough well. Treat it as real.",er:"You do not argue true or false. Ant nest or palace, managing today well is real skill. The most practical dream-talk."},
  {a:"惊醒之后，更努力追现实的名利",r:"你把梦当鞭子：既然人生短，更要抓紧。行，只是别从蚁穴出来，又钻进另一个蚁穴。",ea:"After waking, chase worldly fame even harder.",er:"You use the dream as a whip: life is short, so seize it. Fine. Just do not crawl out of one ant nest into another."},
  {a:"从此看淡，随缘而活",r:"你被这一觉点化了：槐安国之外，还有槐树、清风、酒樽。你开始学会享受「醒来」本身。",ea:"See through it and drift.",er:"You were enlightened by the nap: beyond the Southern Bough are the locust tree, the wind, the wine cup. You begin to enjoy waking itself."}
 ]},
{s:"《酉阳杂俎 · 续集卷一》",t:"叶限",img:"",
 o:"南人相传，秦汉前有洞主吴氏，妻早亡，有女名叶限，少慧，善陶金，父爱之。末岁父卒，为后母所苦，常令樵险汲深。时尝得一鳞，二寸余，赪鳍金目，遂潜养于盆水之中。……女掩其恨，以汲水伺之，至池侧，鱼必出首，以尾拍岸，良久乃没。后母知之，诈取鱼，食之。……女因游于野，衣絁衣，披翠衣，履金履。……及洞节，母往，令女守庭果。女伺母行远，亦往。衣翠纺衣，蹑履而往。……为母所觉，遂亡去。其金履为人所拾，鬻于国。国主得之，命国中妇人履之，无一称者。……使试之，其履不缩，称之而惬。……母及女氏，遂为飞石所击，死于击。……其后，国主纳叶限为后，其母及女，即为飞石击死。",
 w:"秦汉前有位洞主，女儿叶限聪慧，被后母虐待。她捡到一条金鳞小鱼，偷偷养大，鱼却被后母骗去吃掉。后来洞里过节，叶限穿着后母不许她穿的翠衣金履去赴会，被后母察觉，仓促逃走时丢了一只金鞋。金鞋被卖到邻国，国王下令全国女子试穿，只有叶限穿上正合脚。国王娶叶限为后，后母和她的女儿被飞石击死。",
 u:"这就是「灰姑娘」的东方原型——你的金履终会被捡起，但前提是：被踩到脚底时，你没有弄丢自己。",
 q:"在原生家庭/环境里受了委屈和不公，你还相信「会有人认得出我的金履」吗？",
 en_s:"Youyang Zazu · Sequel 1",en_t:"Ye Xian",en_o:"The southern people tell: before Qin and Han there was a cave chief of the Wu clan whose wife died early, leaving a daughter named Ye Xian, clever from childhood, skilled at gold-work, and beloved by her father. At the end of his life her father died, and she was tormented by her stepmother, often sent to cut firewood in danger and draw water in the deep. Once she found a fish, two inches long, with red fins and golden eyes, and secretly kept it in a basin of water. Concealing her grief, she went to the pond; the fish always raised its head and slapped the bank with its tail, then sank after a long while. The stepmother learned of it, stole the fish, and ate it. Ye Xian, roaming in the wilds, wore a silken gown, a green coat, and golden shoes. When the cave festival came, the mother went, ordering Ye Xian to guard the fruit trees. When the mother had gone far, Ye Xian went too, in her green silk and her shoes. Found out by the mother, she fled. One of her golden shoes was picked up by someone and sold in a neighboring kingdom. The king got it and ordered all the women of the kingdom to try it on; none fit. He had Ye Xian try it; the shoe did not shrink and fit her comfortably. The king took Ye Xian as his queen, and the stepmother and her daughter were struck dead by flying stones.",en_w:"Ye Xian, clever and beloved, was tormented by her stepmother after her father died. She raised a golden-eyed fish in secret; the stepmother tricked it away and ate it. At the cave festival Ye Xian wore her green gown and golden shoes; fleeing, she lost one shoe. The king of a neighboring land had all women try it; only Ye Xian fit. He made her his queen; the stepmother was struck dead by flying stones.",en_u:"This is the eastern original of Cinderella. Your golden shoe will be picked up one day, but only if, while trampled underfoot, you did not lose yourself.",en_q:"Having suffered unfairness in family or circumstance, do you still believe someone will recognize your golden shoe?",opts:[
  {a:"信——我先把自己养好",r:"你是叶限：小鱼养在盆里，本事藏在身上。不等别人来救，你先把自己的金鳞养亮——这样国王来的时候，你接得住。",ea:"Believe it. I will first grow myself well.",er:"You are Ye Xian: the small fish kept in the basin, the skill kept on the body. You do not wait to be saved; you first make your golden scales shine, so when the king comes, you can receive him."},
  {a:"半信半疑，但先攒着本事",r:"你一边委屈一边攒金履。这两件事不冲突——后母的石头会砸下来，但你的鞋，是砸不坏的。",ea:"Half believe. But first gather the skills.",er:"You gather your golden shoes while grieving. The two do not conflict. The stepmother's stones will fall, but your shoes cannot be smashed."},
  {a:"不信，只能靠自己",r:"你不等王子——自己开疆。可以，只是偶尔也该信一次：国王真的会派使者来试鞋，不是所有善意都是后母。",ea:"Do not believe. Only myself.",er:"You wait for no prince; you open your own land. Fine. But sometimes believe once: the king truly sends messengers to try the shoe. Not every goodwill is a stepmother."},
  {a:"把怨气变成离开的力气",r:"你是憋着口气走的叶限：越过山，越过海，让旧人够不着。跑得够远，金履才轮得到你说了算。",ea:"Turn resentment into the strength to leave.",er:"You are Ye Xian who left in anger: over the mountains, over the sea, beyond the old people's reach. Run far enough, and the golden shoe is yours to explain."},
  {a:"怕自己也被同化成后母那样",r:"你警惕自己变成施害者。这份警惕本身，就是你和后母的区别——她记仇，你记得住疼。",ea:"Afraid of becoming a stepmother myself.",er:"You guard against becoming the wrongdoer. That guard itself is the difference between you and the stepmother. She remembers the grudge; you remember the pain."},
  {a:"想着对妹妹好一点，别让她也受一遍",r:"你不想让下一代重复你的委屈——这才是真正的破局。叶限没有妹妹，你有；你当不成国王，但当得好姐姐。",ea:"Be kinder to the younger ones. Do not let them suffer the same.",er:"You refuse to hand the hurt down. That is the true breaking of the pattern. Ye Xian had no sister; you do. You may not be a king, but you can be a good older sister."}
 ]},
{s:"《太平广记 · 枕中记》",t:"黄粱一梦",img:"",
 o:"开元七年，道士有吕翁者，得神仙术，行邯郸道中，息邸舍，摄帽驰带隐囊而坐。俄见旅中少年，卢生……与翁共席而坐，言笑殊畅。久之，卢生顾其衣装敝亵，乃长叹息曰：「大丈夫生世不谐，困如是也！」翁曰：「观子形体，无苦无恚，谈谐方适，而叹其困者，何也？」生曰：「吾此苟生耳。何适之谓？」……翁乃探囊中枕以授之，曰：「子枕吾枕，当令子荣适如志。」……数月，娶清河崔氏女。女容甚丽，而产甚殷。由是衣装服驭，日益鲜盛。明年，举进士……累官至中书舍人，同列害之……又贬端州……后为御史大夫，久之，拜中书侍郎同中书门下平章事，与萧中令嵩、裴侍中光庭同执大政十余年。……逾年，病……是夕，薨。卢生欠伸而悟，见其身方偃于邸舍，吕翁坐其傍，主人蒸黍未熟，触类如故。蹶然而兴，曰：「岂其梦寐也？」翁谓生曰：「人生之适，亦如是矣。」",
 w:"卢生在邯郸旅店感叹自己穷困，道士吕翁给他一个枕头。他枕上便入梦：娶了美妻、中了进士、做了宰相、执掌朝政十几年，最后病逝。梦醒，旅店主人的黄粱饭还没蒸熟。卢生幡然醒悟：人生一世，不过如此。",
 u:"「黄粱未熟，一生已尽」——你怕的不是梦短，是梦醒时，饭还没熟。",
 q:"如果提前告诉你：你现在奋斗的一切，都只是「一枕黄粱」——你还会这么用力地活着吗？",
 en_s:"Taiping Guangji · Zhenzhong Ji",en_t:"The Dream of the Yellow Millet",en_o:"In the seventh year of Kaiyuan, a Taoist named Lu Weng, who had the art of immortals, was traveling the Handan road, resting at an inn, when he saw a young man in the inn, Lu Sheng... They sat on the same mat, talking and laughing freely. After a while, Lu Sheng looked at his shabby clothes and sighed long: A great man born into a world out of joint, trapped like this! Weng said: Looking at you, you are neither troubled nor angry, and your talk is pleasant. Why do you sigh over your straits? Sheng said: I am merely living by accident. What is pleasant about that? Weng then took a pillow from his bag and gave it to him, saying: Sleep on my pillow; it will bring you honor and ease as you wish. Within months he married the daughter of the Cui family of Qinghe. She was very beautiful, and her family wealthy. His clothes and carriage grew daily more splendid. The next year he passed the examinations... rose steadily to the rank of the Hanlin, was envied by colleagues... demoted to Duanzhou... later became Grand Censor, and finally Grand Councilor, holding the great affairs of state for more than ten years with his colleagues. After a year, he fell ill... that night he died. Lu Sheng stretched and woke, seeing his body lying in the inn, Lu Weng sitting beside him, and the innkeeper's yellow millet not yet cooked. Everything was as before. He started up and said: Was it a dream? Weng said to him: The pleasures of a life are just so.",en_w:"Lu Sheng, sighing over his poverty at a Handan inn, was given a pillow by the Taoist Lu Weng. He dreamed: married a beauty, passed the examinations, became a grand councilor, held power for over ten years, and died. He woke; the innkeeper's millet was not yet cooked. Everything was a dream.",en_u:"The millet is not cooked, and a lifetime is done. What you fear is not that the dream is short, but that when you wake, the meal is not ready.",en_q:"If you were told in advance that everything you strive for is only a pillow dream, would you still live this hard?",opts:[
  {a:"会——黄粱美梦，也是一生",r:"你是卢生梦里的那个卢生：梦里二十年，娶妻、中举、拜相，件件当真。知道是梦还用力，才是真的活着。",ea:"Yes. A good dream is still a life.",er:"You are the Lu Sheng inside the dream: twenty years, marriage, examinations, the premiership, each thing real. Knowing it is a dream and still living hard is the true way to live."},
  {a:"会，但活法会变——少些执念",r:"你被黄粱点化过：争名逐利少一点，当下吃饭睡觉多一点。这份「醒着做梦」的功夫，最难练。",ea:"Yes, but differently. Fewer attachments.",er:"You have been awakened by the millet: less contending for fame, more eating and sleeping in the present. This wakeful-dreaming skill is the hardest to practice."},
  {a:"早点醒，把力气花在真实处",r:"你不想把命押在仕途的枕头上——去做点蒸熟了的事：一顿饭、一段关系、一个爱好。这也是一种「悟」。",ea:"Wake early. Spend strength on what is real.",er:"You refuse to bet your life on an official pillow. Do something that is cooked: a meal, a relationship, a craft. That too is awakening."},
  {a:"想多睡几回，多体验几世",r:"你是贪心的做梦人——一生不够，要生生世世。可以，只是别忘了：每回醒来，你都要还魂到同一间邸舍。",ea:"Want to sleep a few more times. Experience more lives.",er:"You are the greedy dreamer: one life is not enough, you want life after life. Fine. Just remember: each waking, you must return your soul to the same inn."},
  {a:"觉得卢生傻，穷就穷，叹什么气",r:"你看得开，但卢生叹的其实是「衣装敝亵」的窘迫——你不羡慕富贵，大概也没被穷过。各有各的功课。",ea:"Think Lu Sheng foolish. Poor is poor; why sigh?",er:"You are open-minded, but Lu Sheng was sighing over shabby clothes. You do not envy wealth, perhaps because you have never been poor. Each has his own lesson."},
  {a:"梦里拜了相，醒来就想创业",r:"你把梦境当蓝本，把野心带回现实。行，黄粱给你开了眼界——但你得自己蒸熟那锅饭。",ea:"Dreamed of being premier, wake up and start a business.",er:"You take the dream as a blueprint and carry ambition back to reality. Fine. The millet opened your eyes. But you must cook that meal yourself."}
 ]},
{s:"《述异记 · 卷上》",t:"烂柯山",img:"",
 o:"信安郡石室山，晋时王质伐木至，见童子数人棋而歌，质因听之。童子以一物与质，如枣核，质含之，不觉饥。俄顷，童子谓曰：「何不去？」质起视，斧柯尽烂。既归，无复时人。",
 w:"晋朝王质上山砍柴，看见几个童子下棋唱歌，就放下斧头看棋。童子给他一个枣核一样的东西，含在嘴里不觉得饿。过了一会儿，童子说：你怎么还不走？王质起身一看，斧头的木柄已经烂透了。回到村里，已没有同时代的人了。",
 u:"你以为是「看了一会儿棋」，再抬头，斧柄已烂——专注的人，最容易不知不觉错过了整个人间。",
 q:"你有没有过「一低头就是一下午/一晚上/好几年」的沉浸？那之后，你错过的和得到的，哪个更多？",
 en_s:"Shuyiji · Scroll 1",en_t:"The Rotten Axe Handle",en_o:"At Shishi Mountain in Xin'an, in the Jin dynasty, Wang Zhi went to cut wood. He saw several boys playing chess and singing, and stopped to listen. One boy gave him something like a date kernel; Wang Zhi put it in his mouth and no longer felt hungry. After a while the boy said: Why do you not go? Wang Zhi rose and looked; his axe handle was entirely rotten. When he returned home, none of his contemporaries remained.",en_w:"Wang Zhi went up the mountain to cut wood and stopped to watch boys playing chess. One gave him a kernel; he felt no hunger. After a while, told to go, he found his axe handle rotted through. Back in the village, no one of his time was left.",en_u:"You thought it was a brief glance at a chess game. You look up, and the axe handle is rotten. The absorbed person most easily misses the whole human world.",en_q:"Have you ever sunk so deep that a moment became an afternoon, a night, years? Afterward, which did you lose and which did you gain?",opts:[
  {a:"有过，回头看又甜又慌",r:"你是王质：棋太好看，忘了时间。甜的是那会儿的沉浸，慌的是斧柄烂了、人间换了。值不值？你自己心里有数。",ea:"Have been there. Looking back, sweet and panicked.",er:"You are Wang Zhi: the game was too good, time forgot. Sweet is the immersion; panicked is the rotten handle and the changed world. Was it worth it? You know in your heart."},
  {a:"沉迷过，现在戒了",r:"你把自己的斧头从棋盘边拔出来了。戒是戒了，但偶尔路过棋摊，脚还是会停——那几秒，是你和烂柯山之间的小秘密。",ea:"Was obsessed. Now quit.",er:"You pulled your axe out of the chessboard. Quit is quit, but passing a chess stall, your feet still pause. Those seconds are your little secret with Rotten Mountain."},
  {a:"没有——我从不敢全情投入",r:"你太清醒，总留一只眼睛看时间。安全，但你大概也没尝过「斧柯尽烂」的极致快乐——那东西，比枣核还稀有。",ea:"Never. I never dare to give my whole self.",er:"You are too clear-eyed, always keeping one eye on the clock. Safe, but you have likely never tasted the extreme joy of the rotten handle. That thing is rarer than the date kernel."},
  {a:"把沉浸变成了职业/作品",r:"你是把烂柯山活成了事业的人：棋就是工作，沉浸就是产出。王质要是会直播下棋，大概也是你这样。",ea:"Turned the immersion into a career or work.",er:"You turned Rotten Mountain into a livelihood: chess is work, immersion is output. If Wang Zhi streamed chess, he would be like you."},
  {a:"后悔过——那年我不该看那盘棋",r:"你还在为「错过」结账。可王质回到村里无复时人，他也只是叹了口气——有些棋，看了就是看了，怨不得。",ea:"Regretted it. That game that year I should not have watched.",er:"You are still paying the bill for missing. But Wang Zhi returned to a village with no contemporaries and only sighed. Some games, once watched, are watched. Do not blame them."},
  {a:"觉得值——那种忘我的时刻，是人生的顶配",r:"你是王质的知音：朽一柄斧，换一盘棋，值。人生最贵的不是时间，是「不觉饥」的那种专注。",ea:"Think it worth it. That forgetting-the-self is life's peak.",er:"You are Wang Zhi's kindred spirit: one rotten axe for one game, worth it. The most expensive thing is not time, but the no-hunger focus."}
 ]},
{s:"《山海经 · 北山经》",t:"精卫填海",img:"",
 o:"又北二百里，曰发鸠之山，其上多柘木。有鸟焉，其状如乌，文首、白喙、赤足，名曰精卫，其鸣自詨。是炎帝之少女，名曰女娃。女娃游于东海，溺而不返，故为精卫，常衔西山之木石，以堙于东海。",
 w:"发鸠山上住着一只鸟，花脑袋、白嘴壳、红脚爪，名叫精卫，是炎帝的小女儿女娃的化身。女娃到东海游玩，溺水而亡，化作精卫鸟，每天从西山衔来树枝石子，要填平东海。",
 u:"用一根树枝，去填一片海——知其不可为而为之，是这世上最悲壮也最体面的活法。",
 q:"你心里有没有一件「明知填不平」的事——一段关系、一个理想、一次翻案？你还会衔枝去填吗？",
 en_s:"Shanhaijing · Beishan Jing",en_t:"Jingwei Fills the Sea",en_o:"Two hundred li further north is Fajiu Mountain, with many mulberry trees. On it is a bird, shaped like a crow, with a patterned head, a white beak, and red feet, named Jingwei, and its call sounds like its own name. It is the youngest daughter of the Flame Emperor, named Nüwa. Nüwa was playing in the Eastern Sea, drowned, and did not return; so she became Jingwei, and forever carries wood and stones from the Western Mountain to fill the Eastern Sea.",en_w:"On Fajiu Mountain lives a bird with a patterned head, white beak, and red feet, named Jingwei. It is the Flame Emperor's youngest daughter, Nüwa, who drowned in the Eastern Sea. Turned into the bird, she forever carries twigs and stones from the Western Mountain to fill the sea.",en_u:"With one twig, to fill a sea. Knowing it cannot be done and doing it anyway is the most tragic and most dignified way to live.",en_q:"Is there something in your heart you know you cannot fill, a relationship, an ideal, a vindication? Will you still carry twigs?",opts:[
  {a:"填——哪怕一世填不平",r:"你是精卫：衔木石、怼东海，风浪再大不停嘴。成败另说，你赢得了「体面」二字——这世上敢填海的人不多。",ea:"Carry. Even if one lifetime cannot fill it.",er:"You are Jingwei: carrying twigs, defying the Eastern Sea, not stopping no matter the waves. Success aside, you have won the word dignity. Few in this world dare to fill a sea."},
  {a:"填一阵，发现填不平就停",r:"你试过、疼过、认过。这叫止损，不叫认输——女娃如果生在现实，也会先算算西山的木石够不够。",ea:"Carry for a while, stop when I see it cannot be done.",er:"You tried, ached, admitted. That is stopping the loss, not surrender. If Nüwa lived in reality, she would also count whether the Western Mountain has enough wood."},
  {a:"不填了，绕海走",r:"你选绕行：路很长，但海不用填。聪明人干聪明事——只是每个浪头打过来时，你还是会看它一眼。",ea:"Do not carry. Walk around the sea.",er:"You choose the long way: the road is long, but the sea needs no filling. Clever people do clever things. Only, every wave that breaks, you still glance at it."},
  {a:"把填海的事写成歌/画/文字",r:"你给精卫的执着留个见证——你自己不填，但让后人知道有人填过。这份传递，也是另一种「堙于东海」。",ea:"Write the sea-filling down. In songs, paintings, words.",er:"You leave a witness to Jingwei's stubbornness: you do not fill it yourself, but you let later generations know someone tried. That transmission is also a filling."},
  {a:"看心情——今天填一嘴，明天歇一嘴",r:"你是间歇性精卫。没坏处，但注意：东海的浪是天天来的，你的木石要是三天打鱼两天晒网，海面只会越涨越高。",ea:"Depends on mood. One beak today, rest tomorrow.",er:"You are the intermittent Jingwei. Nothing wrong. But note: the Eastern Sea's waves come every day. If your twigs come two days out of three, the sea only rises."},
  {a:"教孩子接着填",r:"你把执念传了下去。可以——只是要想清楚：你是真信能填平，还是舍不得放下那只鸟？",ea:"Teach the children to carry on.",er:"You pass the stubbornness down. Fine. But think clearly: do you truly believe it can be filled, or are you just unable to put down the bird?"}
 ]},
{s:"《阅微草堂笔记 · 槐西杂志一》",t:"老翁捕虎",img:"",
 o:"族兄中涵知旌德县时，近城有虎暴，伤猎户数人，不能捕。邑人请曰：「非聘徽州唐打猎，不能除此患也。」……老翁手一短柄斧，纵八九寸，横半之，奋臂屹立。虎扑至，侧首让之，虎自顶上跃过，已血流仆地。视之，自颔下至尾闾，皆触斧裂矣。",
 w:"旌德县闹虎患，伤了好几个猎户。有人请来徽州唐家打虎的老翁。老翁手持一把短柄斧，老虎扑过来时，他侧身一让，斧子迎着虎腹——老虎从头顶跃过，落地时已经血流仆地。一看，从下巴到尾根，都被斧刃剖开。",
 u:"打虎的不是力气，是那几十年的「让」与「等」——老虎扑过来的一瞬，他等了一辈子。",
 q:"面对一个你躲不开的「猛虎」（难缠的人、硬仗、绝境），你相信「基本功」还是「拼一把」？",
 en_s:"Yuewei Caotang Biji · Huaixi Zazhi 1",en_t:"The Old Man Who Killed the Tiger",en_o:"When my cousin Zhonghan was magistrate of Jingde County, there was a tiger near the city, wounding several hunters who could not catch it. The county folk said: Nothing will remove this scourge but inviting Tang Da-Lie of Huizhou. The old man held a short-handled axe, eight or nine inches long and half as wide, and stood with arm raised, unmoving. The tiger charged; he turned his head to let it pass, and the tiger leapt over his head and fell to the ground bleeding. Looking at it, from under its chin to its tail, it had been split open by the axe.",en_w:"Jingde County suffered a tiger that had wounded several hunters. Someone recommended the old Tang family hunter of Huizhou. The old man stood with a short axe; when the tiger sprang, he turned his head, let it leap over, and the tiger fell dead, split from chin to tail by the axe.",en_u:"Killing a tiger is not strength. It is the letting and waiting of decades. The instant the tiger springs, he had waited his whole life for it.",en_q:"Facing an unavoidable tiger, a hard person, a tough battle, a dead end, do you trust fundamentals or a brave gamble?",opts:[
  {a:"信基本功——先把斧子磨利",r:"你是老翁型：不炫技，不冒进，把一招练到极致。虎扑来时你只需让一步——那一斧，是你几十年的利息。",ea:"Trust fundamentals. Sharpen the axe first.",er:"You are the old man: no showing off, no rushing; practice one move to perfection. When the tiger springs, you need only one step aside. That axe is the interest on decades."},
  {a:"信拼一把——气势上不能输",r:"你靠血性打虎。可以赢小虎，但唐家老翁那种大虫，你这一扑，多半是给人家送菜。练两年再来。",ea:"Trust the gamble. Spirit must not lose.",er:"You fight on blood. You may win against a small tiger, but a great one like the Tang family's, your leap is mostly a meal delivered. Practice two years and come back."},
  {a:"先问清楚虎的习性再动手",r:"你研究对手：虎从哪来、几时出、吃几个猎人。这是兵法，不是怯懦——老翁让虎，也是让在它最熟的招上。",ea:"Study the tiger's habits first, then move.",er:"You research the enemy: where it comes from, when it comes out, how many hunters it has eaten. That is strategy, not cowardice. The old man also let the tiger pass on its favorite move."},
  {a:"找帮手，别单打独斗",r:"你信「请唐打猎」——专业的事交给专业的人。这是聪明的县域治理，只是别忘了自己也得练两下。",ea:"Find helpers. Do not fight alone.",er:"You trust inviting Tang Da-Lie: professionals for professional work. Wise county governance. Only, remember to practice a little yourself."},
  {a:"用陷阱和智谋，不硬碰",r:"你是猎户里的秀才：挖坑、设饵、下套。虎是猛，但架不住人会用脑子——唐家老翁靠斧，你靠坑，殊途同归。",ea:"Use traps and cunning. No head-on clash.",er:"You are the scholar among hunters: dig pits, lay bait, set snares. The tiger is fierce, but brains beat brawn. The old Tang family uses an axe; you use pits. Both reach the same end."},
  {a:"绕着走，虎在就别进山",r:"你选择避开虎患区域。保全性命是王道——但旌德县城就在山脚，你绕得开虎，绕不开「近城有虎暴」的叹息。",ea:"Walk around. Do not enter the mountain while the tiger is there.",er:"You choose to avoid the tiger zone. Keeping your life is kingly. But the county town sits at the mountain's foot. You can avoid the tiger, not the sighs of a tiger near the city."}
 ]},
{s:"《搜神记 · 卷十一》",t:"范式张劭",img:"",
 o:"范式字巨卿，山阳金乡人也，一名氾。少游太学，为诸生，与汝南张劭为友。劭字元伯。二人并告归乡里。式谓元伯曰：「后二年当还，将过拜尊亲，见孺子焉。」乃共克期日。后期方至，元伯具以白母，请设馔以候之。母曰：「二年之别，千里结言，尔何相信之审邪？」对曰：「巨卿信士，必不乖违。」母曰：「若然，当为尔酝酒。」至其日，巨卿果到，升堂拜饮，尽欢而别。",
 w:"范式和张劭在太学结为好友，分别时约定两年后范式去张家拜访。张劭母亲说：两年之约、千里之言，你怎么信得这么实？张劭说：巨卿是守信的人，必不违背。到了那天，范式果然到了，登堂拜见，尽欢而别。后来张劭病故，范式梦见他说：我死了，葬在某日。范式千里奔丧，如期而至，亲自执绋送葬。",
 u:"两年之约，千里之言，他信得毫不迟疑——这世间最贵重的承诺，从来不是海誓山盟，是说到做到。",
 q:"你有没有答应过别人一件「两年后」的事？你还记得吗？而你自己，又信过谁的「千里之言」？",
 en_s:"Soushen Ji · Scroll 11",en_t:"Fan Shi and Zhang Shao",en_o:"Fan Shi, courtesy name Juqing, of Jinshi in Shanyang, studied at the Imperial Academy as a young man, and befriended Zhang Shao of Runan, courtesy name Yuanbo. The two returned home together, and Fan said to Yuanbo: In two years I will come back; I will visit your parents and see your children. They fixed the day. When the time approached, Yuanbo told his mother and asked her to prepare food to wait for him. His mother said: A two-year parting, a promise made a thousand li away, why do you believe it so firmly? He answered: Juqing is a man of his word; he will not fail. His mother said: If so, I will brew wine for you. On the day, Juqing indeed arrived, ascended the hall, drank, and parted in great joy. Later Zhang Shao died of illness; Fan Shi dreamed he said: I am dead, buried on such a day. Fan Shi journeyed a thousand li, arrived on the day, and personally held the funeral cord.",en_w:"Fan Shi and Zhang Shao swore friendship at the Academy and fixed a two-year meeting. Zhang Shao's mother doubted: a promise from a thousand li? Zhang Shao said: Juqing keeps his word. On the day, Fan Shi came. When Zhang Shao later died, Fan Shi dreamed the burial date and traveled a thousand li to attend.",en_u:"A two-year promise, a thousand-li word, believed without hesitation. The most precious vow is never a pledge of love, but word kept.",en_q:"Have you ever promised someone something for two years later? Do you still remember? And whose thousand-li word have you trusted?",opts:[
  {a:"答应的事，刻在心里，到日子就去",r:"你是范式。一言既出，千里必赴。这样的人不多，所以你身边的人，都敢把两年后的日子托付给你。",ea:"A promise carved in the heart. When the day comes, I go.",er:"You are Fan Shi. One word, and you cross a thousand li. Such people are few, so those around you dare to trust you with days two years away."},
  {a:"会记得，但会先打个电话确认",r:"你守信，也留余地。范式不需要确认，但现实里你的谨慎并不减损承诺的分量——只要别把确认变成推脱的借口。",ea:"I remember, but I would call first to confirm.",er:"You keep your word, with room to spare. Fan Shi needed no confirmation, but your caution does not cheapen the promise, as long as confirming is not an excuse to back out."},
  {a:"随口答应过，早忘了",r:"你是那个忘了约定的巨卿。答应时是真心的，忘也是真忘——只是张劭那边的饭桌，一直摆到今天。",ea:"Promised casually. Long forgotten.",er:"You are the Juqing who forgot. Sincere when promising, truly forgotten after. Only, Zhang Shao's table has been set until today."},
  {a:"不敢信别人的远期承诺",r:"你被爽约伤过。可以理解，但也别错过范式这样的人——他们不常出现，出现一次，值得你摆一桌饭。",ea:"I dare not trust others' long-term promises.",er:"You were burned by a broken promise. Understandable. But do not miss the Fan Shis of this world. They are rare, and when one appears, he is worth a set table."},
  {a:"答应，但没底气一定做到",r:"你太清楚自己的斤两。那就把话说明白：我可以去，但先别摆饭。坦白，有时候比承诺更重。",ea:"Promise, but not sure I can keep it.",er:"You know your own measure. Then say so plainly: I can try, but do not set the table yet. Frankness is sometimes heavier than a vow."},
  {a:"为了一句承诺，千里奔丧也去",r:"范式梦中托信，他真去了。你也是这样的人：承诺不止于活着的时候，它通到生死那一头。",ea:"For one promise, I would travel a thousand li to a funeral.",er:"Fan Shi dreamed the message and truly went. You are like him: a promise does not end while you live; it reaches to the other side of life and death."}
 ]},
{s:"《搜神记 · 卷十一》",t:"东海孝妇",img:"",
 o:"汉时，东海孝妇养姑甚谨。姑欲嫁之，终不肯。姑谓邻人曰：「孝妇事我勤苦，哀其无子守寡。我老，久累丁壮，奈何？」其后姑自经死，姑女告吏：「妇杀我母。」吏捕孝妇，孝妇辞不杀姑。吏验治，孝妇自诬服。具狱上府，于公以为此妇养姑十余年，以孝闻，必不杀也。太守不听。于公争之，弗能得，乃抱其具狱，哭于府上，因辞疾去。太守竟论杀孝妇。郡中枯旱三年。",
 w:"东海有个孝妇，侍奉婆婆十分恭谨。婆婆年老，怕拖累她，自缢而死。小姑却告官说孝妇杀了婆婆。官吏严刑逼供，孝妇屈打成招。于公明知冤情，据理力争，太守不听，她还是被杀了。此后郡中大旱三年——直到新太守重审此案，替孝妇昭雪，天立刻降下大雨。",
 u:"冤案最可怕的地方，不是一个人死了，是「按程序」死了——而天旱三年，是天替她记着。",
 q:"当你明知一件事是错的（冤枉、甩锅、程序正义下的不公），但程序已经走了、人头已经落地——你会像于公一样据理力争吗？",
 en_s:"Soushen Ji · Scroll 11",en_t:"The Filial Wife of Donghai",en_o:"In Han times, a filial wife of Donghai served her mother-in-law with great care. The mother wished to marry her off, but she would not go. The mother said to a neighbor: She serves me hard and I pity her, childless and widowed. I am old and have long been a burden to a strong woman. What is to be done? Afterward the mother hanged herself, and her daughter accused the wife: She killed my mother. The officers arrested the filial wife, who denied it. Examined under torture, she made a false confession. The case went up to the prefecture, and Yu Gong held that this woman had served her mother-in-law over ten years, known for her filial piety; she could not have killed her. The prefect would not listen. Yu Gong argued, failed, took the case papers in his arms, wept before the office, and resigned on grounds of illness. The prefect had the filial wife executed. The county was parched with drought for three years.",en_w:"A filial wife of Donghai served her mother-in-law devotedly. The old mother, fearing she was a burden, hanged herself. The sister accused the wife of murder; tortured, she confessed falsely. Yu Gong argued the injustice in vain; she was executed. The county then suffered drought for three years, until a new prefect reopened the case and cleared her; rain fell at once.",en_u:"The horror of an injustice is not that one person dies, but that she dies by procedure. The three-year drought is Heaven keeping the account.",en_q:"When you know clearly that something is wrong, a frame-up, a scapegoat, an injustice under procedural justice, but the procedure has run and the head has fallen, would you argue like Yu Gong?",opts:[
  {a:"争到底，哪怕得罪太守",r:"你是于公——抱着案卷在府上哭。你可能救不回来，但至少那三年大旱里，有你哭过的一声。",ea:"Fight to the end, even offending the prefect.",er:"You are Yu Gong, weeping over the case papers in the office. You may not save her, but in those three years of drought, there is one cry from you."},
  {a:"程序走完了，就认了",r:"你信流程的权威。孝妇正是死在流程里——流程会错，你要做的不是信它，是看着它。",ea:"The procedure has run. Accept it.",er:"You trust the authority of process. The filial wife died precisely in process. Process errs; your job is not to trust it, but to watch it."},
  {a:"私下查清楚，再决定怎么办",r:"你不当面硬顶，先取证。聪明，但案子结了再查，往往只能给后人留个教训。",ea:"Investigate quietly first, then decide.",er:"You do not confront head-on; you gather evidence first. Smart. But once the case is closed, investigating usually only leaves a lesson for posterity."},
  {a:"忍——胳膊拧不过大腿",r:"你掂量过代价。于公也辞了官。你保全了自己，只是大旱那几年，你夜里睡得好吗？",ea:"Endure. The arm cannot beat the thigh.",er:"You weighed the cost. Yu Gong resigned too. You preserved yourself. Only, in those drought years, did you sleep well at night?"},
  {a:"把证据递上去，尽人事",r:"你把能做的都做了，结果交给上头。这不算软弱——于公也是先争、后哭、再辞，三样都做全了。",ea:"Submit the evidence. Do what is humanly possible.",er:"You do what can be done and leave the result to the higher-ups. That is not weakness. Yu Gong also argued, wept, and resigned, all three."},
  {a:"等一个新太守，再翻案",r:"你信时间会给出公道。东海是三年后翻的案——你要有耐心，也要有替她等下去的命。",ea:"Wait for a new prefect, then reopen the case.",er:"You trust time to deliver justice. Donghai was retried after three years. Have the patience, and the luck to live that long."}
 ]},
{s:"《聊斋志异 · 卷一》",t:"陆判",img:"tale_32.jpg",
 o:"陵阳朱尔旦，字小明，性豪放，然素钝，学虽勤，未知名。一日，文社众饮，或戏之云：「君有豪名，能深夜负十王殿判官像来者，当共醵饮。」朱笑而起，径去。少顷，负判官来，置几上，拱手曰：「多蒙见招，长夜无俚，适得一饮。」众视之，则冥司判官陆也。……居无何，判官来，谓朱曰：「君心之恶念未除，欲为君换心。」……一夜，朱醉卧，判官至，剖胸出心，以新心纳之。天明，朱醒，视胸间有红线……自此文思大进，过眼不忘。",
 w:"陵阳书生朱尔旦豪放却愚钝，和朋友打赌，深夜背回十王殿的判官像，从此与陆判官成了好友。陆判见他心窍不通，趁他醉卧，剖开胸膛换了一颗慧心。朱尔旦从此文思大进，过目不忘，后来果然考中功名。",
 u:"你缺的从来不是努力，是那颗「过目不忘」的心——而换心这种事，多半得靠你自己剖开点什么。",
 q:"如果真有陆判能给你换一颗「聪明的心」，代价是从此没那么天真了——你换不换？",
 en_s:"Liaozhai Zhiyi · Scroll 1",en_t:"Judge Lu",en_o:"Zhu Erdan of Lingyang, courtesy name Xiaoming, was by nature bold and free, but slow-witted; though he studied diligently, he won no fame. One day the literary club was drinking, and someone joked: You have a bold name; if you dare carry the statue of the Judge from the Hall of Ten Kings here at midnight, we will all treat you to wine. Zhu laughed, rose, and went. In a little while he came back carrying the Judge, set it on the table, and bowed: Thank you for the invitation; the long night was dull, and I have brought myself a drink. They looked at it; it was the Judge Lu of the underworld. Before long the Judge came to him and said: The evil thoughts in your heart have not been removed; I will change your heart for you. One night, while Zhu slept drunk, the Judge came, opened his chest, took out the heart, and put in a new one. At dawn Zhu woke and saw a red line on his chest. From then on his literary thoughts advanced greatly, and he never forgot what he once read.",en_w:"Zhu Erdan, bold but dull, wagered on carrying the Judge's statue from the Hall of Ten Kings at midnight, and so befriended Judge Lu. Seeing his slow wit, the Judge, while he lay drunk, opened his chest and exchanged his heart for a clever one. Zhu's scholarship soared, and he passed the examinations.",en_u:"What you lack is never effort, but a heart that never forgets. And changing hearts is usually done by cutting something open yourself.",en_q:"If Judge Lu could give you a clever heart, at the price of never being naive again, would you trade?",opts:[
  {a:"换——我想要过目不忘",r:"你羡慕朱尔旦的奇遇。可以，但换了心之后，他再也做不回那个敢背判官像的莽人——聪明有聪明的孤独。",ea:"Trade. I want to forget nothing.",er:"You envy Zhu Erdan's luck. Fine. But after the exchange, he could never again be the reckless man who carried the Judge's statue. Cleverness has its own loneliness."},
  {a:"不换——我就喜欢自己这笨样",r:"你看重的是坦荡。朱尔旦的心虽钝，胆却豪——你守着的，恰恰是聪明人最缺的那股劲儿。",ea:"No trade. I like my dull self.",er:"You value candor. Zhu's heart was slow, but his courage was grand. What you keep is precisely what the clever lack."},
  {a:"换一半——聪明点，但别太精明",r:"你想取个中间值。可惜陆判不提供定制——现实中，人是一点一点变聪明的，没法只拿一半。",ea:"Half. Clever, but not shrewd.",er:"You want the middle. But Judge Lu offers no customization. In reality, people grow clever bit by bit; you cannot take only half."},
  {a:"自己练，不靠换",r:"你是实务派：心换不来，书能读来。对，朱尔旦要是有你这觉悟，也不用等陆判了。",ea:"Train myself. No exchange.",er:"You are the practical one: the heart cannot be exchanged, but books can be read. Right. With your awareness, Zhu would not have needed the Judge."},
  {a:"换了之后，怕认不出自己",r:"你怕聪明改变你。这是真问题——多少人在变聪明的路上，弄丢了当年那个敢打赌的自己。",ea:"After the trade, afraid of not recognizing myself.",er:"You fear cleverness changing you. A real fear. How many, on the road to cleverness, lose the one who dared to wager?"},
  {a:"先问清楚：换心要什么代价",r:"你谨慎。陆判没要代价——但现实里，每一次「变聪明」，都拿什么东西换了。",ea:"Ask first: what is the price of the exchange?",er:"You are cautious. Judge Lu asked no price. But in reality, every gain of cleverness spends something."}
 ]},
{s:"《聊斋志异 · 卷二》",t:"阿宝",img:"",
 o:"粤西孙子楚，名士也。生有枝指。性迂讷，人诳之，辄信为真。适值清明，妇女游冶，见一女子去之甚远，而妖姿要妙，绝代无双。众问之，孙云：「此女必阿宝也。」……女戏曰：「渠去其枝指，余当归之。」生闻之，以斧自断其指，大痛彻心，血益倾注，滨死。……生痴情所至，魂离躯体，从女而去，同居三日，遂起。女闻而益怜之。",
 w:"粤西名士孙子楚生有六指，性情迂讷。清明偶遇绝色女子阿宝，众人打趣：你剁掉六指，阿宝就嫁你。他真的用斧头剁掉手指，痛得几乎死掉。痴情所致，魂魄离开身体，跟着阿宝去了，同居三日才回来。阿宝听说，越发怜惜他。",
 u:"别人当笑话的一句话，他当了真，还剁了手指——世人都笑痴人，可让魂魄离体的，偏偏就是这痴。",
 q:"你曾为一个人或一件事「痴」到什么程度？那种近乎犯傻的认真，你现在还肯付出吗？",
 en_s:"Liaozhai Zhiyi · Scroll 2",en_t:"Abao",en_o:"Sun Zichu of western Guangdong was a famous scholar, born with an extra finger. His nature was simple and slow; people fooled him and he took it as truth. On the Qingming festival, as women strolled, he saw a girl far off, of exquisite grace, peerless. Asked, Sun said: That must be Abao. The girl joked: If he cuts off his extra finger, I will marry him. Hearing this, Sun cut off his finger with an axe, in great pain, blood gushing; he nearly died. In the extremity of his passion, his soul left his body and followed the girl, living with her three days before he rose again. The girl heard and pitied him the more.",en_w:"Sun Zichu, a famous scholar with six fingers, simple and slow, met the beauty Abao at Qingming. Someone joked: cut off your extra finger and she will marry you. He truly chopped it off with an axe, nearly dying. In his passion his soul left his body to follow her for three days. Abao, hearing this, loved him the more.",en_u:"A joke, he took seriously, and cut off his finger. The world laughs at fools, but it is precisely the foolish whose souls can leave their bodies.",en_q:"How foolish have you once been for a person or a cause? Would you still pay that near-mad seriousness today?",opts:[
  {a:"痴过——现在想想挺傻，但不后悔",r:"你剁过手指。疼是真的，魂跟着人家走也是真的。不后悔，是因为那三年魂不守舍，是你活过最像自己的日子。",ea:"Was foolish. Looking back, silly, but no regrets.",er:"You cut off your finger. The pain was real, and the soul following her was real. No regrets, because those three years of lost sleep were the years you most lived as yourself."},
  {a:"不敢再痴了——怕受伤",r:"你被烫过，学会了收着。可以理解，只是阿宝的魂不跟清醒的人走——你收着收着，连自己都找不到了。",ea:"Dare not be foolish again. Afraid of hurt.",er:"You were burned and learned to hold back. Understandable. But Abao's soul does not follow the clear-headed. Hold back long enough, and you lose yourself too."},
  {a:"我只对事痴，不对人痴",r:"你把痴给了事业、学问、手艺。这也是痴——只是深夜里，会不会觉得缺点什么？",ea:"I am foolish only for things, not people.",er:"You give your foolishness to work, learning, craft. That too is passion. Only, in the deep night, does something feel missing?"},
  {a:"在心里痴，面上装得云淡风轻",r:"你藏得深。孙子楚是藏不住的痴，你是藏得住的——他成了传奇，你成了体面人。",ea:"Foolish inside, serene outside.",er:"You hide deep. Sun could not hide his foolishness; you can. He became a legend; you became a decent person."},
  {a:"理解他，但我绝不会剁手指",r:"你清醒、理性，是围观群众。可以，但阿宝这样的奇遇，从来只配给疯子——你错过了，也别惋惜。",ea:"I understand him, but I would never cut off a finger.",er:"You are clear-eyed, rational, one of the crowd. Fine. But Abao's miracle only comes to madmen. You missed it; do not grieve."},
  {a:"分不清自己是真痴还是装痴",r:"你连自己都骗过去了。其实真痴的人从不问自己痴不痴——你会问，说明你还留着退路。",ea:"Cannot tell if I am truly foolish or pretending.",er:"You have fooled even yourself. The truly foolish never ask whether they are foolish. That you ask means you keep an exit."}
 ]},
{s:"《聊斋志异 · 卷三》",t:"连城",img:"",
 o:"乔生，晋宁人。少负才名。……史孝廉有女，字连城，工刺绣，知书。父所娇爱。出所刺倦绣图，征少年题咏，意在择婿。生献诗云：「慵鬟高髻绿婆娑，早向兰窗绣碧荷。刺到鸳鸯魂欲断，暗停针线蹙双蛾。」女得诗喜，对父称赏。父贫之。女逢人辄称道；又遣媪矫父命，赠金以助灯火。生叹曰：「连城我知己也！」倾怀结想，如饥思啖。……无何，女病瘵死。生往临吊，一痛而绝。",
 w:"晋宁乔生才名满城，史家小姐连城绣了一幅倦绣图征诗择婿。乔生的诗最合她心意，她逢人便夸，还偷偷送钱资助他读书。乔生叹道：连城是我的知己！后来连城病逝，乔生前往吊唁，一恸而绝——魂魄追着连城去了阴间，历经艰险把她救回阳世。",
 u:"她要的不是富贵，是一句「刺到鸳鸯魂欲断」——世上最难得的不是有人爱你，是有人懂你。",
 q:"「懂你」和「爱你」，如果只能选一样，你会选哪个？你身边有没有那个一眼看穿你诗里心事的人？",
 en_s:"Liaozhai Zhiyi · Scroll 3",en_t:"Liancheng",en_o:"Qiao Sheng of Jinning was known for talent from youth. The Filial Lian's daughter, Liancheng, was skilled in embroidery and well-read, beloved of her father. He put out her embroidery, the Weary Embroiderer, and called for verses from young men, meaning to choose a son-in-law. Qiao presented a poem: Languid hair in high coils of green, early to the orchid window to embroider blue lotus. Stitching the mandarin ducks, the soul would break; she secretly stops the needle and knits her brows. The girl was pleased with the poem and praised it to her father. He found Qiao poor. The girl praised him to everyone; and sent an old nurse, pretending her father's order, with gold to help his lamp-oil. Qiao sighed: Liancheng is my soul-mate! His heart opened to her, hungering like one starving. Before long she fell ill and died. Qiao went to mourn, and died of one grief.",en_w:"Qiao Sheng's poem won Liancheng's heart in the verse contest on her embroidery. She praised him to all and secretly sent money for his studies. He called her his soul-mate. When she died of illness, he mourned and died of grief, and his soul followed her to the underworld, bringing her back through dangers.",en_u:"She did not want wealth, but one line: stitching the mandarin ducks, the soul would break. The rarest thing is not being loved, but being understood.",en_q:"Being understood and being loved, if you could choose only one, which? Is there someone who sees through the cares in your poem at one glance?",
 opts:[
  {a:"选懂——爱可以慢慢有，懂是可遇不可求",r:"你是乔生。连城嫁不了你，但她的知遇让你连命都肯豁出去——懂，比爱更让人死心塌地。",ea:"Choose understood. Love can grow; understanding cannot be sought.",er:"You are Qiao Sheng. Liancheng could not marry him, but her understanding made him stake his life. Understanding binds harder than love."},
  {a:"选爱——懂不懂，日子总能过",r:"你是务实派。对，大多数婚姻不需要魂欲断，需要柴米油盐。只是夜深时，你那个「无人懂」的空，总得拿什么填。",ea:"Choose loved. Understood or not, life goes on.",er:"You are the pragmatist. True, most marriages need rice and salt, not soul-breaking. Only, at night, the emptiness of being unread must be filled with something."},
  {a:"贪心——两个都想要",r:"你既盼知音又盼伴侣。可以，但现实里，懂你的人未必爱你，爱你的人未必懂你——你得先想好把谁放在心里。",ea:"Greedy. Want both.",er:"You hope for soul-mate and partner. Fine. But in reality, the one who understands you may not love you, and the one who loves you may not understand you. Decide who goes in your heart first."},
  {a:"先懂自己，再说别人懂不懂我",r:"你自己都不明白自己的心事，怎么等别人看穿？连城能读懂乔生，是因为乔生的诗先写透了自己。",ea:"Understand myself first; then speak of others.",er:"You do not even know your own cares, so who can read them? Liancheng read Qiao Sheng because his poem first wrote himself through."},
  {a:"觉得知己是奢侈品，不奢求",r:"你把「懂」看淡了，反而容易遇见——不指望的人，常常在某个深夜，收到一句正中下怀的话。",ea:"Soul-mates are luxuries. Do not hope.",er:"You have lowered the expectation, and that is how you may meet one. Those who expect nothing often receive, in some deep night, a sentence that strikes home."},
  {a:"为知己而死？我更想为知己活着",r:"乔生一恸而绝，你又把他拉了回来：懂你的人若在，你就该好好活着，别让她白懂一场。",ea:"Die for a soul-mate? I would rather live for one.",er:"Qiao Sheng died of grief; you pull him back: if the one who understands you lives, live well yourself, and do not let her understanding be wasted."}
 ]},
{s:"《聊斋志异 · 卷六》",t:"小谢",img:"",
 o:"渭南姜部郎第，多鬼魅，常惑人，因徙去。留苍头门之而死，易他仆，数易皆死，遂废之。里有陶生望三，夙倜傥，好狎妓，酒中辄笑。友人劝之曰：「君恃胆力，可往居之。」……生入，见二女，一约二十，一可十七八，并皆姝丽。……生曰：「阴教风雅，俗骨可医，当为汝师。」……因教之读，女颖悟，目下十行。……后二女相继为生生子，皆中进士。",
 w:"渭南姜家老宅闹鬼，没人敢住。书生陶望三自恃胆大，住了进去，遇见两个女鬼——小谢和秋容，都是被恶鬼胁迫的孤魂。陶生不惧，教她们读书写字，说：阴间也有风雅，俗骨可医，我当你们的老师。两个女鬼从顽皮到敬重，后来被陶生的正直打动，得以托生，与他结为夫妇。",
 u:"别人怕鬼，他把鬼当学生教——原来驱散心魔的最好办法，不是符咒，是把日子过得正经。",
 q:"你身边有没有一个「大家都躲着」的人？你愿意走近他、教他一点什么吗？",
 en_s:"Liaozhai Zhiyi · Scroll 6",en_t:"Xiao Xie",en_o:"The mansion of Minister Jiang of Weinan was haunted; ghosts often deluded people, and the family moved away. The old servant left to watch it died; they changed servants, several died in turn, and the house was abandoned. In the village lived the scholar Tao Wangsan, gallant by nature. A friend urged him: You trust your courage; go live there. Tao entered and saw two girls, one about twenty, one about seventeen or eighteen, both beautiful. Tao said: Even in the shades, elegance can be taught; vulgar bones can be cured. I will be your teacher. He taught them to read, and the girls were quick, reading ten lines at a glance. In the end the two girls bore him sons, and both passed the examinations.",en_w:"The Jiang mansion was haunted and abandoned. The bold scholar Tao Wangsan moved in and met two girl ghosts, Xiao Xie and Qiurong, both coerced by an evil demon. Unafraid, Tao taught them to read, saying: elegance can be taught even in the shades. Moved by his integrity, the girls were reborn and married him.",en_u:"Others feared ghosts; he took them as students. The best way to dispel inner demons is not incantations, but living a decent life.",en_q:"Is there someone everyone avoids in your circle? Would you walk closer and teach them something?",opts:[
  {a:"愿意——人都有值得教的地方",r:"你是陶生：鬼都敢收作学生。你相信风雅能医俗骨——所以你的朋友圈里，总有人被你带得更好。",ea:"Yes. Everyone has something worth teaching.",er:"You are Tao: you would take a ghost as a student. You believe elegance cures vulgar bones, and the people around you are better for it."},
  {a:"保持距离，礼貌但不多事",r:"你温和而清醒：可以善待，不为师。对，陶生是拿命在赌的——你的分寸感，让你活得平安，也少了几段传奇。",ea:"Keep distance. Polite, but not involved.",er:"You are gentle and clear-eyed: be kind, but not a teacher. True, Tao was betting his life. Your sense of proportion keeps you safe, and short of a few legends."},
  {a:"躲远点，免得惹麻烦",r:"你怕惹祸上身。可以理解，只是老宅里的鬼，未必都凶——有些鬼，只是没人愿意先开口。",ea:"Stay far away. Avoid trouble.",er:"You fear trouble. Understandable. But not all ghosts in the old mansion are fierce. Some only lack a first word."},
  {a:"看情况——他值得才教",r:"你讲究值不值得。陶生教她们时不知道后来会成眷属——有些好，是在教的过程中才长出来的。",ea:"Depends. Teach only if worthy.",er:"You weigh worth. Tao did not know the girls would become his family. Some good grows only in the teaching itself."},
  {a:"我自己还学不过来呢",r:"你自顾不暇。真实。只是别忘了：教别人，往往是最快的自学——小谢读得快，陶生教得更明白。",ea:"I cannot even learn my own lessons.",er:"You are overwhelmed. Real. But remember: teaching others is the fastest way to learn. Xiao Xie read fast; Tao taught clearer."},
  {a:"怕教出个白眼狼",r:"你被辜负过。可以提防，但别因噎废食——小谢和秋容后来是真心敬陶生为师的。",ea:"Afraid of raising an ingrate.",er:"You were let down before. Guard yourself, but do not choke on one bone. Xiao Xie and Qiurong truly honored Tao as teacher."}
 ]},
{s:"《聊斋志异 · 卷十一》",t:"香玉",img:"",
 o:"劳山下清宫，耐冬高二丈，大数十围，牡丹高丈余，花时璀璨似锦。胶州黄生，舍读其中。一日，自窗中见女郎，素衣掩映花间。……女曰：「妾，香玉，隶籍平康巷。被道士闭置山中，实非所愿。」……生闻之，益怜香玉，而爱卿云。……逾年，香玉忽死，生痛悼欲绝。……乃于牡丹旁掘至数尺，见根株已朽。生泣，以指爪掐去朽株，犹抱之而眠。……翌日，香玉复苏。",
 w:"劳山下清宫里，有株牡丹高丈余，花开时璀璨如锦。书生黄生住在这里读书，遇见花中女子香玉，两人相恋。后来牡丹被道士挖走，香玉香消玉殒。黄生悲痛欲绝，在花根处掘地数尺，见根已朽，他哭着掐去朽株，抱着残根入睡。第二天，牡丹重新发芽，香玉回来了——原来是他的一片深情，让花死而复生。",
 u:"花死而复生，靠的不是雨露，是有人抱着残根睡了一夜——深情，是这个世界上最小的奇迹。",
 q:"你为失去的东西哭过、守着过「残根」吗？你信不信，深情有时真的能把枯死的东西焐活？",
 en_s:"Liaozhai Zhiyi · Scroll 11",en_t:"Xiangyu",en_o:"At the Lower Qing Palace on Lao Mountain grew a peony over a zhang tall; when it bloomed it blazed like brocade. Huang Sheng of Jiaozhou lodged there to study. One day from the window he saw a girl in white, half hidden among the flowers. The girl said: I am Xiangyu, of the pleasure quarter; shut into the mountain by a Taoist, against my will. Huang pitied her and loved her. After a year Xiangyu suddenly died; Huang grieved to the point of death. He dug by the peony to a depth of several feet and saw the roots rotted. Weeping, he scraped away the rotten wood with his fingers and slept holding it. The next day Xiangyu revived.",en_w:"In the Lower Qing Palace grew a peony that blazed like brocade. Scholar Huang Sheng fell in love with Xiangyu, the flower's spirit. When a Taoist dug the peony away, Xiangyu died. Huang grieved, dug to the rotted roots, scraped the rot away, and slept holding them. The next day the peony sprouted again, and Xiangyu returned.",en_u:"The flower revived not by dew, but because someone slept holding the dead root. Deep love is the smallest miracle in this world.",en_q:"Have you wept over something lost and kept vigil over its dead root? Do you believe deep love can sometimes warm the withered back to life?",opts:[
  {a:"信——我守过，也焐活过",r:"你是黄生。掐去朽株，抱根而眠。你信的不是花，是深情本身——所以你失去的东西，总有一部分能回来。",ea:"Believe it. I have kept vigil, and warmed things back.",er:"You are Huang: scrape the rot, sleep holding the root. You believe not in flowers but in love itself, and some of what you lose always returns."},
  {a:"不信——枯了就是枯了",r:"你理性。对，大多数牡丹挖走就是挖走了。但黄生不理性，所以他等到了——你没错，只是错过了奇迹的入口。",ea:"Do not believe. Withered is withered.",er:"You are rational. True, most peonies once dug are gone. But Huang was not rational, and so he waited long enough. You are not wrong; you just missed the gate of the miracle."},
  {a:"会哭，但不会守着残根",r:"你允许自己难过，然后往前走。这是健康的分寸——只是有些花，恰恰是在你转身之后才醒的。",ea:"I would weep, but not keep vigil.",er:"You allow yourself grief, then move on. A healthy measure. Only, some flowers wake just after you turn away."},
  {a:"想守，但怕被人说傻",r:"你在乎旁人的眼光。黄生抱着根睡觉时，道士说他疯了——可复活的那天，谁还记得疯话？",ea:"Want to keep vigil, but fear being called a fool.",er:"You mind the eyes of others. When Huang slept on the root, the Taoist called him mad. On the day of revival, who remembered the mad talk?"},
  {a:"把残根埋好，好好告别",r:"你选择体面的告别：埋了，立个碑，每年浇一杯酒。这也是深情的一种——香玉若知，也会念你好。",ea:"Bury the root properly. Say a good goodbye.",er:"You choose a dignified farewell: bury, mark, pour a cup of wine each year. That too is love. Xiangyu, if she knew, would remember you kindly."},
  {a:"不信深情，信科学——花靠根系活",r:"你说得对，根没死透才能复活。但黄生掐掉朽株的那一刻，谁能证明他不是那个「根系」？",ea:"Not love, science. Flowers live by their roots.",er:"Correct: the root must not be wholly dead. But at the moment Huang scraped the rot, who could prove he was not the root itself?"}
 ]},
{s:"《聊斋志异 · 卷一》",t:"王六郎",img:"",
 o:"许姓，家淄之北郭，业渔。每夜，携酒河上，饮且渔。饮则酹地，祝云：「河中溺鬼得饮。」……一夜，方独酌，有少年来，徘徊其侧。……问其姓字，曰：「姓王，无字，第六郎。」……王曰：「明日业满，当有代者，将往投生。」……至明日，果见妇人抱婴儿来，及河而堕。儿抛岸上，扬手掷足而啼。妇沉浮者屡矣，忽淋淋攀岸以出，藉地少息，抱儿径去。当妇溺时，王儿郎心中恻然，遂舍之。",
 w:"许姓渔夫每夜在河上饮酒打渔，总把酒洒进河里敬溺死鬼。有个少年王六郎常来对饮——他正是河里的溺死鬼。一天六郎说：我明天期满，该有人替我投生了。第二天，果然有个妇人抱着孩子落水。孩子被抛上岸啼哭，妇人几沉几浮——六郎心里不忍，放过了她。妇人爬上岸抱着孩子走了。因这一念之善，天帝嘉许，封六郎做了土地神。",
 u:"当「翻身的机会」摆在面前，代价是踩着一个无辜的人——六郎心软了。那一软，比投胎更值钱。",
 q:"如果有一个「顶替别人」就能上岸的机会摆在面前——抢走别人的职位、名额、机会——你会心动吗？",
 en_s:"Liaozhai Zhiyi · Scroll 1",en_t:"Wang Liulang",en_o:"A man surnamed Xu lived north of the wall of Zi, a fisherman by trade. Every night he carried wine to the river, drinking and fishing. He poured wine on the ground and prayed: Let the drowned ghosts of the river drink. One night as he drank alone, a youth came and lingered beside him. Asked his name, he said: Surname Wang, no style, sixth son. Wang said: Tomorrow my term ends; one who is to be replaced will come, and I will be reborn. The next day a woman indeed came holding a baby and fell into the river. The child was thrown onto the bank, crying and kicking. The woman sank and floated many times, then suddenly climbed the bank dripping, rested a little, took the child, and went away. When she was drowning, Wang felt pity in his heart and let her go.",en_w:"Fisherman Xu drank wine on the river every night, pouring some for drowned ghosts. A youth, Wang Liulang, the river's ghost, often drank with him. One day he said: my term ends tomorrow; a replacement will come. The next day a woman with a baby fell in. The baby was flung ashore crying. Moved to pity, Liulang let her go. For this one thought of goodness, Heaven made him a god of the soil.",en_u:"When the chance to rise stands before you at the price of treading on an innocent, Liulang's heart softened. That softening was worth more than rebirth.",en_q:"If a chance to rise by displacing someone, their post, their seat, their opportunity, were set before you, would your heart move?",opts:[
  {a:"不抢——别人也有孩子要养",r:"你是六郎。妇人的孩子在岸上哭，你的心就软了。那一软，可能让你多等几年，也可能让你等来神位。",ea:"Not take it. They have children to raise too.",er:"You are Liulang. The baby crying on the bank softened you. That softness may cost years, or earn you a shrine."},
  {a:"会犹豫，但最终不抢",r:"你在利益和良心之间挣扎过。挣扎不丢人——六郎也「心中恻然」了一下，才做出选择。重要的是结果。",ea:"Hesitate, but in the end not take it.",er:"You wrestled between gain and conscience. The wrestling is no shame. Liulang also paused. What matters is the result."},
  {a:"抢——机不可失",r:"你务实。可以，但六郎的故事说：那个妇人若被替死，你上岸的第一夜，会不会听见婴儿的哭声？",ea:"Take it. Opportunity knocks once.",er:"You are practical. Fine. But Liulang's tale asks: if the woman were replaced, would you hear the baby's cry on your first night ashore?"},
  {a:"先看看对方是谁，再决定",r:"你权衡对象。可六郎不知道妇人的身份，他还是放过了——恻隐之心，是不挑对象的。",ea:"Look first at who the other is.",er:"You weigh the target. But Liulang did not know the woman and still let her go. Compassion does not choose its object."},
  {a:"帮对方一把，自己再想办法",r:"你选择双赢：救她，也救自己。六郎没帮上忙，但你的路更宽——只是要小心，别把帮人也算成筹码。",ea:"Help her, and find my own way.",er:"You choose the win-win: save her and save yourself. Liulang could not help, but your road is wider. Only, do not count helping as a chip."},
  {a:"换了我，大概也放不下",r:"你承认自己的软肋。承认就好——恻隐之心人人有，只是有的被利益盖住了，有的被盖住又翻了出来。",ea:"I would probably not be able to let it go either.",er:"You admit your soft spot. Good. Compassion is in everyone; only, some have it buried under gain, and some have it buried, then dug out again."}
 ]},
{s:"《后汉书 · 孔融传》",t:"孔融让梨",img:"",
 o:"孔融，字文举，鲁国人，孔子二十世孙也。融四岁，与诸兄共食梨，融辄引小者。大人问其故，答曰：「我小儿，法当取小者。」由是宗族奇之。",
 w:"孔融四岁时，和哥哥们一起吃梨，每次都拿小的。大人问他为什么，他说：我是小孩，按规矩应当拿小的。全族人都觉得他不寻常。",
 u:"四岁让梨是家教，长大之后还「让」——那才是真本事。让，不是不会争，是明白了什么值得争。",
 q:"从小被教的「谦让」，长大后在资源有限的世界里，你还让得起吗？",
 en_s:"Hou Han Shu · Kong Rong Zhuan",en_t:"Kong Rong Gives the Pears",en_o:"Kong Rong, courtesy name Wenju, was a man of Lu, the twentieth-generation descendant of Confucius. When he was four, eating pears with his brothers, he always took the small ones. An elder asked why, and he answered: I am the youngest; by custom I should take the small one. For this his clan marveled at him.",en_w:"At four, Kong Rong, eating pears with his brothers, always took the smallest. Asked why, he said: I am the child; by rule I take the small one. The whole clan thought him extraordinary.",en_u:"Giving the pear at four is upbringing. Still giving when grown, that is the real skill. Giving is not being unable to take; it is knowing what is worth taking.",en_q:"Taught from childhood to yield, in a world of scarce resources, can you still afford to yield?",opts:[
  {a:"让——小的其实够吃",r:"你是四岁那个孔融。真让得下，是因为心里清楚：梨子有大小，人心没大小——你拿小的，赢得的是整桌人的敬。",ea:"Yield. The small one is enough.",er:"You are Kong Rong at four. You can truly yield because you know: pears differ in size, hearts do not. You take the small one and win the table's respect."},
  {a:"看场合让——该争的争",r:"你长大了：谦让留给家人，竞争留给战场。对，孔融后来当官也没少争——让梨是教养，不是软弱。",ea:"Yield by occasion. Fight where it matters.",er:"You have grown: courtesy for family, competition for the battlefield. Right. Kong Rong fought plenty as an official. Giving pears is breeding, not weakness."},
  {a:"凭什么让我让",r:"你被「让」字伤过——从小让到大，没人记得你的好。可以不平，但别让怨恨盖过你的教养。",ea:"Why should I yield?",er:"You were hurt by the word yield, giving since childhood, no one remembering your kindness. Grieve, but do not let resentment bury your breeding."},
  {a:"让了，但心里不舒服",r:"你的让带着委屈。孔融让梨时是真心觉得该拿小的——如果让得心不甘情不愿，不如明说，大家都轻松。",ea:"Yield, but not happily.",er:"Your yielding carries grievance. Kong Rong took the small pear gladly. If you cannot yield willingly, say so plainly, and everyone breathes easier."},
  {a:"教会孩子让，但不强迫",r:"你是聪明的家长：讲道理，不压着孩子让。对，孔融是自发让的——强迫出来的让，迟早会在别处爆出来。",ea:"Teach children to yield, but not by force.",er:"You are a wise parent: reason, not pressure. Right. Kong Rong yielded of his own accord. A forced yield bursts out elsewhere sooner or later."},
  {a:"让给别人，自己饿着",r:"你让过头了。孔融只让了梨，没让出自己。善良要有底线——别把「该拿的」也全让出去。",ea:"Yield to others, starve myself.",er:"You yield too much. Kong Rong gave only the pear, not himself. Kindness needs a bottom line. Do not give away what you should keep."}
 ]},
{s:"《世说新语 · 德行》",t:"陈蕃扫屋",img:"",
 o:"陈仲举言为士则，行为世范，登车揽辔，有澄清天下之志。为豫章太守，至，便问徐孺子所在，欲先看之。主簿白：「群情欲府君先入廨。」陈曰：「武王式商容之闾，席不暇暖。吾之礼贤，有何不可！」",
 w:"陈蕃少时独居一室，庭院芜秽，他从不打扫。父亲的朋友薛勤来访，问他：你怎么不洒扫庭院接待客人？陈蕃说：大丈夫处世，当扫除天下，安事一室乎？薛勤说：一屋不扫，何以扫天下？后来陈蕃果然成了名臣，有澄清天下之志。",
 u:"「一屋不扫，何以扫天下」——不是让你天天扫地，是提醒你：志气再大，也得从手边的事做起。",
 q:"你心里有没有「扫天下」的大志，却总觉得手边的小事配不上你？",
 en_s:"Shishuo Xinyu · De Xing",en_t:"Chen Fan Sweeps the House",en_o:"Chen Zhongju's words were a rule for scholars and his conduct a model for the age; when he took the reins of his carriage he had the ambition to purify the world. As governor of Yuzhang, on arrival he asked where Xu Ruzi lived, wishing to see him first. The registrar said: The crowd hopes you will first enter the office. Chen said: King Wu paid homage at the lane of Shang Rong before his mat was warm. Why should my honoring the worthy be improper?",en_w:"When young, Chen Fan lived alone in one room, the courtyard overgrown, never swept. A friend's elder, Xue Qin, asked: why not sweep the courtyard for guests? Chen said: a great man should sweep the world, not one room. Xue Qin said: if you cannot sweep one room, how will you sweep the world? Chen Fan later became a great minister with the ambition to purify the realm.",en_u:"One room unswept, how sweep the world? It is not a call to sweep daily, but a reminder: however great the ambition, it begins with what lies at hand.",en_q:"Do you carry the ambition to sweep the world, yet feel the small tasks at hand are beneath you?",opts:[
  {a:"先扫屋，再扫天下",r:"你听进了薛勤的话。对，陈蕃后来真扫了天下——但他也是从豫章太守、从先去看徐孺子这样的「小事」做起的。",ea:"Sweep the room first, then the world.",er:"You heard Xue Qin. Right. Chen Fan did sweep the world in the end, but he began with small things like visiting Xu Ruzi as governor."},
  {a:"我就要扫天下，屋先放着",r:"你是少年陈蕃。有志气。可以，但记得：天下是一屋一屋连起来的——至少，扫一屋也耽误不了你扫天下。",ea:"I will sweep the world. The room waits.",er:"You are young Chen Fan, ambitious. Fine. But remember: the world is made of rooms. Sweeping one room delays nothing."},
  {a:"屋也不扫，天下也管不了",r:"你两头都放弃了。陈蕃至少还有志——你先把志气找回来，扫地的事，顺便就做了。",ea:"Neither room nor world.",er:"You gave up both. Chen Fan at least had the ambition. First find your ambition; the sweeping will follow."},
  {a:"雇人扫屋，我专心大事",r:"你务实：把琐事外包，精力留给大事。也对——薛勤要批评的是「不屑于小事」，不是「不做小事」。",ea:"Hire someone to sweep. I mind the big things.",er:"You are practical: outsource the trivial, save strength for the great. Right. Xue Qin criticized the contempt for small things, not the doing of them by others."},
  {a:"觉得这句话是pua",r:"有人拿它pua你。但故事本身是中性的：陈蕃回应的是「大志之人不拘小节」，薛勤提醒的是「连小节都不屑的人，大节也悬」。你选哪句？",ea:"Think this saying is gaslighting.",er:"Someone has used it on you. But the tale itself is neutral: Chen Fan answered that great men do not dwell on details; Xue Qin warned that he who despises small matters may hang on big ones. Which line do you take?"},
  {a:"先把自己这间屋扫干净",r:"你从自己入手：房间、作息、财务、情绪。对，扫天下之前，人都是先把自己的屋扫干净的——这本身就在扫天下。",ea:"Sweep my own room clean first.",er:"You start with yourself: the room, the routine, the finances, the mood. Right. Before sweeping the world, everyone sweeps their own room. That itself is sweeping the world."}
 ]},
{s:"《世说新语 · 言语》",t:"桓温叹柳",img:"",
 o:"桓公北征经金城，见前为琅邪时种柳，皆已十围，慨然曰：「木犹如此，人何以堪！」攀枝执条，泫然流泪。",
 w:"桓温北征经过金城，看见自己年轻时在琅邪种下的柳树，都已十围粗了，感慨地说：树尚且如此，人怎么经得住！攀着枝条，泫然泪下。",
 u:"树犹如此，人何以堪——不是怕老，是怕老了回头一看，年轻时种下的东西，都长成了别人的风景。",
 q:"你年轻时种下的「柳树」（梦想、关系、手艺），如今长成什么样了？你回看的时候，是欣慰还是泫然？",
 en_s:"Shishuo Xinyu · Yan Yu",en_t:"Huan Wen Sighs at the Willows",en_o:"Duke Huan, on his northern campaign, passed through Jincheng and saw the willows he had planted when governor of Langye; they were now ten arm-spans around. He sighed deeply: The trees are already so; how can man endure! He took hold of a branch, and tears fell.",en_w:"Huan Wen, passing Jincheng on campaign, saw willows he had planted in his youth, now ten spans around. He sighed: the trees are already so; how can man endure! He gripped a branch and wept.",en_u:"The trees already so; how can man endure. It is not the fear of age, but the fear of looking back and finding that what you planted in youth has grown into scenery for others.",en_q:"The willows you planted young, dreams, bonds, crafts, what have they grown into? Looking back, are you comforted or moved to tears?",opts:[
  {a:"欣慰——树长成了，我也没辜负",r:"你种柳时认真，回头时坦然。十围的树是你二十年的年轮——你配得上这份枝繁叶茂。",ea:"Comforted. The tree grew, and I did not fail it.",er:"You planted seriously and look back calmly. A ten-span tree is twenty years of your rings. You deserve that green."},
  {a:"泫然——树还在，人散了",r:"你和桓温一样，柳还在，同行的人不在了。别只叹气——至少你还记得谁种的树，比树忘了我强。",ea:"Moved to tears. The tree stands; the people scattered.",er:"You are Huan Wen: the willows remain, the companions gone. Do not only sigh. At least you remember who planted the trees. Better than the trees forgetting you."},
  {a:"我种的是花，早就谢了",r:"你把力气花在易谢的东西上。花谢了不是你的错，是花期本就短——但下次，可以试着种点扛得住年的。",ea:"I planted flowers. Long faded.",er:"You spent strength on things that fade easily. Their fading is not your fault; the season was short. But next time, plant something that can bear the years."},
  {a:"一直在种，从没回头看",r:"你只顾低头种，不敢回头数。怕什么？桓温是看到十围才哭的——你连看都不敢，怎么知道值不值？",ea:"Still planting. Never look back.",er:"You plant with your head down and dare not count. Why not? Huan Wen wept only after seeing ten spans. You have not even dared to look; how do you know the worth?"},
  {a:"没种过什么，一直在赶路",r:"你活得匆忙，没来得及种树。现在开始也不晚——种一棵能长十年的，十年后你就有得攀了。",ea:"Planted nothing. Always rushing.",er:"You lived in haste and never planted a tree. It is not too late. Plant one that grows for ten years, and in ten years you will have something to hold."},
  {a:"树长得比我想象的快",r:"你低估了时间。其实时光就是这样：你不抬头，它替你长。怕的不是快，是你还没准备好它长得这么快。",ea:"The trees grew faster than I expected.",er:"You underestimated time. It grows while you look away. The fear is not the speed, but not being ready for it."}
 ]},
{s:"《世说新语 · 雅量》",t:"谢安围棋",img:"",
 o:"谢公与人围棋，俄而谢玄淮上信至，看书竟，默然无言，徐向局。客问淮上利害，答曰：「小儿辈大破贼。」意色举止，不异于常。",
